<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TurboWarp Project Player</title>

    <!-- TurboWarp Scaffolding -->
    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: #f5f5f5;
            font-family: sans-serif;
            padding: 20px;
        }


        h1 {
            margin-top: 0;
        }


        /* =========================================
           操作エリア
           ========================================= */

        .input-area {
            margin-bottom: 15px;
        }


        #projectId {
            width: 300px;
            padding: 8px;
            font-size: 16px;
        }


        button {
            padding: 8px 14px;
            margin-left: 5px;
            font-size: 16px;
            cursor: pointer;
        }


        /* =========================================
           ステータス
           ========================================= */

        #status {
            margin: 10px 0;
            min-height: 24px;
        }


        .error {
            color: #d00000;
        }


        .success {
            color: #008000;
        }


        /* =========================================
           プロジェクト情報
           ========================================= */

        #projectInfo {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }


        /* =========================================
           ステージの外側
           
           通常時：
           480 × 360 を中央に表示
           ========================================= */

        #stageArea {
            width: 100%;
            height: 360px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: 15px;
        }


        /*
         * Scaffoldingを入れる場所
         *
         * Scaffoldingはこの要素の
         * width / height に合わせて表示される。
         */

        #project {
            width: 480px;
            height: 360px;

            background: black;

            flex-shrink: 0;
        }


        /* =========================================
           通常表示モード
           ========================================= */

        body.normal-mode {
            overflow: auto;
        }


        /* =========================================
           最大化モード
           
           画面全体をステージ領域にする。
           ただし4:3を維持する。
           ========================================= */

        body.maximized-mode {
            padding: 0;
            margin: 0;
            overflow: hidden;
        }


        body.maximized-mode #stageArea {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;

            display: flex;

            justify-content: center;
            align-items: center;

            background: black;

            z-index: 9999;
        }


        /*
         * 最大化時のproject。
         *
         * width/heightを100%にすることで、
         * Scaffoldingのpreserve-ratioが
         * 画面内に4:3で収めてくれる。
         */

        body.maximized-mode #project {

            width: 100%;
            height: 100%;

            max-width: 100vw;
            max-height: 100vh;
        }


        /* =========================================
           最大化時の操作ボタン
           
           ステージの上に表示
           ========================================= */

        #stageControls {

            position: fixed;

            top: 10px;
            right: 10px;

            z-index: 10000;

            display: flex;

            gap: 5px;
        }


        #stageControls button {

            margin-left: 0;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid #aaa;

            border-radius: 4px;
        }


        /* =========================================
           ダウンロード
           ========================================= */

        #downloadArea {
            margin-top: 15px;
        }


        #downloadSb3 {
            display: none;
        }

    </style>
</head>


<body class="normal-mode">


<h1>TurboWarp Project Player</h1>


<!-- =========================================
     プロジェクト入力
     ========================================= -->

<div class="input-area">

    <input
        id="projectId"
        type="text"
        placeholder="Scratch Project ID"
    >

    <button id="loadButton">
        読み込む
    </button>

    <button id="stopButton">
        停止
    </button>

    <button id="normalButton">
        中央表示
    </button>

    <button id="maximizeButton">
        最大化
    </button>

</div>


<!-- =========================================
     ステータス
     ========================================= -->

<div id="status">
    Project IDを入力してください。
</div>


<!-- =========================================
     プロジェクト情報
     ========================================= -->

<div id="projectInfo"></div>


<!-- =========================================
     ステージ
     ========================================= -->

<div id="stageArea">

    <div id="project"></div>

</div>


<!-- =========================================
     ダウンロード
     ========================================= -->

<div id="downloadArea">

    <a
        id="downloadSb3"
        download
    >
        <button>
            SB3をダウンロード
        </button>
    </a>

</div>


<!-- =========================================
     JavaScript
     ========================================= -->

<script>


/* =========================================================
   グローバル変数
   ========================================================= */

let scaffolding = null;

let currentSb3 = null;

let currentProjectId = null;


/* =========================================================
   HTML要素
   ========================================================= */

const projectIdInput =
    document.getElementById("projectId");


const loadButton =
    document.getElementById("loadButton");


const stopButton =
    document.getElementById("stopButton");


const normalButton =
    document.getElementById("normalButton");


const maximizeButton =
    document.getElementById("maximizeButton");


const statusElement =
    document.getElementById("status");


const projectInfoElement =
    document.getElementById("projectInfo");


const projectElement =
    document.getElementById("project");


const stageArea =
    document.getElementById("stageArea");


const downloadSb3 =
    document.getElementById("downloadSb3");


/* =========================================================
   ステータス表示
   ========================================================= */

function setStatus(message, type = "") {

    statusElement.textContent = message;

    statusElement.className = type;
}


/* =========================================================
   Scaffolding初期化
   ========================================================= */

function initializeScaffolding() {

    console.log(
        "Scaffolding初期化開始"
    );


    /*
     * Scaffolding作成
     */

    scaffolding =
        new Scaffolding.Scaffolding();


    /*
     * Scratchの論理ステージサイズ
     */

    scaffolding.width = 480;

    scaffolding.height = 360;


    /*
     * 縦横比を維持
     *
     * これが重要。
     *
     * 最大化してもScratchの
     * 480:360 = 4:3を維持する。
     */

    scaffolding.resizeMode =
        "preserve-ratio";


    /*
     * その他設定
     */

    scaffolding.editableLists = false;

    scaffolding.shouldConnectPeripherals = true;

    scaffolding.usePackagedRuntime = false;


    /*
     * 初期化
     */

    scaffolding.setup();


    /*
     * project要素へ追加
     */

    scaffolding.appendTo(
        projectElement
    );


    /*
     * Storage
     *
     * v0.2.0環境でstorageが公開されている場合のみ使用
     */

    if (
        scaffolding.storage &&
        typeof scaffolding.storage.addWebStore === "function"
    ) {

        const storage =
            scaffolding.storage;


        storage.addWebStore(

            [
                storage.AssetType.ImageVector,
                storage.AssetType.ImageBitmap,
                storage.AssetType.Sound
            ],

            (asset) => {

                return (
                    "https://assets.scratch.mit.edu/internalapi/asset/" +
                    asset.assetId +
                    "." +
                    asset.dataFormat +
                    "/get/"
                );

            }
        );


        console.log(
            "Scratchアセットサーバーを設定しました"
        );

    } else {

        console.warn(
            "scaffolding.storage は利用できません"
        );

    }


    /*
     * 初期レイアウト
     */

    scaffolding.relayout();


    console.log(
        "Scaffolding初期化完了"
    );
}


/* =========================================================
   通常表示
   ========================================================= */

function setNormalMode() {

    /*
     * 最大化解除
     */

    document.body.classList.remove(
        "maximized-mode"
    );


    document.body.classList.add(
        "normal-mode"
    );


    /*
     * CSS変更後に
     * Scaffoldingへサイズ変更を通知
     */

    if (scaffolding) {

        requestAnimationFrame(() => {

            scaffolding.relayout();

        });

    }


    console.log(
        "ステージを中央表示に変更"
    );
}


/* =========================================================
   最大化
   ========================================================= */

function setMaximizedMode() {

    /*
     * 最大化
     */

    document.body.classList.remove(
        "normal-mode"
    );


    document.body.classList.add(
        "maximized-mode"
    );


    /*
     * CSSが反映された後に
     * Scaffoldingのレイアウトを更新
     *
     * これをしないとマウス座標が
     * 以前の480×360位置のままになる
     * 可能性がある。
     */

    if (scaffolding) {

        requestAnimationFrame(() => {

            scaffolding.relayout();

        });

    }


    console.log(
        "ステージを最大化"
    );
}


/* =========================================================
   ウィンドウサイズ変更
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (!scaffolding) {
            return;
        }


        /*
         * ウィンドウサイズ変更後に
         * Scaffoldingへ通知
         */

        requestAnimationFrame(() => {

            scaffolding.relayout();

        });

    }
);


/* =========================================================
   プロジェクトメタデータ取得
   ========================================================= */

async function getProjectMetadata(
    projectId
) {

    const response =
        await fetch(
            `https://trampoline.turbowarp.org/api/projects/${projectId}`
        );


    if (response.status === 404) {

        throw new Error(
            "プロジェクトが存在しないか、非共有プロジェクトです。"
        );

    }


    if (!response.ok) {

        throw new Error(
            `メタデータ取得エラー: HTTP ${response.status}`
        );

    }


    return await response.json();
}


/* =========================================================
   SB3取得
   ========================================================= */

async function getProjectData(
    projectId,
    metadata
) {

    const token =
        metadata.project_token;


    if (!token) {

        throw new Error(
            "project_token が取得できませんでした。"
        );

    }


    const response =
        await fetch(
            `https://projects.scratch.mit.edu/${projectId}?token=${token}`
        );


    if (!response.ok) {

        throw new Error(
            `SB3取得エラー: HTTP ${response.status}`
        );

    }


    return await response.arrayBuffer();
}


/* =========================================================
   プロジェクト情報表示
   ========================================================= */

function displayProjectInfo(
    metadata
) {

    const title =
        metadata.title ?? "不明";


    const author =
        metadata.author?.username ??
        metadata.creator ??
        "不明";


    projectInfoElement.innerHTML = `

        <strong>タイトル:</strong>
        ${escapeHtml(title)}

        <br>

        <strong>作者:</strong>
        ${escapeHtml(author)}

        <br>

        <strong>ID:</strong>
        ${escapeHtml(
            String(metadata.id ?? "")
        )}

    `;
}


/* =========================================================
   HTMLエスケープ
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;
}


/* =========================================================
   SB3ダウンロード
   ========================================================= */

function setupSb3Download(
    sb3Buffer,
    projectId
) {

    const blob =
        new Blob(
            [sb3Buffer],
            {
                type:
                    "application/x.scratch.sb3"
            }
        );


    const url =
        URL.createObjectURL(blob);


    downloadSb3.href =
        url;


    downloadSb3.download =
        `${projectId}.sb3`;


    downloadSb3.style.display =
        "inline-block";
}


/* =========================================================
   プロジェクト読み込み
   ========================================================= */

async function loadProject() {

    const projectId =
        projectIdInput.value.trim();


    if (!projectId) {

        setStatus(
            "Project IDを入力してください。",
            "error"
        );

        return;
    }


    /*
     * Project IDは数字のみ
     */

    if (!/^\d+$/.test(projectId)) {

        setStatus(
            "Project IDは数字で入力してください。",
            "error"
        );

        return;
    }


    try {

        /*
         * メタデータ
         */

        setStatus(
            "プロジェクト情報を取得中..."
        );


        const metadata =
            await getProjectMetadata(
                projectId
            );


        console.log(
            "Metadata:",
            metadata
        );


        displayProjectInfo(
            metadata
        );


        /*
         * SB3
         */

        setStatus(
            "SB3を取得中..."
        );


        const sb3Buffer =
            await getProjectData(
                projectId,
                metadata
            );


        currentSb3 =
            sb3Buffer;


        currentProjectId =
            projectId;


        /*
         * ダウンロード
         */

        setupSb3Download(
            sb3Buffer,
            projectId
        );


        /*
         * Scaffolding
         */

        setStatus(
            "TurboWarp Playerに読み込み中..."
        );


        await scaffolding.loadProject(
            sb3Buffer
        );


        /*
         * 読み込み後にレイアウトを再計算
         */

        scaffolding.relayout();


        /*
         * 実行
         */

        scaffolding.greenFlag();


        setStatus(
            "読み込み完了。",
            "success"
        );


        console.log(
            "プロジェクト実行開始"
        );

    } catch (error) {

        console.error(
            "プロジェクト読み込みエラー:",
            error
        );


        setStatus(
            "エラー: " +
            error.message,
            "error"
        );

    }
}


/* =========================================================
   停止
   ========================================================= */

function stopProject() {

    if (!scaffolding) {
        return;
    }


    try {

        scaffolding.stopAll();


        setStatus(
            "プロジェクトを停止しました。"
        );


    } catch (error) {

        console.error(
            "停止エラー:",
            error
        );

    }
}


/* =========================================================
   ボタン
   ========================================================= */

loadButton.addEventListener(
    "click",
    loadProject
);


stopButton.addEventListener(
    "click",
    stopProject
);


normalButton.addEventListener(
    "click",
    setNormalMode
);


maximizeButton.addEventListener(
    "click",
    setMaximizedMode
);


/* =========================================================
   Enterキー
   ========================================================= */

projectIdInput.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {

            loadProject();

        }

    }
);


/* =========================================================
   初期化
   ========================================================= */

try {

    initializeScaffolding();


    setStatus(
        "Project IDを入力してください。"
    );


} catch (error) {

    console.error(
        "TurboWarp Playerの初期化に失敗しました。",
        error
    );


    setStatus(
        "TurboWarp Playerの初期化に失敗しました: " +
        error.message,
        "error"
    );

}

</script>

</body>
</html>
