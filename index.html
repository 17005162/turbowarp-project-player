<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurboWarp Project Player</title>

<!-- TurboWarp Scaffolding -->
<script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: white;
        color: #222;
    }

    body {
        overflow-x: hidden;
    }

    #page {
        width: 100%;
        min-height: 100vh;
        padding: 20px;
    }

    /* =========================
       プロジェクト入力部分
       ========================= */

    #inputArea {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
    }

    #projectIdInput {
        width: 300px;
        height: 36px;
        padding: 0 10px;
        font-size: 16px;
        border: 1px solid #aaa;
        border-radius: 4px;
        outline: none;
    }

    #projectIdInput:focus {
        border-color: #4a90e2;
    }

    #loadButton {
        height: 36px;
        padding: 0 18px;
        font-size: 15px;
        border: 1px solid #aaa;
        border-radius: 4px;
        background: #f5f5f5;
        cursor: pointer;
    }

    #loadButton:hover {
        background: #e8e8e8;
    }

    #loadButton:disabled {
        opacity: 0.6;
        cursor: default;
    }

    /* =========================
       ステータス
       ========================= */

    #status {
        text-align: center;
        min-height: 22px;
        margin-bottom: 4px;
        font-size: 14px;
    }

    /* =========================
       プロジェクト情報
       ========================= */

    #projectInfo {
        text-align: center;
        margin-bottom: 10px;
    }

    #projectTitle {
        font-size: 20px;
        font-weight: bold;
    }

    #projectAuthor {
        margin-top: 3px;
        font-size: 14px;
        color: #666;
    }

    /* =========================
       プレイヤー全体
       ========================= */

    #playerArea {
        width: 480px;
        margin: 0 auto;

        display: flex;
        flex-direction: column;

        background: white;
    }

    /* =========================
       ツールバー
       ========================= */

    #stageToolbar {
        width: 480px;
        height: 40px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        background: white;
        flex-shrink: 0;
    }

    #stageControls {
        height: 40px;

        display: flex;
        align-items: center;
        gap: 2px;
    }

    .stage-control {
        width: 32px;
        height: 32px;

        position: relative;

        border: none;
        border-radius: 4px;

        background: transparent;

        cursor: pointer;

        padding: 0;
    }

    .stage-control:hover {
        background: rgba(220, 220, 220, 0.55);
    }

    .stage-control:disabled {
        opacity: 0.45;
        cursor: default;
    }

    .stage-control:disabled:hover {
        background: transparent;
    }

    /* 実行中の緑旗ボタン */
    #startButton.running {
        background: rgba(205, 205, 205, 0.70);
    }

    /* =========================
       緑旗アイコン
       ========================= */

    .flag-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 0;
        height: 0;

        transform: translate(-38%, -50%);

        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 13px solid #4caf50;
    }

    .flag-icon::after {
        content: "";

        position: absolute;

        width: 2px;
        height: 17px;

        background: #4caf50;

        left: -13px;
        top: -8px;
    }

    /* =========================
       一時停止アイコン
       ========================= */

    .pause-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 14px;
        height: 18px;

        transform: translate(-50%, -50%);
    }

    .pause-icon::before,
    .pause-icon::after {
        content: "";

        position: absolute;

        top: 0;

        width: 5px;
        height: 18px;

        background: #f39c12;
        border-radius: 1px;
    }

    .pause-icon::before {
        left: 0;
    }

    .pause-icon::after {
        right: 0;
    }

    /* =========================
       再生アイコン
       ========================= */

    .play-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 0;
        height: 0;

        transform: translate(-35%, -50%);

        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 13px solid #f39c12;
    }

    /* =========================
       停止アイコン
       ========================= */

    .stop-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 17px;
        height: 17px;

        transform: translate(-50%, -50%);

        background: #e53935;
        border-radius: 2px;
    }

    /* =========================
       最大化ボタン
       ========================= */

    #maximizeButton {
        width: 32px;
        height: 32px;

        border: none;
        border-radius: 4px;

        background: transparent;

        font-size: 22px;
        line-height: 32px;

        cursor: pointer;

        color: #333;

        padding: 0;
    }

    #maximizeButton:hover {
        background: rgba(220, 220, 220, 0.55);
    }

    /* =========================
       ステージ
       ========================= */

    #project {
        width: 480px;
        height: 360px;

        position: relative;

        background: black;

        overflow: hidden;
    }

    /*
     * Scaffolding自身が width:100%; height:100%;
     * を使用するため、親要素のサイズを
     * 480x360 に固定する。
     */
    #project .sc-root {
        width: 100% !important;
        height: 100% !important;
    }

    /* =========================
       ダウンロード
       ========================= */

    #downloadArea {
        width: 480px;

        margin: 12px auto 0;

        text-align: center;
    }

    #downloadButton {
        height: 34px;

        padding: 0 16px;

        font-size: 14px;

        border: 1px solid #aaa;
        border-radius: 4px;

        background: #f5f5f5;

        cursor: pointer;
    }

    #downloadButton:hover {
        background: #e8e8e8;
    }

    #downloadButton:disabled {
        opacity: 0.5;
        cursor: default;
    }

    /* =========================
       最大化状態
       ========================= */

    #playerArea.maximized {
        position: fixed;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        margin: 0;

        z-index: 1000;

        background: white;
    }

    /*
     * 最大化時に画面全体を白くする
     */
    #playerArea.maximized::before {
        content: "";

        position: fixed;

        left: 50%;
        top: 50%;

        width: 100vw;
        height: 100vh;

        transform: translate(-50%, -50%);

        background: white;

        z-index: -1;
    }

    #playerArea.maximized #stageToolbar {
        width: 100%;
    }

    #playerArea.maximized #project {
        width: 100%;
        height: calc(100% - 40px);
    }

    /* =========================
       小さい画面
       ========================= */

    @media (max-width: 520px) {

        #page {
            padding-left: 10px;
            padding-right: 10px;
        }

        #inputArea {
            flex-direction: column;
        }

        #projectIdInput {
            width: min(300px, 100%);
        }

        #playerArea,
        #stageToolbar,
        #downloadArea {
            width: 100%;
            max-width: 480px;
        }

        #project {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
        }

        #stageToolbar {
            height: 40px;
        }
    }
</style>
</head>

<body>

<div id="page">

    <!-- =========================
         プロジェクトID入力
         ========================= -->

    <div id="inputArea">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch プロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

    </div>

    <!-- =========================
         ステータス
         ========================= -->

    <div id="status"></div>

    <!-- =========================
         プロジェクト情報
         ========================= -->

    <div id="projectInfo">

        <div id="projectTitle"></div>

        <div id="projectAuthor"></div>

    </div>

    <!-- =========================
         プレイヤー
         ========================= -->

    <div id="playerArea">

        <!-- ツールバー -->

        <div id="stageToolbar">

            <div id="stageControls">

                <!-- 緑旗 -->

                <button
                    id="startButton"
                    class="stage-control"
                    title="開始"
                >
                    <span class="flag-icon"></span>
                </button>

                <!-- 一時停止 / 再開 -->

                <button
                    id="pauseButton"
                    class="stage-control"
                    title="一時停止"
                    disabled
                >
                    <span class="pause-icon"></span>
                </button>

                <!-- 停止 -->

                <button
                    id="stopButton"
                    class="stage-control"
                    title="停止"
                >
                    <span class="stop-icon"></span>
                </button>

            </div>

            <!-- 最大化 -->

            <button
                id="maximizeButton"
                title="最大化"
            >⤡</button>

        </div>

        <!-- TurboWarp Scaffolding -->
        <div id="project"></div>

    </div>

    <!-- =========================
         SB3ダウンロード
         ========================= -->

    <div id="downloadArea">

        <button
            id="downloadButton"
            disabled
        >
            SB3をダウンロード
        </button>

    </div>

</div>


<script>
"use strict";

/* ============================================================
   グローバル変数
   ============================================================ */

let scaffolding = null;

let projectLoaded = false;

let currentProjectId = null;

let currentProjectData = null;

let projectState = "stopped";
// "stopped"
// "running"
// "paused"


/* ============================================================
   DOM
   ============================================================ */

const projectIdInput =
    document.getElementById("projectIdInput");

const loadButton =
    document.getElementById("loadButton");

const statusElement =
    document.getElementById("status");

const projectTitleElement =
    document.getElementById("projectTitle");

const projectAuthorElement =
    document.getElementById("projectAuthor");

const playerArea =
    document.getElementById("playerArea");

const projectElement =
    document.getElementById("project");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");

const stopButton =
    document.getElementById("stopButton");

const maximizeButton =
    document.getElementById("maximizeButton");

const downloadButton =
    document.getElementById("downloadButton");


/* ============================================================
   ステータス表示
   ============================================================ */

function setStatus(text) {

    statusElement.textContent = text;

}


/* ============================================================
   TurboWarp Scaffolding 初期化
   ============================================================ */

function initializeScaffolding() {

    if (scaffolding) {
        return;
    }

    if (
        typeof Scaffolding === "undefined" ||
        !Scaffolding.Scaffolding
    ) {
        throw new Error(
            "TurboWarp Scaffoldingを読み込めませんでした。"
        );
    }

    scaffolding =
        new Scaffolding.Scaffolding();


    /*
     * Scratch標準サイズ
     */

    scaffolding.width = 480;

    scaffolding.height = 360;


    /*
     * stretchにすることで、
     * Scaffoldingの内部座標と表示領域を
     * 合わせやすくする。
     */

    scaffolding.resizeMode = "stretch";


    /*
     * リストを編集可能にはしない
     */

    scaffolding.editableLists = false;


    /*
     * マウス・キーボード等
     */

    scaffolding.shouldConnectPeripherals = true;


    /*
     * Packaged Runtimeは使用しない
     */

    scaffolding.usePackagedRuntime = false;


    /*
     * Runtime初期化
     */

    scaffolding.setup();


    /*
     * Scaffoldingを#projectへ追加
     */

    scaffolding.appendTo(projectElement);


    /*
     * Scratchの画像・音声などのアセットを取得
     *
     * Scaffoldingのバージョンによってstorageが
     * 利用できない場合があるため、安全に確認する。
     */

    if (
        scaffolding.storage &&
        typeof scaffolding.storage.addWebStore === "function"
    ) {

        const storage =
            scaffolding.storage;

        storage.addWebStore(
            [
                storage.AssetType.ImageVector,
                storage.AssetType.ImageBitmap,
                storage.AssetType.Sound
            ],
            (asset) => {
                return (
                    "https://assets.scratch.mit.edu/internalapi/asset/" +
                    asset.assetId +
                    "." +
                    asset.dataFormat +
                    "/get/"
                );
            }
        );
    }


    /*
     * 最初のレイアウト計算
     */

    scaffolding.relayout();

}


/* ============================================================
   ★ 古い変数・リストモニターを削除
   ============================================================

   ここが今回の追加部分です。

   Scaffolding v0.2.0では、loadProject()を呼んでも
   _monitors が自動的に完全クリアされないため、

       プロジェクトA
       ↓
       プロジェクトB

   と読み込むと、Aの変数・リストがBに残ることがあります。

   そのため、新しいプロジェクトを読み込む前に
   古いモニターDOMとMapを削除します。
   ============================================================ */

function clearProjectMonitors() {

    if (!scaffolding) {
        return;
    }


    /*
     * Scaffolding内部のモニターMapを削除
     */

    if (scaffolding._monitors) {

        for (
            const monitor
            of scaffolding._monitors.values()
        ) {

            if (
                monitor &&
                monitor.root
            ) {

                monitor.root.remove();

            }

        }


        scaffolding._monitors.clear();

    }


    /*
     * モニター表示用DOMも念のため空にする
     */

    if (scaffolding._monitorOverlay) {

        scaffolding._monitorOverlay.replaceChildren();

    }

}


/* ============================================================
   ボタン状態更新
   ============================================================ */

function updateControlButtons() {

    /*
     * 初期状態
     */

    startButton.classList.remove("running");


    /*
     * Pauseボタンのアイコンを作り直す
     */

    pauseButton.innerHTML = "";


    /*
     * 停止状態
     */

    if (projectState === "stopped") {

        startButton.disabled =
            !projectLoaded;

        pauseButton.disabled =
            true;

        stopButton.disabled =
            false;

        const icon =
            document.createElement("span");

        icon.className =
            "pause-icon";

        pauseButton.appendChild(icon);

        return;
    }


    /*
     * 実行中
     */

    if (projectState === "running") {

        startButton.disabled =
            false;

        startButton.classList.add(
            "running"
        );

        pauseButton.disabled =
            false;

        stopButton.disabled =
            false;

        const icon =
            document.createElement("span");

        icon.className =
            "pause-icon";

        pauseButton.appendChild(icon);

        return;
    }


    /*
     * 一時停止中
     */

    if (projectState === "paused") {

        startButton.disabled =
            false;

        pauseButton.disabled =
            false;

        stopButton.disabled =
            false;

        const icon =
            document.createElement("span");

        icon.className =
            "play-icon";

        pauseButton.appendChild(icon);

    }

}


/* ============================================================
   プロジェクト一時停止
   ============================================================ */

function pauseProject() {

    if (
        !scaffolding ||
        projectState !== "running"
    ) {
        return;
    }


    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;


    if (
        runtime &&
        runtime.frameLoop
    ) {

        runtime.frameLoop.stop();

    }


    projectState =
        "paused";


    updateControlButtons();

    setStatus("一時停止中");

}


/* ============================================================
   プロジェクト再開
   ============================================================ */

function resumeProject() {

    if (
        !scaffolding ||
        projectState !== "paused"
    ) {
        return;
    }


    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;


    if (
        runtime &&
        runtime.frameLoop
    ) {

        runtime.frameLoop.start();

    }


    projectState =
        "running";


    updateControlButtons();

    setStatus("実行中");

}


/* ============================================================
   プロジェクト開始
   ============================================================ */

function startProject() {

    if (!scaffolding || !projectLoaded) {
        return;
    }


    /*
     * 一時停止中なら「続きから再開」
     */

    if (projectState === "paused") {

        resumeProject();

        return;

    }


    /*
     * 停止中なら緑旗を押して最初から開始
     */

    if (projectState === "stopped") {

        scaffolding.greenFlag();

        projectState =
            "running";

        updateControlButtons();

        setStatus("実行中");

    }

}


/* ============================================================
   プロジェクト停止
   ============================================================ */

function stopProject() {

    if (!scaffolding || !projectLoaded) {
        return;
    }


    scaffolding.stopAll();


    projectState =
        "stopped";


    updateControlButtons();

    setStatus("停止中");

}


/* ============================================================
   プロジェクトメタデータ取得
   ============================================================ */

async function getProjectMetadata(projectId) {

    const response =
        await fetch(
            `https://trampoline.turbowarp.org/api/projects/${projectId}`
        );


    if (response.status === 404) {

        throw new Error(
            "プロジェクトが存在しないか、共有されていません。"
        );

    }


    if (!response.ok) {

        throw new Error(
            `プロジェクト情報の取得に失敗しました。HTTP ${response.status}`
        );

    }


    return await response.json();

}


/* ============================================================
   SB3取得
   ============================================================ */

async function getProjectData(
    projectId,
    metadata
) {

    const token =
        metadata.project_token;


    if (!token) {

        throw new Error(
            "project_tokenを取得できませんでした。"
        );

    }


    const response =
        await fetch(
            `https://projects.scratch.mit.edu/${projectId}?token=${token}`
        );


    if (!response.ok) {

        throw new Error(
            `SB3の取得に失敗しました。HTTP ${response.status}`
        );

    }


    return await response.arrayBuffer();

}


/* ============================================================
   ★ プロジェクト読み込み
   ============================================================

   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★

   ユーザーが探していた loadProject() はここです。

   この関数全体が

       「プロジェクトIDを受け取る」
       ↓
       「メタデータ取得」
       ↓
       「SB3取得」
       ↓
       「古い変数・リスト削除」
       ↓
       「新しいSB3をScaffoldingへ読み込む」

   という処理になっています。

   ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
   ============================================================ */

async function loadProject(projectId) {

    /*
     * Scaffoldingをまだ作っていなければ初期化
     */

    initializeScaffolding();


    /*
     * 読み込み中はボタンを無効化
     */

    loadButton.disabled = true;

    downloadButton.disabled = true;


    /*
     * 現在のプロジェクトを停止
     *
     * ここが重要。
     *
     * 前のプロジェクトが動いたままだと、
     * 古いRuntimeからモニター更新が来る可能性があるため、
     * 新しいプロジェクトを読み込む前に停止する。
     */

    if (
        scaffolding &&
        projectLoaded
    ) {

        scaffolding.stopAll();

    }


    /*
     * ★★★★★★★★★★★★★★★★★★★★★
     *
     * ★ 古い変数・リストをここで削除
     *
     * ★★★★★★★★★★★★★★★★★★★★★
     */

    clearProjectMonitors();


    /*
     * 状態を停止に戻す
     */

    projectState =
        "stopped";

    updateControlButtons();


    try {

        setStatus(
            "プロジェクト情報を取得しています..."
        );


        /*
         * ------------------------------------------------
         * 1. メタデータ取得
         * ------------------------------------------------
         */

        const metadata =
            await getProjectMetadata(projectId);


        /*
         * タイトル
         */

        const title =
            metadata.title ??
            "タイトル不明";


        /*
         * 作者
         *
         * TurboWarp APIではauthor.usernameを優先
         */

        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectTitleElement.textContent =
            title;

        projectAuthorElement.textContent =
            `作者: ${author}`;


        /*
         * ------------------------------------------------
         * 2. SB3取得
         * ------------------------------------------------
         */

        setStatus(
            "プロジェクトデータを取得しています..."
        );


        const sb3Buffer =
            await getProjectData(
                projectId,
                metadata
            );


        /*
         * ダウンロード用に保存
         */

        currentProjectData =
            sb3Buffer;


        currentProjectId =
            projectId;


        /*
         * ------------------------------------------------
         * 3. ScaffoldingへSB3を読み込む
         * ------------------------------------------------
         */

        setStatus(
            "TurboWarp Playerに読み込んでいます..."
        );


        /*
         * ★ ここが実際のScaffolding.loadProject()
         */

        await scaffolding.loadProject(
            sb3Buffer
        );


        /*
         * ------------------------------------------------
         * 4. レイアウト更新
         * ------------------------------------------------
         */

        scaffolding.relayout();


        /*
         * 画面サイズ変更などがあった場合に備えて
         * 次のフレームでも再計算
         */

        requestAnimationFrame(() => {

            if (scaffolding) {

                scaffolding.relayout();

            }

        });


        /*
         * ------------------------------------------------
         * 5. 読み込み完了
         * ------------------------------------------------
         */

        projectLoaded =
            true;


        projectState =
            "stopped";


        downloadButton.disabled =
            false;


        updateControlButtons();


        setStatus(
            "読み込み完了"
        );

    }

    catch (error) {

        console.error(
            "loadProject error:",
            error
        );


        projectLoaded =
            false;


        currentProjectData =
            null;


        currentProjectId =
            null;


        projectState =
            "stopped";


        projectTitleElement.textContent =
            "";

        projectAuthorElement.textContent =
            "";


        updateControlButtons();


        setStatus(
            "エラー: " +
            (error.message ||
             String(error))
        );

    }

    finally {

        loadButton.disabled =
            false;

    }

}


/* ============================================================
   最大化サイズ計算
   ============================================================ */

function calculateMaxStageSize() {

    /*
     * ツールバー40px分を確保
     */

    const toolbarHeight =
        40;


    const availableWidth =
        window.innerWidth;

    const availableHeight =
        window.innerHeight -
        toolbarHeight;


    /*
     * 4:3を維持
     */

    let width =
        availableWidth;

    let height =
        width * 3 / 4;


    if (height > availableHeight) {

        height =
            availableHeight;

        width =
            height * 4 / 3;

    }


    /*
     * 小数を避ける
     */

    width =
        Math.floor(width);

    height =
        Math.floor(height);


    return {
        width,
        height
    };

}


/* ============================================================
   ステージレイアウト
   ============================================================ */

function applyStageLayout() {

    if (!scaffolding) {
        return;
    }


    /*
     * 通常状態
     */

    if (
        !playerArea.classList.contains(
            "maximized"
        )
    ) {

        playerArea.style.width =
            "480px";

        projectElement.style.width =
            "480px";

        projectElement.style.height =
            "360px";

        document.getElementById(
            "stageToolbar"
        ).style.width =
            "480px";


        scaffolding.relayout();

        return;

    }


    /*
     * 最大化状態
     */

    const size =
        calculateMaxStageSize();


    playerArea.style.width =
        `${size.width}px`;

    playerArea.style.height =
        `${size.height + 40}px`;


    document.getElementById(
        "stageToolbar"
    ).style.width =
        `${size.width}px`;


    projectElement.style.width =
        `${size.width}px`;

    projectElement.style.height =
        `${size.height}px`;


    scaffolding.relayout();


    /*
     * DOMサイズ反映後にもう一度
     */

    requestAnimationFrame(() => {

        if (scaffolding) {

            scaffolding.relayout();

        }

    });

}


/* ============================================================
   最大化切り替え
   ============================================================ */

function toggleMaximize() {

    const isMaximized =
        playerArea.classList.contains(
            "maximized"
        );


    if (isMaximized) {

        /*
         * 通常サイズへ
         */

        playerArea.classList.remove(
            "maximized"
        );


        playerArea.style.width =
            "480px";

        playerArea.style.height =
            "";


        projectElement.style.width =
            "480px";

        projectElement.style.height =
            "360px";


        maximizeButton.textContent =
            "⤡";

        maximizeButton.title =
            "最大化";

    }

    else {

        /*
         * 最大化
         */

        playerArea.classList.add(
            "maximized"
        );


        maximizeButton.textContent =
            "⤢";

        maximizeButton.title =
            "元のサイズに戻す";

    }


    applyStageLayout();

}


/* ============================================================
   SB3ダウンロード
   ============================================================ */

function downloadProject() {

    if (
        !currentProjectData ||
        !currentProjectId
    ) {

        return;

    }


    const blob =
        new Blob(
            [currentProjectData],
            {
                type:
                    "application/octet-stream"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        `${currentProjectId}.sb3`;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* ============================================================
   イベント
   ============================================================ */


/*
 * 読み込み
 */

loadButton.addEventListener(
    "click",
    () => {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;

        }


        loadProject(projectId);

    }
);


/*
 * Enterキーでも読み込み
 */

projectIdInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            loadButton.click();

        }

    }
);


/*
 * 緑旗
 */

startButton.addEventListener(
    "click",
    () => {

        startProject();

    }
);


/*
 * 一時停止 / 再開
 */

pauseButton.addEventListener(
    "click",
    () => {

        if (
            projectState === "running"
        ) {

            pauseProject();

        }

        else if (
            projectState === "paused"
        ) {

            resumeProject();

        }

    }
);


/*
 * 停止
 */

stopButton.addEventListener(
    "click",
    () => {

        stopProject();

    }
);


/*
 * 最大化
 */

maximizeButton.addEventListener(
    "click",
    () => {

        toggleMaximize();

    }
);


/*
 * ダウンロード
 */

downloadButton.addEventListener(
    "click",
    () => {

        downloadProject();

    }
);


/*
 * ウィンドウサイズ変更
 */

window.addEventListener(
    "resize",
    () => {

        if (
            playerArea.classList.contains(
                "maximized"
            )
        ) {

            applyStageLayout();

        }

        else if (scaffolding) {

            scaffolding.relayout();

        }

    }
);


/* ============================================================
   初期状態
   ============================================================ */

updateControlButtons();

setStatus(
    "プロジェクトIDを入力してください。"
);

</script>

</body>
</html>
