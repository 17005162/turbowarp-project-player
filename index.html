<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurboWarp Project Player</title>

<!-- TurboWarp Scaffolding -->
<script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

<style>
/* =========================================================
   基本
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    background: white;
    color: #222;
}

#page {
    width: 100%;
    min-height: 100vh;
    padding: 20px;
}

/* =========================================================
   上部入力欄
   ========================================================= */

#inputArea {
    display: flex;
    align-items: center;
    gap: 8px;

    width: 100%;
    max-width: 700px;

    margin: 0 auto 12px;
}

#projectIdInput {
    flex: 1;

    height: 38px;
    padding: 0 12px;

    border: 1px solid #bbb;
    border-radius: 6px;

    font-size: 16px;
    outline: none;
}

#projectIdInput:focus {
    border-color: #777;
}

#loadButton {
    height: 38px;
    padding: 0 18px;

    border: none;
    border-radius: 6px;

    background: #4a90e2;
    color: white;

    font-size: 15px;
    cursor: pointer;
}

#loadButton:hover {
    background: #357abd;
}

#loadButton:disabled {
    opacity: 0.55;
    cursor: default;
}

/* =========================================================
   ステータス
   ========================================================= */

#status {
    width: 100%;
    max-width: 700px;

    min-height: 22px;

    margin: 0 auto 8px;

    font-size: 14px;
    color: #555;
}

/* =========================================================
   プロジェクト情報
   ========================================================= */

#projectInfo {
    width: 100%;
    max-width: 700px;

    margin: 0 auto 15px;

    display: none;

    font-size: 14px;
}

#projectTitle {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 3px;
}

#projectAuthor {
    color: #666;
}

/* =========================================================
   プレイヤー全体
   ========================================================= */

#playerArea {
    width: 480px;
    margin: 0 auto;
}

/*
 * 通常時
 *
 * Scaffolding のルートそのものを
 * 480 x 360 にする。
 */
#project {
    width: 480px;
    height: 360px;

    background: #000;

    position: relative;

    overflow: hidden;
}

/*
 * Scaffolding が appendTo() した
 * .sc-root は自分自身で内部サイズを計算するため、
 * project の子要素を無理に width/height 100% にしない。
 */


/* =========================================================
   ステージ上部のツールバー
   ========================================================= */

#stageToolbar {
    width: 480px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: white;

    padding: 0 2px;

    position: relative;
    z-index: 10;
}

#stageControls {
    display: flex;
    align-items: center;
    gap: 3px;
}

/* =========================================================
   操作ボタン共通
   ========================================================= */

.stage-control {
    width: 32px;
    height: 32px;

    padding: 0;
    margin: 0;

    border: none;
    border-radius: 5px;

    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    position: relative;
}

.stage-control:hover {
    background: rgba(0, 0, 0, 0.08);
}

.stage-control:disabled {
    opacity: 0.40;
    cursor: default;
}

.stage-control:disabled:hover {
    background: transparent;
}


/* =========================================================
   スタートボタン
   ========================================================= */

/*
 * 実行中だけ、緑の旗の後ろに
 * 薄い灰色の膜を表示する。
 */
#startButton.running {
    background: rgba(205, 205, 205, 0.70);
}


/* 緑の旗 */
.flag-icon {
    width: 18px;
    height: 19px;

    position: relative;

    display: block;
}

/* 旗竿 */
.flag-icon::before {
    content: "";

    position: absolute;

    left: 3px;
    top: 1px;

    width: 2px;
    height: 18px;

    background: #555;

    border-radius: 1px;
}

/* 旗 */
.flag-icon::after {
    content: "";

    position: absolute;

    left: 5px;
    top: 2px;

    width: 12px;
    height: 9px;

    background: #4caf50;

    border-radius:
        1px
        3px
        3px
        1px;
}


/* =========================================================
   一時停止アイコン
   ========================================================= */

.pause-icon {
    width: 14px;
    height: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 3px;
}

.pause-icon::before,
.pause-icon::after {
    content: "";

    display: block;

    width: 4px;
    height: 18px;

    background: #f0a000;

    border-radius: 1px;
}


/* =========================================================
   再生アイコン
   一時停止中に表示
   ========================================================= */

.play-icon {
    width: 0;
    height: 0;

    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;

    border-left: 14px solid #f0a000;

    margin-left: 3px;
}


/* =========================================================
   停止アイコン
   ========================================================= */

.stop-icon {
    width: 18px;
    height: 18px;

    background: #e05252;

    border: 1px solid #c13d3d;

    border-radius: 4px;

    display: block;
}


/* =========================================================
   最大化ボタン
   ========================================================= */

#maximizeButton {
    width: 32px;
    height: 32px;

    padding: 0;

    border: none;
    border-radius: 5px;

    background: transparent;

    color: #333;

    font-size: 18px;
    line-height: 32px;

    cursor: pointer;
}

#maximizeButton:hover {
    background: rgba(0, 0, 0, 0.08);
}


/* =========================================================
   SB3ダウンロード
   ========================================================= */

#downloadArea {
    width: 480px;

    margin: 12px auto 0;

    text-align: center;

    display: none;
}

#downloadButton {
    height: 34px;

    padding: 0 14px;

    border: 1px solid #aaa;
    border-radius: 5px;

    background: white;

    color: #333;

    cursor: pointer;
}

#downloadButton:hover {
    background: #f1f1f1;
}


/* =========================================================
   最大化
   ========================================================= */

#playerArea.maximized {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    margin: 0;

    background: #111;

    z-index: 10000;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

#playerArea.maximized #stageToolbar {
    flex: none;
}

#playerArea.maximized #project {
    flex: none;
}

#playerArea.maximized #downloadArea {
    display: none;
}


/* =========================================================
   小さい画面への対応
   ========================================================= */

@media (max-width: 520px) {

    #page {
        padding: 10px;
    }

    #playerArea {
        width: 100%;
    }

    #stageToolbar {
        width: 100%;
    }

    #project {
        width: 100%;
        aspect-ratio: 4 / 3;
        height: auto;
    }

    #downloadArea {
        width: 100%;
    }
}
</style>
</head>


<body>

<div id="page">

    <!-- =====================================================
         プロジェクトID入力
         ===================================================== -->

    <div id="inputArea">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch プロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

    </div>


    <!-- =====================================================
         ステータス
         ===================================================== -->

    <div id="status"></div>


    <!-- =====================================================
         プロジェクト情報
         ===================================================== -->

    <div id="projectInfo">

        <div id="projectTitle"></div>

        <div id="projectAuthor"></div>

    </div>


    <!-- =====================================================
         プレイヤー
         ===================================================== -->

    <div id="playerArea">

        <!-- ツールバー -->
        <div id="stageToolbar">

            <div id="stageControls">

                <!-- スタート -->
                <button
                    id="startButton"
                    class="stage-control"
                    title="スタート"
                >
                    <span class="flag-icon"></span>
                </button>


                <!-- 一時停止 / 再開 -->
                <button
                    id="pauseButton"
                    class="stage-control"
                    title="一時停止"
                    disabled
                >
                    <span class="pause-icon"></span>
                </button>


                <!-- 停止 -->
                <button
                    id="stopButton"
                    class="stage-control"
                    title="停止"
                >
                    <span class="stop-icon"></span>
                </button>

            </div>


            <!-- 最大化 -->
            <button
                id="maximizeButton"
                title="最大化"
            >
                ⤡
            </button>

        </div>


        <!-- TurboWarpプロジェクト -->
        <div id="project"></div>

    </div>


    <!-- =====================================================
         ダウンロード
         ===================================================== -->

    <div id="downloadArea">

        <button id="downloadButton">
            SB3をダウンロード
        </button>

    </div>

</div>


<script>
/* =========================================================
   グローバル変数
   ========================================================= */

let scaffolding = null;

let projectLoaded = false;

let projectState = "stopped";

/*
 * stopped
 *   ↓
 * running
 *   ↓
 * paused
 *   ↓
 * running
 *
 * stopAll() → stopped
 */

let currentProjectId = null;
let currentSb3Buffer = null;


/* =========================================================
   DOM
   ========================================================= */

const projectElement =
    document.getElementById("project");

const playerArea =
    document.getElementById("playerArea");

const stageToolbar =
    document.getElementById("stageToolbar");

const projectIdInput =
    document.getElementById("projectIdInput");

const loadButton =
    document.getElementById("loadButton");

const statusElement =
    document.getElementById("status");

const projectInfo =
    document.getElementById("projectInfo");

const projectTitle =
    document.getElementById("projectTitle");

const projectAuthor =
    document.getElementById("projectAuthor");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");

const stopButton =
    document.getElementById("stopButton");

const maximizeButton =
    document.getElementById("maximizeButton");

const downloadArea =
    document.getElementById("downloadArea");

const downloadButton =
    document.getElementById("downloadButton");


/* =========================================================
   ステータス表示
   ========================================================= */

function setStatus(text) {
    statusElement.textContent = text;
}


/* =========================================================
   Scaffolding初期化
   ========================================================= */

function initializeScaffolding() {

    if (scaffolding) {
        return;
    }

    try {

        scaffolding =
            new Scaffolding.Scaffolding();


        /* -----------------------------------------------
           基本設定
           ----------------------------------------------- */

        scaffolding.width = 480;

        scaffolding.height = 360;

        scaffolding.resizeMode =
            "preserve-ratio";

        scaffolding.editableLists =
            false;

        scaffolding.shouldConnectPeripherals =
            true;

        scaffolding.usePackagedRuntime =
            false;


        /* -----------------------------------------------
           setup
           ----------------------------------------------- */

        scaffolding.setup();


        /* -----------------------------------------------
           Scratchのアセットを取得
           ----------------------------------------------- */

        if (
            scaffolding.storage &&
            typeof scaffolding.storage.addWebStore === "function"
        ) {

            const storage =
                scaffolding.storage;

            storage.addWebStore(
                [
                    storage.AssetType.ImageVector,
                    storage.AssetType.ImageBitmap,
                    storage.AssetType.Sound
                ],
                (asset) => {

                    return (
                        "https://assets.scratch.mit.edu/internalapi/asset/" +
                        asset.assetId +
                        "." +
                        asset.dataFormat +
                        "/get/"
                    );

                }
            );
        }


        /* -----------------------------------------------
           Scaffoldingをステージに追加
           ----------------------------------------------- */

        scaffolding.appendTo(
            projectElement
        );


        /* -----------------------------------------------
           初期レイアウト
           ----------------------------------------------- */

        if (
            typeof scaffolding.relayout === "function"
        ) {
            scaffolding.relayout();
        }


        updateControlButtons();


    } catch (error) {

        console.error(
            "Scaffolding initialization error:",
            error
        );

        setStatus(
            "TurboWarp Playerの初期化に失敗しました。"
        );

        throw error;
    }
}


/* =========================================================
   ボタン状態更新
   ========================================================= */

function updateControlButtons() {

    if (!startButton || !pauseButton) {
        return;
    }


    /* =====================================================
       実行中
       ===================================================== */

    if (projectState === "running") {

        /*
         * 緑の旗の後ろに
         * 薄灰色の膜を表示
         */
        startButton.classList.add(
            "running"
        );


        /*
         * 一時停止アイコン
         */
        pauseButton.innerHTML = `
            <span class="pause-icon"></span>
        `;

        pauseButton.title =
            "一時停止";

        pauseButton.disabled =
            false;
    }


    /* =====================================================
       一時停止中
       ===================================================== */

    else if (projectState === "paused") {

        /*
         * 実行中ではないので
         * 緑旗の灰色膜を消す
         */
        startButton.classList.remove(
            "running"
        );


        /*
         * 再生アイコンに変更
         */
        pauseButton.innerHTML = `
            <span class="play-icon"></span>
        `;

        pauseButton.title =
            "再開";

        pauseButton.disabled =
            false;
    }


    /* =====================================================
       停止中
       ===================================================== */

    else {

        startButton.classList.remove(
            "running"
        );


        /*
         * 一時停止アイコンに戻す
         */
        pauseButton.innerHTML = `
            <span class="pause-icon"></span>
        `;

        pauseButton.title =
            "一時停止";

        /*
         * 停止中は一時停止できない
         */
        pauseButton.disabled =
            true;
    }
}


/* =========================================================
   一時停止
   ========================================================= */

function pauseProject() {

    if (!scaffolding) {
        return;
    }

    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;

    if (!runtime) {
        return;
    }


    /*
     * TurboWarpの実行ループを停止
     *
     * stopAll()とは違い、
     * スクリプトや変数などをリセットしない。
     */
    if (
        runtime.frameLoop &&
        runtime.frameLoop.running
    ) {

        runtime.frameLoop.stop();
    }
}


/* =========================================================
   再開
   ========================================================= */

function resumeProject() {

    if (!scaffolding) {
        return;
    }

    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;

    if (!runtime) {
        return;
    }


    /*
     * 一時停止時に止めた
     * frameLoopを再開する。
     *
     * これにより、
     * 一時停止した場所から続行する。
     */
    if (
        runtime.frameLoop &&
        !runtime.frameLoop.running
    ) {

        runtime.frameLoop.start();
    }
}


/* =========================================================
   プロジェクト読み込み
   ========================================================= */

async function loadProject(projectId) {

    initializeScaffolding();


    /* -----------------------------------------------
       IDを保存
       ----------------------------------------------- */

    currentProjectId =
        projectId;


    /* -----------------------------------------------
       UI
       ----------------------------------------------- */

    loadButton.disabled =
        true;

    projectInfo.style.display =
        "none";

    downloadArea.style.display =
        "none";

    projectLoaded =
        false;

    projectState =
        "stopped";

    updateControlButtons();


    try {

        /* =============================================
           1. TurboWarp APIからメタデータ取得
           ============================================= */

        setStatus(
            "プロジェクト情報を取得しています..."
        );


        const metadataResponse =
            await fetch(
                "https://trampoline.turbowarp.org/api/projects/" +
                encodeURIComponent(projectId)
            );


        if (!metadataResponse.ok) {

            throw new Error(
                "プロジェクト情報の取得に失敗しました。" +
                " HTTP " +
                metadataResponse.status
            );
        }


        const metadata =
            await metadataResponse.json();


        /* -----------------------------------------------
           プロジェクト情報
           ----------------------------------------------- */

        const title =
            metadata.title ||
            "無題のプロジェクト";

        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectTitle.textContent =
            title;

        projectAuthor.textContent =
            "作者: " + author;

        projectInfo.style.display =
            "block";


        /* =============================================
           2. project_token取得
           ============================================= */

        const projectToken =
            metadata.project_token;


        if (!projectToken) {

            throw new Error(
                "project_tokenを取得できませんでした。"
            );
        }


        /* =============================================
           3. SB3取得
           ============================================= */

        setStatus(
            "プロジェクトデータを取得しています..."
        );


        const sb3Url =
            "https://projects.scratch.mit.edu/" +
            encodeURIComponent(projectId) +
            "?token=" +
            encodeURIComponent(projectToken);


        const sb3Response =
            await fetch(sb3Url);


        if (!sb3Response.ok) {

            throw new Error(
                "SB3の取得に失敗しました。" +
                " HTTP " +
                sb3Response.status
            );
        }


        const sb3Buffer =
            await sb3Response.arrayBuffer();


        if (!sb3Buffer || sb3Buffer.byteLength === 0) {

            throw new Error(
                "SB3データが空です。"
            );
        }


        currentSb3Buffer =
            sb3Buffer;


        /* =============================================
           4. ScaffoldingにSB3を読み込む
           ============================================= */

        setStatus(
            "TurboWarp Playerに読み込んでいます..."
        );


        await scaffolding.loadProject(
            sb3Buffer
        );


        /* =============================================
           5. 初期状態
           ============================================= */

        projectLoaded =
            true;

        projectState =
            "stopped";


        /*
         * 重要：
         *
         * 読み込み直後は自動実行しない。
         * スタートボタンを押したときに実行する。
         */
        updateControlButtons();


        /* =============================================
           6. レイアウト更新
           ============================================= */

        if (
            typeof scaffolding.relayout === "function"
        ) {
            scaffolding.relayout();
        }


        /* =============================================
           7. ダウンロードボタン表示
           ============================================= */

        downloadArea.style.display =
            "block";


        setStatus(
            "読み込み完了"
        );


    } catch (error) {

        console.error(
            error
        );

        projectLoaded =
            false;

        projectState =
            "stopped";

        updateControlButtons();


        setStatus(
            "読み込みに失敗しました: " +
            (error.message || error)
        );

    } finally {

        loadButton.disabled =
            false;
    }
}


/* =========================================================
   読み込みボタン
   ========================================================= */

loadButton.addEventListener(
    "click",
    () => {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;
        }


        loadProject(
            projectId
        );
    }
);


/* =========================================================
   Enterキー
   ========================================================= */

projectIdInput.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {

            event.preventDefault();

            loadButton.click();
        }
    }
);


/* =========================================================
   スタートボタン
   ========================================================= */

startButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /* =============================================
           停止中
           ============================================= */

        if (
            projectState === "stopped"
        ) {

            /*
             * 読み込んだプロジェクトを
             * 最初から実行する。
             */
            scaffolding.greenFlag();


            projectState =
                "running";


            updateControlButtons();

            return;
        }


        /* =============================================
           一時停止中
           ============================================= */

        if (
            projectState === "paused"
        ) {

            /*
             * スタートを押した場合も
             * 一時停止位置から再開する。
             */
            resumeProject();


            projectState =
                "running";


            updateControlButtons();

            return;
        }


        /*
         * 実行中なら何もしない。
         */
    }
);


/* =========================================================
   一時停止 / 再開ボタン
   ========================================================= */

pauseButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /* =============================================
           実行中 → 一時停止
           ============================================= */

        if (
            projectState === "running"
        ) {

            pauseProject();


            projectState =
                "paused";


            updateControlButtons();

            return;
        }


        /* =============================================
           一時停止中 → 再開
           ============================================= */

        if (
            projectState === "paused"
        ) {

            resumeProject();


            projectState =
                "running";


            updateControlButtons();

            return;
        }
    }
);


/* =========================================================
   停止ボタン
   ========================================================= */

stopButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /*
         * 実行中でも
         * 一時停止中でも
         * stopAll()で停止する。
         */
        scaffolding.stopAll();


        projectState =
            "stopped";


        updateControlButtons();
    }
);


/* =========================================================
   最大化
   ========================================================= */

let isMaximized = false;


function updateMaximizedLayout() {

    if (!isMaximized) {

        /*
         * 通常サイズ
         */
        playerArea.style.width =
            "480px";

        playerArea.style.height =
            "400px";

        stageToolbar.style.width =
            "480px";

        projectElement.style.width =
            "480px";

        projectElement.style.height =
            "360px";

    } else {

        /*
         * 画面サイズ
         */
        const viewportWidth =
            window.innerWidth;

        const viewportHeight =
            window.innerHeight;


        /*
         * ツールバーの高さ
         */
        const toolbarHeight =
            40;


        /*
         * 4:3を維持するために、
         * ツールバーを除いた領域から
         * 最大サイズを計算する。
         */
        const availableWidth =
            viewportWidth;

        const availableHeight =
            viewportHeight -
            toolbarHeight;


        let width =
            availableWidth;

        let height =
            width * 3 / 4;


        /*
         * 高さが画面に収まらない場合
         */
        if (
            height >
            availableHeight
        ) {

            height =
                availableHeight;

            width =
                height * 4 / 3;
        }


        /*
         * 小数を避ける
         */
        width =
            Math.floor(width);

        height =
            Math.floor(height);


        /*
         * プレイヤー全体
         */
        playerArea.style.width =
            width + "px";

        playerArea.style.height =
            (height + toolbarHeight) + "px";


        /*
         * ツールバーも
         * プロジェクトと同じ幅
         */
        stageToolbar.style.width =
            width + "px";


        /*
         * Scaffoldingのルートサイズ
         */
        projectElement.style.width =
            width + "px";

        projectElement.style.height =
            height + "px";
    }


    /*
     * Scaffoldingに
     * 新しいサイズを知らせる。
     *
     * これがマウス座標ずれ防止にも重要。
     */
    if (
        scaffolding &&
        typeof scaffolding.relayout === "function"
    ) {

        requestAnimationFrame(
            () => {

                scaffolding.relayout();

            }
        );
    }
}


/* =========================================================
   最大化ボタン
   ========================================================= */

maximizeButton.addEventListener(
    "click",
    () => {

        isMaximized =
            !isMaximized;


        if (isMaximized) {

            playerArea.classList.add(
                "maximized"
            );

            maximizeButton.textContent =
                "⤢";

            maximizeButton.title =
                "通常サイズ";

        } else {

            playerArea.classList.remove(
                "maximized"
            );

            maximizeButton.textContent =
                "⤡";

            maximizeButton.title =
                "最大化";
        }


        updateMaximizedLayout();
    }
);


/* =========================================================
   ウィンドウサイズ変更
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (isMaximized) {

            updateMaximizedLayout();
        }
    }
);


/* =========================================================
   SB3ダウンロード
   ========================================================= */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !currentSb3Buffer ||
            !currentProjectId
        ) {
            return;
        }


        const blob =
            new Blob(
                [currentSb3Buffer],
                {
                    type:
                        "application/x.scratch.sb3"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement("a");


        link.href =
            url;


        link.download =
            "project_" +
            currentProjectId +
            ".sb3";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        /*
         * 少し待ってから解放
         */
        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );
    }
);


/* =========================================================
   初期状態
   ========================================================= */

updateControlButtons();

setStatus(
    "プロジェクトIDを入力してください。"
);

</script>

</body>
</html>
