<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TurboWarp Project Player</title>

    <!--
        TurboWarp Scaffolding
        現在の最新リリースは v0.2.0
    -->
    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

    <style>

        /* =========================================
           基本
           ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            padding: 20px;

            background: #f5f5f5;
            color: #222;

            font-family:
                Arial,
                "Noto Sans JP",
                sans-serif;
        }


        /* =========================================
           操作パネル
           ========================================= */

        #controlPanel {
            width: 100%;
            max-width: 900px;

            margin: 0 auto 15px auto;

            display: flex;
            flex-wrap: wrap;

            align-items: center;

            gap: 8px;
        }


        #projectIdInput {
            flex: 1 1 300px;

            height: 38px;

            padding: 0 10px;

            font-size: 16px;

            border: 1px solid #aaa;
            border-radius: 5px;

            outline: none;
        }


        #projectIdInput:focus {
            border-color: #555;
        }


        button {
            height: 38px;

            padding: 0 14px;

            border: none;
            border-radius: 5px;

            background: #333;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        button:hover {
            background: #555;
        }


        button:disabled {
            background: #aaa;
            cursor: default;
        }


        /* =========================================
           ステータス
           ========================================= */

        #status {
            width: 100%;
            max-width: 900px;

            min-height: 22px;

            margin: 0 auto 8px auto;

            font-size: 14px;
        }


        /* =========================================
           プロジェクト情報
           ========================================= */

        #projectInfo {
            width: 100%;
            max-width: 900px;

            margin: 0 auto 15px auto;

            font-size: 14px;
        }


        /* =========================================
           ステージ領域
           ========================================= */

        #stageArea {
            width: 100%;

            min-height: 360px;

            margin-top: 15px;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        /* =========================================
           Scaffoldingを入れる場所
           ========================================= */

        #project {
            width: 480px;
            height: 360px;

            flex: 0 0 480px;

            position: relative;

            overflow: hidden;

            background: black;
        }


        /* =========================================
           全画面モード
           ========================================= */

        body.maximized-mode {
            margin: 0;
            padding: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: black;
        }


        body.maximized-mode #stageArea {
            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            display: flex;

            justify-content: center;
            align-items: center;

            background: black;

            z-index: 9999;
        }


        body.maximized-mode #project {
            position: relative;

            flex: 0 0 auto;

            background: black;

            overflow: hidden;
        }


        /* =========================================
           全画面ボタン
           
           本家TurboWarpのように
           「ステージ右上」に配置
           ========================================= */

        #maximizeButton {
            position: absolute;

            top: 8px;
            right: 8px;

            width: 42px;
            height: 42px;

            margin: 0;
            padding: 0;

            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 5px;

            background: rgba(255, 255, 255, 0.90);

            color: #555;

            font-size: 23px;
            line-height: 40px;

            text-align: center;

            cursor: pointer;

            z-index: 10001;

            opacity: 0.95;

            transition:
                background 0.1s,
                opacity 0.1s;
        }


        #maximizeButton:hover {
            background: white;
            opacity: 1;
        }


        /* 最大化中でもステージ右上 */

        body.maximized-mode #maximizeButton {
            position: absolute;

            top: 10px;
            right: 10px;

            z-index: 10001;
        }


        /* =========================================
           最大化中は上のUIを隠す
           ========================================= */

        body.maximized-mode #controlPanel,
        body.maximized-mode #status,
        body.maximized-mode #projectInfo {
            display: none;
        }

    </style>
</head>


<body class="normal-mode">


    <!-- =========================================
         操作パネル
         ========================================= -->

    <div id="controlPanel">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch のプロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

        <button id="stopButton">
            停止
        </button>

        <button
            id="downloadSb3Button"
            disabled
        >
            SB3ダウンロード
        </button>

    </div>


    <!-- =========================================
         ステータス
         ========================================= -->

    <div id="status">
        TurboWarp Playerを初期化しています...
    </div>


    <!-- =========================================
         プロジェクト情報
         ========================================= -->

    <div id="projectInfo"></div>


    <!-- =========================================
         ステージ
         ========================================= -->

    <div id="stageArea">

        <div id="project">

            <!--
                全画面ボタン

                #projectの中に入れることで、
                ステージ右上に固定される
            -->

            <button
                id="maximizeButton"
                type="button"
                title="ステージを拡大"
                aria-label="ステージを拡大"
            >
                ⤡
            </button>

        </div>

    </div>


<script>

    /* =========================================
       DOM
       ========================================= */

    const projectIdInput =
        document.getElementById(
            "projectIdInput"
        );


    const loadButton =
        document.getElementById(
            "loadButton"
        );


    const stopButton =
        document.getElementById(
            "stopButton"
        );


    const downloadSb3Button =
        document.getElementById(
            "downloadSb3Button"
        );


    const maximizeButton =
        document.getElementById(
            "maximizeButton"
        );


    const statusElement =
        document.getElementById(
            "status"
        );


    const projectInfo =
        document.getElementById(
            "projectInfo"
        );


    const projectElement =
        document.getElementById(
            "project"
        );


    /* =========================================
       グローバル変数
       ========================================= */

    let scaffolding = null;

    let currentProjectId = null;

    let currentProjectToken = null;

    let currentSb3Url = null;


    /* =========================================
       ステータス
       ========================================= */

    function setStatus(message) {

        statusElement.textContent =
            message;

    }


    /* =========================================
       Scaffolding初期化
       ========================================= */

    function initializeScaffolding() {

        /*
         * CDNからScaffoldingが正常に読み込まれて
         * いるか確認
         */

        if (
            typeof window.Scaffolding ===
            "undefined"
        ) {

            throw new Error(
                "TurboWarp Scaffoldingの読み込みに失敗しました。"
            );

        }


        /*
         * コンストラクタ確認
         */

        if (
            typeof window.Scaffolding.Scaffolding !==
            "function"
        ) {

            console.error(
                "window.Scaffolding =",
                window.Scaffolding
            );

            throw new Error(
                "Scaffolding.Scaffolding が見つかりません。"
            );

        }


        /*
         * Scaffolding生成
         *
         * 公式API
         */

        scaffolding =
            new window.Scaffolding.Scaffolding();


        /* -----------------------------------------
           設定
           ----------------------------------------- */

        scaffolding.width =
            480;

        scaffolding.height =
            360;

        scaffolding.resizeMode =
            "preserve-ratio";

        scaffolding.editableLists =
            false;

        scaffolding.shouldConnectPeripherals =
            true;

        scaffolding.usePackagedRuntime =
            false;


        /* -----------------------------------------
           Runtime初期化
           ----------------------------------------- */

        scaffolding.setup();


        /* -----------------------------------------
           Scaffoldingをステージへ追加
           ----------------------------------------- */

        scaffolding.appendTo(
            projectElement
        );


        /* -----------------------------------------
           Scratchの画像・音声
           ----------------------------------------- */

        if (
            scaffolding.storage &&
            typeof scaffolding.storage.addWebStore ===
                "function"
        ) {

            const storage =
                scaffolding.storage;


            storage.addWebStore(

                [
                    storage.AssetType.ImageVector,
                    storage.AssetType.ImageBitmap,
                    storage.AssetType.Sound
                ],

                (asset) => {

                    return (
                        "https://assets.scratch.mit.edu/internalapi/asset/" +
                        asset.assetId +
                        "." +
                        asset.dataFormat +
                        "/get/"
                    );

                }

            );

        }


        /*
         * 初期レイアウト
         */

        scaffolding.relayout();


        /*
         * サイズ確定
         */

        updateStageSize();

    }


    /* =========================================
       ステージサイズ更新
       ========================================= */

    function updateStageSize() {

        if (!scaffolding) {
            return;
        }


        const maximized =
            document.body.classList.contains(
                "maximized-mode"
            );


        /* =====================================
           通常
           ===================================== */

        if (!maximized) {

            projectElement.style.width =
                "480px";

            projectElement.style.height =
                "360px";

            projectElement.style.flex =
                "0 0 480px";

        }


        /* =====================================
           最大化
           ===================================== */

        else {

            const screenWidth =
                window.innerWidth;

            const screenHeight =
                window.innerHeight;


            /*
             * 4:3
             */

            const aspectRatio =
                480 / 360;


            let width =
                screenWidth;


            let height =
                width / aspectRatio;


            /*
             * 高さが画面を超える場合
             */

            if (
                height >
                screenHeight
            ) {

                height =
                    screenHeight;

                width =
                    height * aspectRatio;

            }


            width =
                Math.floor(width);

            height =
                Math.floor(height);


            projectElement.style.width =
                `${width}px`;

            projectElement.style.height =
                `${height}px`;

            projectElement.style.flex =
                `0 0 ${width}px`;

        }


        /*
         * Scaffoldingに新しいサイズを通知
         */

        requestAnimationFrame(
            () => {

                if (scaffolding) {

                    scaffolding.relayout();

                }

            }
        );

    }


    /* =========================================
       最大化切り替え
       ========================================= */

    function toggleMaximize() {

        const maximized =
            document.body.classList.contains(
                "maximized-mode"
            );


        if (maximized) {

            /*
             * 最大化解除
             */

            document.body.classList.remove(
                "maximized-mode"
            );

            document.body.classList.add(
                "normal-mode"
            );


            maximizeButton.textContent =
                "⤡";


            maximizeButton.title =
                "ステージを拡大";


            maximizeButton.setAttribute(
                "aria-label",
                "ステージを拡大"
            );

        }

        else {

            /*
             * 最大化
             */

            document.body.classList.remove(
                "normal-mode"
            );

            document.body.classList.add(
                "maximized-mode"
            );


            maximizeButton.textContent =
                "⤢";


            maximizeButton.title =
                "ステージを縮小";


            maximizeButton.setAttribute(
                "aria-label",
                "ステージを縮小"
            );

        }


        /*
         * サイズ再計算
         */

        updateStageSize();

    }


    /* =========================================
       プロジェクト情報
       ========================================= */

    function displayProjectInfo(
        metadata
    ) {

        const title =
            metadata.title ||
            "タイトル不明";


        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectInfo.textContent =
            `タイトル: ${title}　作者: ${author}`;

    }


    /* =========================================
       TurboWarp API
       ========================================= */

    async function getProjectMetadata(
        projectId
    ) {

        const url =
            "https://trampoline.turbowarp.org/api/projects/" +
            encodeURIComponent(
                projectId
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            if (
                response.status ===
                404
            ) {

                throw new Error(
                    "プロジェクトが存在しないか、非公開です。"
                );

            }


            throw new Error(
                `TurboWarp API HTTP ${response.status}`
            );

        }


        return await response.json();

    }


    /* =========================================
       SB3取得
       ========================================= */

    async function getProjectData(
        projectId,
        projectToken
    ) {

        const url =
            "https://projects.scratch.mit.edu/" +
            encodeURIComponent(
                projectId
            ) +
            "?token=" +
            encodeURIComponent(
                projectToken
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                `SB3 HTTP ${response.status}`
            );

        }


        return await response.arrayBuffer();

    }


    /* =========================================
       SB3ダウンロード
       ========================================= */

    function setupSb3Download(
        arrayBuffer,
        projectId
    ) {

        /*
         * 前回のURLを破棄
         */

        if (currentSb3Url) {

            URL.revokeObjectURL(
                currentSb3Url
            );

        }


        const blob =
            new Blob(
                [arrayBuffer],
                {
                    type:
                        "application/octet-stream"
                }
            );


        currentSb3Url =
            URL.createObjectURL(
                blob
            );


        downloadSb3Button.disabled =
            false;


        downloadSb3Button.onclick =
            () => {

                if (!currentSb3Url) {
                    return;
                }


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    currentSb3Url;


                link.download =
                    `${projectId}.sb3`;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();

            };

    }


    /* =========================================
       プロジェクト読み込み
       ========================================= */

    async function loadProject() {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;

        }


        if (
            !/^\d+$/.test(projectId)
        ) {

            setStatus(
                "プロジェクトIDは数字で入力してください。"
            );

            return;

        }


        loadButton.disabled =
            true;


        downloadSb3Button.disabled =
            true;


        try {

            /* ---------------------------------
               メタデータ
               --------------------------------- */

            setStatus(
                "プロジェクト情報を取得しています..."
            );


            const metadata =
                await getProjectMetadata(
                    projectId
                );


            const projectToken =
                metadata.project_token;


            if (!projectToken) {

                throw new Error(
                    "project_tokenを取得できませんでした。"
                );

            }


            currentProjectId =
                projectId;

            currentProjectToken =
                projectToken;


            displayProjectInfo(
                metadata
            );


            /* ---------------------------------
               SB3
               --------------------------------- */

            setStatus(
                "SB3ファイルを取得しています..."
            );


            const sb3Buffer =
                await getProjectData(
                    projectId,
                    projectToken
                );


            /* ---------------------------------
               ダウンロード
               --------------------------------- */

            setupSb3Download(
                sb3Buffer,
                projectId
            );


            /* ---------------------------------
               Scaffolding
               --------------------------------- */

            setStatus(
                "プロジェクトを読み込んでいます..."
            );


            await scaffolding.loadProject(
                sb3Buffer
            );


            /*
             * レイアウト再計算
             */

            updateStageSize();


            /*
             * Green Flag
             */

            scaffolding.greenFlag();


            setStatus(
                "読み込み完了"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "読み込みに失敗しました: " +
                error.message
            );

        }

        finally {

            loadButton.disabled =
                false;

        }

    }


    /* =========================================
       停止
       ========================================= */

    function stopProject() {

        if (!scaffolding) {
            return;
        }


        try {

            scaffolding.stopAll();


            setStatus(
                "プロジェクトを停止しました。"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "停止に失敗しました: " +
                error.message
            );

        }

    }


    /* =========================================
       イベント
       ========================================= */

    loadButton.addEventListener(
        "click",
        loadProject
    );


    stopButton.addEventListener(
        "click",
        stopProject
    );


    maximizeButton.addEventListener(
        "click",
        toggleMaximize
    );


    /* Enterで読み込み */

    projectIdInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                loadProject();

            }

        }
    );


    /* =========================================
       ウィンドウサイズ変更
       ========================================= */

    window.addEventListener(
        "resize",
        () => {

            updateStageSize();

        }
    );


    /* =========================================
       初期化
       ========================================= */

    try {

        initializeScaffolding();


        setStatus(
            "プロジェクトIDを入力してください。"
        );

    }

    catch (error) {

        console.error(
            "Scaffolding initialization error:",
            error
        );


        setStatus(
            "TurboWarp Playerの初期化に失敗しました: " +
            error.message
        );

    }

</script>

</body>
</html>
