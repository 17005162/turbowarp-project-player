<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TurboWarp Project Player</title>

    <!-- TurboWarp Scaffolding -->
    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: sans-serif;
        }

        h1 {
            margin-top: 0;
        }

        .input-area {
            margin-bottom: 15px;
        }

        #projectId {
            width: 300px;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 14px;
            margin-left: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin: 10px 0;
            min-height: 24px;
        }

        #projectInfo {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        #project {
            width: 480px;
            height: 360px;
            background: #000;
            margin-top: 15px;
        }

        #downloadArea {
            margin-top: 15px;
        }

        #downloadSb3 {
            display: none;
        }

        .error {
            color: #d00;
        }

        .success {
            color: #080;
        }
    </style>
</head>

<body>

<h1>TurboWarp Project Player</h1>

<div class="input-area">
    <input
        id="projectId"
        type="text"
        placeholder="Scratch Project ID"
    >

    <button id="loadButton">
        読み込む
    </button>

    <button id="stopButton">
        停止
    </button>
</div>

<div id="status">
    Project IDを入力してください。
</div>

<div id="projectInfo"></div>

<div id="project"></div>

<div id="downloadArea">
    <a id="downloadSb3" download>
        <button>SB3をダウンロード</button>
    </a>
</div>


<script>

/* =========================================================
   グローバル変数
   ========================================================= */

let scaffolding = null;
let currentSb3 = null;
let currentProjectId = null;


/* =========================================================
   HTML要素
   ========================================================= */

const projectIdInput =
    document.getElementById("projectId");

const loadButton =
    document.getElementById("loadButton");

const stopButton =
    document.getElementById("stopButton");

const statusElement =
    document.getElementById("status");

const projectInfoElement =
    document.getElementById("projectInfo");

const projectElement =
    document.getElementById("project");

const downloadSb3 =
    document.getElementById("downloadSb3");


/* =========================================================
   ステータス表示
   ========================================================= */

function setStatus(message, type = "") {

    statusElement.textContent = message;

    statusElement.className = type;
}


/* =========================================================
   Scaffolding初期化
   ========================================================= */

function initializeScaffolding() {

    console.log("Scaffolding初期化開始");


    /*
     * Scaffolding本体を作成
     */

    scaffolding =
        new Scaffolding.Scaffolding();


    /*
     * 初期設定
     */

    scaffolding.width = 480;

    scaffolding.height = 360;

    scaffolding.resizeMode =
        "preserve-ratio";

    scaffolding.editableLists = false;

    scaffolding.shouldConnectPeripherals = true;

    scaffolding.usePackagedRuntime = false;


    /*
     * Scaffoldingを初期化
     */

    scaffolding.setup();


    /*
     * HTMLへ追加
     */

    scaffolding.appendTo(projectElement);


    /*
     * デバッグ用
     */

    console.log(
        "Scaffolding:",
        scaffolding
    );

    console.log(
        "Storage:",
        scaffolding.storage
    );


    /*
     * Storageが存在する場合のみ
     * Scratchのアセットサーバーを設定
     *
     * v0.2.0では環境によってstorageが
     * 公開されていない場合があるため、
     * ここで存在確認する。
     */

    if (
        scaffolding.storage &&
        typeof scaffolding.storage.addWebStore === "function"
    ) {

        const storage =
            scaffolding.storage;


        storage.addWebStore(

            [
                storage.AssetType.ImageVector,
                storage.AssetType.ImageBitmap,
                storage.AssetType.Sound
            ],

            (asset) => {

                return (
                    "https://assets.scratch.mit.edu/internalapi/asset/" +
                    asset.assetId +
                    "." +
                    asset.dataFormat +
                    "/get/"
                );

            }
        );


        console.log(
            "Scratchアセットサーバーを設定しました"
        );

    } else {

        console.warn(
            "scaffolding.storage が利用できません"
        );

    }


    console.log(
        "Scaffolding初期化完了"
    );
}


/* =========================================================
   プロジェクトメタデータ取得
   ========================================================= */

async function getProjectMetadata(projectId) {

    const response = await fetch(
        `https://trampoline.turbowarp.org/api/projects/${projectId}`
    );


    if (response.status === 404) {

        throw new Error(
            "プロジェクトが存在しないか、非共有プロジェクトです。"
        );

    }


    if (!response.ok) {

        throw new Error(
            `メタデータ取得エラー: HTTP ${response.status}`
        );

    }


    return await response.json();
}


/* =========================================================
   SB3取得
   ========================================================= */

async function getProjectData(
    projectId,
    metadata
) {

    const token =
        metadata.project_token;


    if (!token) {

        throw new Error(
            "project_token が取得できませんでした。"
        );

    }


    const response = await fetch(
        `https://projects.scratch.mit.edu/${projectId}?token=${token}`
    );


    if (!response.ok) {

        throw new Error(
            `SB3取得エラー: HTTP ${response.status}`
        );

    }


    return await response.arrayBuffer();
}


/* =========================================================
   プロジェクト情報表示
   ========================================================= */

function displayProjectInfo(metadata) {

    const title =
        metadata.title ?? "不明";

    const author =
        metadata.author?.username ??
        metadata.creator ??
        "不明";


    projectInfoElement.innerHTML = `
        <strong>タイトル:</strong>
        ${escapeHtml(title)}
        <br>

        <strong>作者:</strong>
        ${escapeHtml(author)}
        <br>

        <strong>ID:</strong>
        ${escapeHtml(String(metadata.id ?? ""))}
    `;
}


/* =========================================================
   HTMLエスケープ
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   SB3ダウンロードリンク作成
   ========================================================= */

function setupSb3Download(
    sb3Buffer,
    projectId
) {

    const blob =
        new Blob(
            [sb3Buffer],
            {
                type:
                    "application/x.scratch.sb3"
            }
        );


    const url =
        URL.createObjectURL(blob);


    downloadSb3.href = url;

    downloadSb3.download =
        `${projectId}.sb3`;

    downloadSb3.style.display =
        "inline-block";
}


/* =========================================================
   プロジェクト読み込み
   ========================================================= */

async function loadProject() {

    const projectId =
        projectIdInput.value.trim();


    if (!projectId) {

        setStatus(
            "Project IDを入力してください。",
            "error"
        );

        return;
    }


    /*
     * 数字だけを許可
     */

    if (!/^\d+$/.test(projectId)) {

        setStatus(
            "Project IDは数字で入力してください。",
            "error"
        );

        return;
    }


    try {

        setStatus(
            "プロジェクト情報を取得中..."
        );


        /*
         * メタデータ取得
         */

        const metadata =
            await getProjectMetadata(
                projectId
            );


        console.log(
            "Metadata:",
            metadata
        );


        displayProjectInfo(
            metadata
        );


        setStatus(
            "SB3を取得中..."
        );


        /*
         * SB3取得
         */

        const sb3Buffer =
            await getProjectData(
                projectId,
                metadata
            );


        currentSb3 =
            sb3Buffer;

        currentProjectId =
            projectId;


        /*
         * ダウンロード設定
         */

        setupSb3Download(
            sb3Buffer,
            projectId
        );


        setStatus(
            "TurboWarp Playerに読み込み中..."
        );


        /*
         * ScaffoldingへSB3を読み込む
         */

        await scaffolding.loadProject(
            sb3Buffer
        );


        setStatus(
            "読み込み完了。実行します。",
            "success"
        );


        /*
         * 緑の旗
         */

        scaffolding.greenFlag();


        console.log(
            "プロジェクト実行開始"
        );

    } catch (error) {

        console.error(
            "プロジェクト読み込みエラー:",
            error
        );


        setStatus(
            "エラー: " + error.message,
            "error"
        );

    }
}


/* =========================================================
   プロジェクト停止
   ========================================================= */

function stopProject() {

    if (!scaffolding) {
        return;
    }


    try {

        scaffolding.stopAll();

        setStatus(
            "プロジェクトを停止しました。"
        );

    } catch (error) {

        console.error(
            "停止エラー:",
            error
        );

    }
}


/* =========================================================
   ボタン
   ========================================================= */

loadButton.addEventListener(
    "click",
    loadProject
);


stopButton.addEventListener(
    "click",
    stopProject
);


/*
 * Enterキーでも読み込めるようにする
 */

projectIdInput.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {

            loadProject();

        }

    }
);


/* =========================================================
   ページ読み込み時
   ========================================================= */

try {

    /*
     * ここでfunctionを呼び出す
     */

    initializeScaffolding();

    setStatus(
        "Project IDを入力してください。"
    );

} catch (error) {

    console.error(
        "TurboWarp Playerの初期化に失敗しました。",
        error
    );


    setStatus(
        "TurboWarp Playerの初期化に失敗しました: " +
        error.message,
        "error"
    );

}

</script>

</body>
</html>
