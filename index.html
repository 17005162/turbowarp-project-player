<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TurboWarp Project Player</title>

    <!-- TurboWarp Scaffolding -->
    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

    <style>

        /* =========================================
           基本
           ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                "Noto Sans JP",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }


        body {
            padding: 20px;
        }


        /* =========================================
           上部UI
           ========================================= */

        #controlPanel {
            width: 100%;
            max-width: 900px;

            margin: 0 auto 15px auto;

            display: flex;
            flex-wrap: wrap;

            align-items: center;

            gap: 8px;
        }


        #projectIdInput {
            flex: 1 1 300px;

            height: 38px;

            padding: 0 10px;

            font-size: 16px;

            border: 1px solid #aaa;
            border-radius: 5px;

            outline: none;
        }


        #projectIdInput:focus {
            border-color: #555;
        }


        button {
            height: 38px;

            padding: 0 14px;

            border: none;
            border-radius: 5px;

            background: #333;
            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        button:hover {
            background: #555;
        }


        button:disabled {
            background: #aaa;
            cursor: default;
        }


        /* =========================================
           ステータス
           ========================================= */

        #status {
            width: 100%;
            max-width: 900px;

            margin: 0 auto 8px auto;

            min-height: 22px;

            font-size: 14px;
        }


        #projectInfo {
            width: 100%;
            max-width: 900px;

            margin: 0 auto 15px auto;

            font-size: 14px;
        }


        /* =========================================
           ステージ領域
           ========================================= */

        #stageArea {

            width: 100%;

            min-height: 360px;

            display: flex;

            justify-content: center;
            align-items: center;

            margin-top: 15px;

            background: transparent;

        }


        /* =========================================
           Scaffolding本体
           ========================================= */

        #project {

            width: 480px;
            height: 360px;

            flex: 0 0 480px;

            position: relative;

            overflow: hidden;

            background: black;

        }


        /* =========================================
           最大化モード
           ========================================= */

        body.maximized-mode {

            margin: 0;
            padding: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

        }


        body.maximized-mode #stageArea {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            display: flex;

            justify-content: center;
            align-items: center;

            background: black;

            z-index: 9999;

        }


        body.maximized-mode #project {

            flex: 0 0 auto;

            position: relative;

            background: black;

            overflow: hidden;

        }


        /* =========================================
           最大化ボタン
           ========================================= */

        #maximizeButton {

            position: fixed;

            right: 12px;
            bottom: 12px;

            width: 42px;
            height: 42px;

            margin: 0;
            padding: 0;

            border: none;
            border-radius: 6px;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 25px;
            line-height: 42px;

            text-align: center;

            cursor: pointer;

            z-index: 10000;

        }


        #maximizeButton:hover {

            background: rgba(0, 0, 0, 0.85);

        }


        /* =========================================
           最大化中は通常UIを隠す
           ========================================= */

        body.maximized-mode #controlPanel,
        body.maximized-mode #status,
        body.maximized-mode #projectInfo {

            display: none;

        }

    </style>
</head>


<body class="normal-mode">


    <!-- =========================================
         操作パネル
         ========================================= -->

    <div id="controlPanel">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch のプロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

        <button id="stopButton">
            停止
        </button>

        <button id="downloadSb3Button">
            SB3ダウンロード
        </button>

        <button
            id="maximizeButton"
            title="ステージを拡大"
        >
            ⤡
        </button>

    </div>


    <!-- =========================================
         ステータス
         ========================================= -->

    <div id="status">
        プロジェクトIDを入力してください。
    </div>


    <!-- =========================================
         プロジェクト情報
         ========================================= -->

    <div id="projectInfo"></div>


    <!-- =========================================
         ステージ
         ========================================= -->

    <div id="stageArea">

        <div id="project"></div>

    </div>


<script>

    /* =========================================
       DOM
       ========================================= */

    const projectIdInput =
        document.getElementById(
            "projectIdInput"
        );


    const loadButton =
        document.getElementById(
            "loadButton"
        );


    const stopButton =
        document.getElementById(
            "stopButton"
        );


    const downloadSb3Button =
        document.getElementById(
            "downloadSb3Button"
        );


    const maximizeButton =
        document.getElementById(
            "maximizeButton"
        );


    const statusElement =
        document.getElementById(
            "status"
        );


    const projectInfo =
        document.getElementById(
            "projectInfo"
        );


    const projectElement =
        document.getElementById(
            "project"
        );


    /* =========================================
       グローバル
       ========================================= */

    let scaffolding = null;

    let currentProjectId = null;

    let currentProjectToken = null;

    let currentSb3Blob = null;


    /* =========================================
       ステータス表示
       ========================================= */

    function setStatus(message) {

        statusElement.textContent =
            message;

    }


    /* =========================================
       TurboWarp Scaffolding 初期化
       ========================================= */

    function initializeScaffolding() {

        if (
            typeof Scaffolding ===
            "undefined"
        ) {

            throw new Error(
                "TurboWarp Scaffolding が読み込まれていません。"
            );

        }


        scaffolding =
            new Scaffolding();


        /*
         * Scaffoldingをproject要素に追加
         */

        scaffolding.appendTo(
            projectElement
        );


        /*
         * アスペクト比を維持
         */

        scaffolding.resizeMode =
            "preserve-ratio";


        /*
         * Scratchの画像・音声などを
         * assets.scratch.mit.edu から取得
         *
         * v0.2.0ではstorageが存在しない環境も
         * あるため、必ず存在確認する。
         */

        if (
            scaffolding.storage &&
            typeof scaffolding.storage.addWebStore ===
                "function"
        ) {

            const storage =
                scaffolding.storage;


            storage.addWebStore(

                [
                    storage.AssetType.ImageVector,
                    storage.AssetType.ImageBitmap,
                    storage.AssetType.Sound
                ],

                (asset) => {

                    return (
                        "https://assets.scratch.mit.edu/internalapi/asset/" +
                        asset.assetId +
                        "." +
                        asset.dataFormat +
                        "/get/"
                    );

                }

            );

        }


        /*
         * 初期レイアウト
         */

        scaffolding.relayout();


        /*
         * ステージサイズを確定
         */

        updateStageSize();

    }


    /* =========================================
       ステージサイズ更新
       ========================================= */

    function updateStageSize() {

        if (!scaffolding) {
            return;
        }


        const isMaximized =
            document.body.classList.contains(
                "maximized-mode"
            );


        /* -------------------------------------
           通常モード
           ------------------------------------- */

        if (!isMaximized) {

            projectElement.style.width =
                "480px";

            projectElement.style.height =
                "360px";

            projectElement.style.flex =
                "0 0 480px";

        }


        /* -------------------------------------
           最大化モード
           ------------------------------------- */

        else {

            const availableWidth =
                window.innerWidth;


            const availableHeight =
                window.innerHeight;


            /*
             * Scratchの標準ステージ比率
             *
             * 480 : 360
             *
             * = 4 : 3
             */

            const aspectRatio =
                480 / 360;


            let width =
                availableWidth;


            let height =
                width / aspectRatio;


            /*
             * 高さが画面を超える場合
             */

            if (
                height >
                availableHeight
            ) {

                height =
                    availableHeight;

                width =
                    height *
                    aspectRatio;

            }


            /*
             * 整数化
             */

            width =
                Math.floor(width);


            height =
                Math.floor(height);


            /*
             * project要素そのもののサイズを
             * 変更する
             */

            projectElement.style.width =
                `${width}px`;


            projectElement.style.height =
                `${height}px`;


            projectElement.style.flex =
                `0 0 ${width}px`;

        }


        /*
         * Scaffoldingへサイズ変更を通知
         *
         * これがマウス座標計算にも重要
         */

        requestAnimationFrame(
            () => {

                if (scaffolding) {

                    scaffolding.relayout();

                }

            }
        );

    }


    /* =========================================
       最大化トグル
       ========================================= */

    function toggleMaximize() {

        const isMaximized =
            document.body.classList.contains(
                "maximized-mode"
            );


        /* -------------------------------------
           最大化 → 通常
           ------------------------------------- */

        if (isMaximized) {

            document.body.classList.remove(
                "maximized-mode"
            );


            document.body.classList.add(
                "normal-mode"
            );


            maximizeButton.textContent =
                "⤡";


            maximizeButton.title =
                "ステージを拡大";

        }


        /* -------------------------------------
           通常 → 最大化
           ------------------------------------- */

        else {

            document.body.classList.remove(
                "normal-mode"
            );


            document.body.classList.add(
                "maximized-mode"
            );


            maximizeButton.textContent =
                "⤢";


            maximizeButton.title =
                "ステージを縮小";

        }


        /*
         * レイアウト更新
         */

        updateStageSize();

    }


    /* =========================================
       プロジェクト情報表示
       ========================================= */

    function displayProjectInfo(
        metadata
    ) {

        if (!metadata) {

            projectInfo.textContent =
                "";

            return;

        }


        const title =
            metadata.title ||
            "タイトル不明";


        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectInfo.textContent =
            `タイトル: ${title}　作者: ${author}`;

    }


    /* =========================================
       TurboWarp API
       ========================================= */

    async function getProjectMetadata(
        projectId
    ) {

        const url =
            "https://trampoline.turbowarp.org/api/projects/" +
            encodeURIComponent(
                projectId
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                `TurboWarp API エラー: ${response.status}`
            );

        }


        const metadata =
            await response.json();


        return metadata;

    }


    /* =========================================
       SB3取得
       ========================================= */

    async function getProjectData(
        projectId,
        projectToken
    ) {

        const url =
            "https://projects.scratch.mit.edu/" +
            encodeURIComponent(projectId) +
            "?token=" +
            encodeURIComponent(projectToken);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                `SB3取得エラー: ${response.status}`
            );

        }


        const arrayBuffer =
            await response.arrayBuffer();


        return arrayBuffer;

    }


    /* =========================================
       SB3ダウンロード設定
       ========================================= */

    function setupSb3Download(
        arrayBuffer,
        projectId
    ) {

        if (currentSb3Blob) {

            URL.revokeObjectURL(
                currentSb3Blob
            );

        }


        const blob =
            new Blob(
                [arrayBuffer],
                {
                    type:
                        "application/octet-stream"
                }
            );


        currentSb3Blob =
            URL.createObjectURL(
                blob
            );


        downloadSb3Button.onclick =
            () => {

                if (!currentSb3Blob) {

                    return;

                }


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    currentSb3Blob;


                link.download =
                    `${projectId}.sb3`;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();

            };

    }


    /* =========================================
       プロジェクト読み込み
       ========================================= */

    async function loadProject() {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;

        }


        /*
         * 数字以外を拒否
         */

        if (!/^\d+$/.test(projectId)) {

            setStatus(
                "プロジェクトIDは数字で入力してください。"
            );

            return;

        }


        loadButton.disabled =
            true;


        downloadSb3Button.disabled =
            true;


        try {

            setStatus(
                "プロジェクト情報を取得しています..."
            );


            /*
             * TurboWarp API
             */

            const metadata =
                await getProjectMetadata(
                    projectId
                );


            /*
             * project_token
             */

            const projectToken =
                metadata.project_token;


            if (!projectToken) {

                throw new Error(
                    "project_token が取得できませんでした。"
                );

            }


            currentProjectId =
                projectId;


            currentProjectToken =
                projectToken;


            /*
             * 情報表示
             */

            displayProjectInfo(
                metadata
            );


            setStatus(
                "SB3ファイルを取得しています..."
            );


            /*
             * SB3取得
             */

            const sb3Buffer =
                await getProjectData(
                    projectId,
                    projectToken
                );


            /*
             * ダウンロード準備
             */

            setupSb3Download(
                sb3Buffer,
                projectId
            );


            downloadSb3Button.disabled =
                false;


            setStatus(
                "TurboWarp Playerに読み込んでいます..."
            );


            /*
             * SB3をScaffoldingへロード
             */

            await scaffolding.loadProject(
                sb3Buffer
            );


            /*
             * レイアウト更新
             */

            updateStageSize();


            /*
             * Green Flag
             */

            scaffolding.greenFlag();


            setStatus(
                "読み込み完了"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "読み込みに失敗しました: " +
                error.message
            );

        }

        finally {

            loadButton.disabled =
                false;

        }

    }


    /* =========================================
       プロジェクト停止
       ========================================= */

    function stopProject() {

        if (!scaffolding) {

            return;

        }


        try {

            scaffolding.stopAll();


            setStatus(
                "プロジェクトを停止しました。"
            );

        }

        catch (error) {

            console.error(
                error
            );


            setStatus(
                "停止に失敗しました: " +
                error.message
            );

        }

    }


    /* =========================================
       ボタンイベント
       ========================================= */

    loadButton.addEventListener(
        "click",
        loadProject
    );


    stopButton.addEventListener(
        "click",
        stopProject
    );


    maximizeButton.addEventListener(
        "click",
        toggleMaximize
    );


    /* =========================================
       Enterキーで読み込み
       ========================================= */

    projectIdInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                loadProject();

            }

        }
    );


    /* =========================================
       ウィンドウサイズ変更
       ========================================= */

    window.addEventListener(
        "resize",
        () => {

            updateStageSize();

        }
    );


    /* =========================================
       Scaffolding初期化
       ========================================= */

    try {

        initializeScaffolding();

        setStatus(
            "プロジェクトIDを入力してください。"
        );

    }

    catch (error) {

        console.error(
            error
        );


        setStatus(
            "TurboWarp Playerの初期化に失敗しました: " +
            error.message
        );

    }

</script>

</body>
</html>
