<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurboWarp Project Player</title>

<!-- TurboWarp Scaffolding -->
<script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

<style>

/* =========================================================
   基本
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: white;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

    color: #222;
}


/* =========================================================
   ページ
   ========================================================= */

#page {
    width: 100%;
    min-height: 100vh;

    padding: 20px;
}


/* =========================================================
   入力欄
   ========================================================= */

#inputArea {
    width: 100%;
    max-width: 700px;

    margin: 0 auto 12px;

    display: flex;
    align-items: center;

    gap: 8px;
}

#projectIdInput {
    flex: 1;

    height: 38px;

    padding: 0 12px;

    border: 1px solid #bbb;
    border-radius: 6px;

    font-size: 16px;

    outline: none;
}

#projectIdInput:focus {
    border-color: #777;
}

#loadButton {
    height: 38px;

    padding: 0 18px;

    border: none;
    border-radius: 6px;

    background: #4a90e2;
    color: white;

    font-size: 15px;

    cursor: pointer;
}

#loadButton:hover {
    background: #357abd;
}

#loadButton:disabled {
    opacity: 0.5;
    cursor: default;
}


/* =========================================================
   ステータス
   ========================================================= */

#status {
    width: 100%;
    max-width: 700px;

    min-height: 22px;

    margin: 0 auto 8px;

    font-size: 14px;

    color: #555;
}


/* =========================================================
   プロジェクト情報
   ========================================================= */

#projectInfo {
    width: 100%;
    max-width: 700px;

    margin: 0 auto 15px;

    display: none;
}

#projectTitle {
    font-size: 18px;
    font-weight: bold;

    margin-bottom: 3px;
}

#projectAuthor {
    color: #666;
    font-size: 14px;
}


/* =========================================================
   プレイヤー
   ========================================================= */

#playerArea {
    width: 480px;

    margin: 0 auto;

    display: flex;
    flex-direction: column;

    align-items: stretch;
}


/* =========================================================
   ツールバー
   ========================================================= */

#stageToolbar {
    width: 480px;
    height: 40px;

    flex: 0 0 40px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    background: white;

    padding: 0 2px;

    position: relative;
    z-index: 100;
}

#stageControls {
    display: flex;

    align-items: center;

    gap: 3px;
}


/* =========================================================
   ステージ
   ========================================================= */

#project {
    width: 480px;
    height: 360px;

    flex: 0 0 360px;

    margin: 0;
    padding: 0;

    background: black;

    position: relative;

    overflow: hidden;
}


/*
 * Scaffoldingのルート
 *
 * 親要素 #project と同じサイズにする。
 */
#project > .sc-root {
    width: 100% !important;
    height: 100% !important;

    margin: 0 !important;
    padding: 0 !important;
}


/* =========================================================
   操作ボタン
   ========================================================= */

.stage-control {
    width: 32px;
    height: 32px;

    padding: 0;
    margin: 0;

    border: none;
    border-radius: 5px;

    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    position: relative;
}

.stage-control:hover {
    background: rgba(0, 0, 0, 0.08);
}

.stage-control:disabled {
    opacity: 0.4;
    cursor: default;
}

.stage-control:disabled:hover {
    background: transparent;
}


/* =========================================================
   緑の旗
   ========================================================= */

/*
 * 実行中だけ薄灰色の膜を付ける。
 */
#startButton.running {
    background: rgba(205, 205, 205, 0.70);
}

.flag-icon {
    width: 18px;
    height: 19px;

    position: relative;

    display: block;
}

.flag-icon::before {
    content: "";

    position: absolute;

    left: 3px;
    top: 1px;

    width: 2px;
    height: 18px;

    background: #555;

    border-radius: 1px;
}

.flag-icon::after {
    content: "";

    position: absolute;

    left: 5px;
    top: 2px;

    width: 12px;
    height: 9px;

    background: #4caf50;

    border-radius: 1px 3px 3px 1px;
}


/* =========================================================
   一時停止アイコン
   ========================================================= */

.pause-icon {
    width: 14px;
    height: 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 3px;
}

.pause-icon::before,
.pause-icon::after {
    content: "";

    width: 4px;
    height: 18px;

    background: #f0a000;

    border-radius: 1px;
}


/* =========================================================
   再生アイコン
   ========================================================= */

.play-icon {
    width: 0;
    height: 0;

    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;

    border-left: 14px solid #f0a000;

    margin-left: 3px;
}


/* =========================================================
   停止アイコン
   ========================================================= */

.stop-icon {
    width: 18px;
    height: 18px;

    background: #e05252;

    border: 1px solid #c13d3d;

    border-radius: 4px;
}


/* =========================================================
   最大化ボタン
   ========================================================= */

#maximizeButton {
    width: 32px;
    height: 32px;

    padding: 0;

    border: none;
    border-radius: 5px;

    background: transparent;

    color: #333;

    font-size: 18px;
    line-height: 32px;

    cursor: pointer;
}

#maximizeButton:hover {
    background: rgba(0, 0, 0, 0.08);
}


/* =========================================================
   ダウンロード
   ========================================================= */

#downloadArea {
    width: 480px;

    margin: 12px auto 0;

    text-align: center;

    display: none;
}

#downloadButton {
    height: 34px;

    padding: 0 14px;

    border: 1px solid #aaa;
    border-radius: 5px;

    background: white;

    color: #333;

    cursor: pointer;
}

#downloadButton:hover {
    background: #f1f1f1;
}


/* =========================================================
   最大化
   ========================================================= */

#playerArea.maximized {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    margin: 0;
    padding: 0;

    width: auto;
    height: auto;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    /*
     * 最大化時の背景も白
     */
    background: white;

    z-index: 10000;
}


/*
 * 最大化時の画面全体の背景
 */
#playerArea.maximized::before {
    content: "";

    position: fixed;

    left: 50%;
    top: 50%;

    width: 100vw;
    height: 100vh;

    transform: translate(-50%, -50%);

    background: white;

    z-index: -1;
}


/*
 * 最大化時もツールバーは
 * ステージと同じ幅
 */
#playerArea.maximized #stageToolbar {
    flex: none;
}


/*
 * 最大化時のステージ
 */
#playerArea.maximized #project {
    flex: none;
}


/* =========================================================
   小さい画面
   ========================================================= */

@media (max-width: 520px) {

    #page {
        padding: 10px;
    }

    #playerArea {
        width: 100%;
    }

    #stageToolbar {
        width: 100%;
    }

    #project {
        width: 100%;
        height: auto;

        aspect-ratio: 4 / 3;

        flex: 0 0 auto;
    }

    #downloadArea {
        width: 100%;
    }
}

</style>
</head>


<body>

<div id="page">


    <!-- =====================================================
         プロジェクトID入力
         ===================================================== -->

    <div id="inputArea">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch プロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

    </div>


    <!-- =====================================================
         ステータス
         ===================================================== -->

    <div id="status"></div>


    <!-- =====================================================
         プロジェクト情報
         ===================================================== -->

    <div id="projectInfo">

        <div id="projectTitle"></div>

        <div id="projectAuthor"></div>

    </div>


    <!-- =====================================================
         プレイヤー
         ===================================================== -->

    <div id="playerArea">


        <!-- =================================================
             ツールバー
             ================================================= -->

        <div id="stageToolbar">

            <div id="stageControls">


                <!-- スタート -->

                <button
                    id="startButton"
                    class="stage-control"
                    title="スタート"
                >
                    <span class="flag-icon"></span>
                </button>


                <!-- 一時停止 / 再開 -->

                <button
                    id="pauseButton"
                    class="stage-control"
                    title="一時停止"
                    disabled
                >
                    <span class="pause-icon"></span>
                </button>


                <!-- 停止 -->

                <button
                    id="stopButton"
                    class="stage-control"
                    title="停止"
                >
                    <span class="stop-icon"></span>
                </button>

            </div>


            <!-- 最大化 -->

            <button
                id="maximizeButton"
                title="最大化"
            >
                ⤡
            </button>

        </div>


        <!-- =================================================
             TurboWarp Scaffolding
             ================================================= -->

        <div id="project"></div>

    </div>


    <!-- =====================================================
         SB3ダウンロード
         ===================================================== -->

    <div id="downloadArea">

        <button id="downloadButton">
            SB3をダウンロード
        </button>

    </div>

</div>


<script>

/* =========================================================
   グローバル変数
   ========================================================= */

let scaffolding = null;

let projectLoaded = false;

let projectState = "stopped";

let currentProjectId = null;

let currentSb3Buffer = null;

let isMaximized = false;


/* =========================================================
   DOM
   ========================================================= */

const projectElement =
    document.getElementById("project");

const playerArea =
    document.getElementById("playerArea");

const stageToolbar =
    document.getElementById("stageToolbar");

const projectIdInput =
    document.getElementById("projectIdInput");

const loadButton =
    document.getElementById("loadButton");

const statusElement =
    document.getElementById("status");

const projectInfo =
    document.getElementById("projectInfo");

const projectTitle =
    document.getElementById("projectTitle");

const projectAuthor =
    document.getElementById("projectAuthor");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");

const stopButton =
    document.getElementById("stopButton");

const maximizeButton =
    document.getElementById("maximizeButton");

const downloadArea =
    document.getElementById("downloadArea");

const downloadButton =
    document.getElementById("downloadButton");


/* =========================================================
   ステータス
   ========================================================= */

function setStatus(text) {

    statusElement.textContent =
        text;
}


/* =========================================================
   Scaffolding初期化
   ========================================================= */

function initializeScaffolding() {

    if (scaffolding) {
        return;
    }


    try {

        scaffolding =
            new Scaffolding.Scaffolding();


        /*
         * Scratch標準サイズ
         */
        scaffolding.width = 480;

        scaffolding.height = 360;


        /*
         * 親要素とScaffoldingの
         * 表示領域を一致させる。
         */
        scaffolding.resizeMode =
            "stretch";


        scaffolding.editableLists =
            false;

        scaffolding.shouldConnectPeripherals =
            true;

        scaffolding.usePackagedRuntime =
            false;


        /*
         * 初期化
         */
        scaffolding.setup();


        /*
         * Scratchアセット
         */
        if (
            scaffolding.storage &&
            typeof scaffolding.storage.addWebStore === "function"
        ) {

            const storage =
                scaffolding.storage;


            storage.addWebStore(
                [
                    storage.AssetType.ImageVector,
                    storage.AssetType.ImageBitmap,
                    storage.AssetType.Sound
                ],

                (asset) => {

                    return (
                        "https://assets.scratch.mit.edu/internalapi/asset/" +
                        asset.assetId +
                        "." +
                        asset.dataFormat +
                        "/get/"
                    );

                }
            );
        }


        /*
         * Scaffoldingを追加
         */
        scaffolding.appendTo(
            projectElement
        );


        /*
         * DOM確定後にレイアウト
         */
        requestAnimationFrame(
            () => {

                scaffolding.relayout();

            }
        );


        updateControlButtons();


    } catch (error) {

        console.error(
            "Scaffolding initialization error:",
            error
        );


        setStatus(
            "TurboWarp Playerの初期化に失敗しました。"
        );


        throw error;
    }
}


/* =========================================================
   ボタン状態更新
   ========================================================= */

function updateControlButtons() {

    /*
     * 実行中
     */
    if (
        projectState === "running"
    ) {

        /*
         * 緑旗の後ろに薄灰色
         */
        startButton.classList.add(
            "running"
        );


        /*
         * 一時停止アイコン
         */
        pauseButton.innerHTML =
            `<span class="pause-icon"></span>`;


        pauseButton.title =
            "一時停止";


        pauseButton.disabled =
            false;
    }


    /*
     * 一時停止中
     */
    else if (
        projectState === "paused"
    ) {

        startButton.classList.remove(
            "running"
        );


        /*
         * 再生アイコン
         */
        pauseButton.innerHTML =
            `<span class="play-icon"></span>`;


        pauseButton.title =
            "再開";


        pauseButton.disabled =
            false;
    }


    /*
     * 停止中
     */
    else {

        startButton.classList.remove(
            "running"
        );


        pauseButton.innerHTML =
            `<span class="pause-icon"></span>`;


        pauseButton.title =
            "一時停止";


        pauseButton.disabled =
            true;
    }
}


/* =========================================================
   一時停止
   ========================================================= */

function pauseProject() {

    if (!scaffolding) {
        return;
    }


    const runtime =
        scaffolding.vm?.runtime;


    if (!runtime) {
        return;
    }


    /*
     * 実行ループだけを停止する。
     *
     * これによりプロジェクトの
     * 変数や位置などをリセットしない。
     */
    if (
        runtime.frameLoop &&
        runtime.frameLoop.running
    ) {

        runtime.frameLoop.stop();

    }
}


/* =========================================================
   再開
   ========================================================= */

function resumeProject() {

    if (!scaffolding) {
        return;
    }


    const runtime =
        scaffolding.vm?.runtime;


    if (!runtime) {
        return;
    }


    /*
     * 停止していた実行ループを再開
     */
    if (
        runtime.frameLoop &&
        !runtime.frameLoop.running
    ) {

        runtime.frameLoop.start();

    }
}


/* =========================================================
   プロジェクト読み込み
   ========================================================= */

async function loadProject(projectId) {

    initializeScaffolding();


    currentProjectId =
        projectId;


    loadButton.disabled =
        true;


    projectLoaded =
        false;


    projectState =
        "stopped";


    updateControlButtons();


    projectInfo.style.display =
        "none";


    downloadArea.style.display =
        "none";


    try {

        /* =============================================
           1. メタデータ取得
           ============================================= */

        setStatus(
            "プロジェクト情報を取得しています..."
        );


        const metadataResponse =
            await fetch(
                "https://trampoline.turbowarp.org/api/projects/" +
                encodeURIComponent(projectId)
            );


        if (!metadataResponse.ok) {

            throw new Error(
                "プロジェクト情報の取得に失敗しました。" +
                " HTTP " +
                metadataResponse.status
            );
        }


        const metadata =
            await metadataResponse.json();


        /* =============================================
           2. プロジェクト情報
           ============================================= */

        const title =
            metadata.title ||
            "無題のプロジェクト";


        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectTitle.textContent =
            title;


        projectAuthor.textContent =
            "作者: " + author;


        projectInfo.style.display =
            "block";


        /* =============================================
           3. project_token
           ============================================= */

        const projectToken =
            metadata.project_token;


        if (!projectToken) {

            throw new Error(
                "project_tokenを取得できませんでした。"
            );
        }


        /* =============================================
           4. SB3取得
           ============================================= */

        setStatus(
            "プロジェクトデータを取得しています..."
        );


        const sb3Url =
            "https://projects.scratch.mit.edu/" +
            encodeURIComponent(projectId) +
            "?token=" +
            encodeURIComponent(projectToken);


        const sb3Response =
            await fetch(sb3Url);


        if (!sb3Response.ok) {

            throw new Error(
                "SB3の取得に失敗しました。" +
                " HTTP " +
                sb3Response.status
            );
        }


        const sb3Buffer =
            await sb3Response.arrayBuffer();


        if (
            !sb3Buffer ||
            sb3Buffer.byteLength === 0
        ) {

            throw new Error(
                "SB3データが空です。"
            );
        }


        currentSb3Buffer =
            sb3Buffer;


        /* =============================================
           5. Scaffoldingへ読み込み
           ============================================= */

        setStatus(
            "TurboWarp Playerに読み込んでいます..."
        );


        await scaffolding.loadProject(
            sb3Buffer
        );


        /* =============================================
           6. 初期状態
           ============================================= */

        projectLoaded =
            true;


        projectState =
            "stopped";


        /*
         * レイアウト更新
         */
        scaffolding.relayout();


        requestAnimationFrame(
            () => {

                scaffolding.relayout();

            }
        );


        updateControlButtons();


        /* =============================================
           7. ダウンロード表示
           ============================================= */

        downloadArea.style.display =
            "block";


        setStatus(
            "読み込み完了"
        );


    } catch (error) {

        console.error(
            error
        );


        projectLoaded =
            false;


        projectState =
            "stopped";


        updateControlButtons();


        setStatus(
            "読み込みに失敗しました: " +
            (error.message || error)
        );


    } finally {

        loadButton.disabled =
            false;
    }
}


/* =========================================================
   読み込みボタン
   ========================================================= */

loadButton.addEventListener(
    "click",
    () => {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;
        }


        loadProject(
            projectId
        );
    }
);


/* =========================================================
   Enterキー
   ========================================================= */

projectIdInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            loadButton.click();
        }
    }
);


/* =========================================================
   スタート
   ========================================================= */

startButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /*
         * 停止中
         *
         * → 最初から実行
         */
        if (
            projectState === "stopped"
        ) {

            scaffolding.greenFlag();


            projectState =
                "running";


            updateControlButtons();


            return;
        }


        /*
         * 一時停止中
         *
         * → 途中から再開
         */
        if (
            projectState === "paused"
        ) {

            resumeProject();


            projectState =
                "running";


            updateControlButtons();


            return;
        }
    }
);


/* =========================================================
   一時停止 / 再開
   ========================================================= */

pauseButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /*
         * 実行中
         * ↓
         * 一時停止
         */
        if (
            projectState === "running"
        ) {

            pauseProject();


            projectState =
                "paused";


            updateControlButtons();


            return;
        }


        /*
         * 一時停止中
         * ↓
         * 再開
         */
        if (
            projectState === "paused"
        ) {

            resumeProject();


            projectState =
                "running";


            updateControlButtons();


            return;
        }
    }
);


/* =========================================================
   停止
   ========================================================= */

stopButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /*
         * 実行中でも
         * 一時停止中でも停止可能
         */
        scaffolding.stopAll();


        projectState =
            "stopped";


        updateControlButtons();
    }
);


/* =========================================================
   最大化サイズ計算
   ========================================================= */

function calculateMaxStageSize() {

    /*
     * ブラウザの表示領域
     */
    const viewportWidth =
        document.documentElement.clientWidth;

    const viewportHeight =
        document.documentElement.clientHeight;


    /*
     * ツールバー高さ
     */
    const toolbarHeight =
        40;


    /*
     * ステージに使用可能な高さ
     */
    const availableHeight =
        Math.max(
            1,
            viewportHeight -
            toolbarHeight
        );


    /*
     * まず幅いっぱいにする
     */
    let width =
        viewportWidth;

    let height =
        width * 3 / 4;


    /*
     * 高さが入りきらない場合は
     * 高さ基準にする
     */
    if (
        height >
        availableHeight
    ) {

        height =
            availableHeight;

        width =
            height * 4 / 3;
    }


    /*
     * 整数化
     */
    width =
        Math.floor(width);

    height =
        Math.floor(height);


    return {
        width,
        height
    };
}


/* =========================================================
   レイアウト適用
   ========================================================= */

function applyStageLayout() {

    /*
     * ================================================
     * 通常状態
     * ================================================
     */

    if (!isMaximized) {

        playerArea.style.width =
            "480px";


        playerArea.style.height =
            "400px";


        stageToolbar.style.width =
            "480px";


        projectElement.style.width =
            "480px";


        projectElement.style.height =
            "360px";


        projectElement.style.flexBasis =
            "360px";
    }


    /*
     * ================================================
     * 最大化状態
     * ================================================
     */

    else {

        const size =
            calculateMaxStageSize();


        /*
         * プレイヤー全体
         */
        playerArea.style.width =
            size.width + "px";


        playerArea.style.height =
            (size.height + 40) + "px";


        /*
         * ツールバー
         */
        stageToolbar.style.width =
            size.width + "px";


        /*
         * ステージ
         */
        projectElement.style.width =
            size.width + "px";


        projectElement.style.height =
            size.height + "px";


        projectElement.style.flexBasis =
            size.height + "px";
    }


    /*
     * Scaffoldingに新しいサイズを
     * 伝える。
     *
     * CSS反映後に実行することが重要。
     */
    if (
        scaffolding &&
        typeof scaffolding.relayout === "function"
    ) {

        requestAnimationFrame(
            () => {

                scaffolding.relayout();


                /*
                 * さらに1フレーム後にも
                 * 再計算する。
                 */
                requestAnimationFrame(
                    () => {

                        scaffolding.relayout();

                    }
                );
            }
        );
    }
}


/* =========================================================
   最大化ボタン
   ========================================================= */

maximizeButton.addEventListener(
    "click",
    () => {

        isMaximized =
            !isMaximized;


        if (isMaximized) {

            playerArea.classList.add(
                "maximized"
            );


            maximizeButton.textContent =
                "⤢";


            maximizeButton.title =
                "通常サイズ";

        } else {

            playerArea.classList.remove(
                "maximized"
            );


            maximizeButton.textContent =
                "⤡";


            maximizeButton.title =
                "最大化";
        }


        applyStageLayout();
    }
);


/* =========================================================
   ウィンドウサイズ変更
   ========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (isMaximized) {

            applyStageLayout();
        }
    }
);


/* =========================================================
   SB3ダウンロード
   ========================================================= */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !currentSb3Buffer ||
            !currentProjectId
        ) {
            return;
        }


        const blob =
            new Blob(
                [currentSb3Buffer],
                {
                    type:
                        "application/x.scratch.sb3"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement("a");


        link.href =
            url;


        link.download =
            "project_" +
            currentProjectId +
            ".sb3";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            () => {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );
    }
);


/* =========================================================
   初期状態
   ========================================================= */

projectState =
    "stopped";


updateControlButtons();


setStatus(
    "プロジェクトIDを入力してください。"
);

</script>
