<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurboWarp Project Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(900px, 94%);
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #projectId {
            flex: 1;

            padding: 12px;
            font-size: 16px;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;

            font-size: 15px;

            border: none;
            border-radius: 6px;

            background: #4c97ff;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #4285e5;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .status {
            padding: 12px;

            margin-bottom: 20px;

            border-radius: 6px;

            background: white;
            border: 1px solid #ddd;

            white-space: pre-wrap;
        }

        .project-info {
            display: none;

            padding: 20px;

            margin-bottom: 20px;

            background: white;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .project-info h2 {
            margin-top: 0;
        }

        .info-row {
            margin: 8px 0;
        }

        .label {
            font-weight: bold;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            margin-top: 20px;
        }

        #playerContainer {
            display: none;

            margin-top: 20px;

            background: black;

            border-radius: 8px;

            overflow: hidden;
        }

        #playerFrame {
            width: 100%;
            height: 600px;

            border: none;

            display: block;
        }

        .note {
            margin-top: 20px;

            color: #777;

            font-size: 13px;
        }

        @media (max-width: 600px) {
            .input-area {
                flex-direction: column;
            }

            #playerFrame {
                height: 500px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TurboWarp Project Player</h1>

    <div class="description">
        Scratch / TurboWarp プロジェクトIDを入力してプロジェクトを読み込みます。
    </div>

    <div class="input-area">

        <input
            type="text"
            id="projectId"
            placeholder="例: 1299419976"
            autocomplete="off"
        >

        <button id="loadButton">
            読み込む
        </button>

    </div>


    <div
        id="status"
        class="status"
    >
        プロジェクトIDを入力してください。
    </div>


    <div
        id="projectInfo"
        class="project-info"
    >

        <h2 id="projectTitle">
            プロジェクト情報
        </h2>

        <div class="info-row">
            <span class="label">
                作者:
            </span>

            <span id="projectCreator">
                不明
            </span>
        </div>

        <div class="info-row">
            <span class="label">
                公開状態:
            </span>

            <span id="projectVisibility">
                不明
            </span>
        </div>

        <div class="info-row">
            <span class="label">
                プロジェクトID:
            </span>

            <span id="projectIdDisplay">
                -
            </span>
        </div>


        <div class="buttons">

            <button
                id="downloadSb3Button"
                disabled
            >
                SB3をダウンロード
            </button>

        </div>

    </div>


    <div
        id="playerContainer"
    >

        <iframe
            id="playerFrame"
            title="TurboWarp Project Player"
        ></iframe>

    </div>


    <div class="note">
        ※ 現在はSB3の取得・ダウンロードまで対応しています。
    </div>

</div>


<script>

    /*
     * ==========================================
     * DOM
     * ==========================================
     */

    const projectIdInput =
        document.getElementById("projectId");

    const loadButton =
        document.getElementById("loadButton");

    const status =
        document.getElementById("status");

    const projectInfo =
        document.getElementById("projectInfo");

    const projectTitle =
        document.getElementById("projectTitle");

    const projectCreator =
        document.getElementById("projectCreator");

    const projectVisibility =
        document.getElementById("projectVisibility");

    const projectIdDisplay =
        document.getElementById("projectIdDisplay");

    const downloadSb3Button =
        document.getElementById("downloadSb3Button");

    const playerContainer =
        document.getElementById("playerContainer");

    const playerFrame =
        document.getElementById("playerFrame");


    /*
     * ==========================================
     * 現在読み込んでいるプロジェクト
     * ==========================================
     */

    let currentProjectId = null;

    let currentProjectMetadata = null;

    let currentSb3Buffer = null;


    /*
     * ==========================================
     * ステータス表示
     * ==========================================
     */

    function setStatus(message) {

        status.textContent = message;

    }


    /*
     * ==========================================
     * プロジェクトID取得
     * ==========================================
     */

    function getProjectId() {

        return projectIdInput.value.trim();

    }


    /*
     * ==========================================
     * TurboWarp API
     * プロジェクト情報取得
     * ==========================================
     */

    async function getProjectMetadata(projectId) {

        const url =
            `https://trampoline.turbowarp.org/api/projects/${projectId}`;

        const response =
            await fetch(url);

        if (response.status === 404) {

            throw new Error(
                "プロジェクトが存在しないか、共有されていません。"
            );

        }

        if (!response.ok) {

            throw new Error(
                `プロジェクト情報の取得に失敗しました。HTTP ${response.status}`
            );

        }

        return await response.json();

    }


    /*
     * ==========================================
     * SB3取得
     * ==========================================
     */

    async function getProjectSB3(projectId, token) {

        const url =
            `https://projects.scratch.mit.edu/${projectId}?token=${encodeURIComponent(token)}`;

        const response =
            await fetch(url);

        if (!response.ok) {

            throw new Error(
                `SB3の取得に失敗しました。HTTP ${response.status}`
            );

        }

        return await response.arrayBuffer();

    }


    /*
     * ==========================================
     * SB3ダウンロード
     * ==========================================
     */

    function downloadSB3() {

        if (!currentSb3Buffer) {

            setStatus(
                "SB3データがありません。先にプロジェクトを読み込んでください。"
            );

            return;

        }


        const blob =
            new Blob(
                [currentSb3Buffer],
                {
                    type: "application/zip"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");

        link.href = url;

        link.download =
            `${currentProjectId}.sb3`;


        document.body.appendChild(link);

        link.click();

        link.remove();


        URL.revokeObjectURL(url);

    }


    /*
     * ==========================================
     * プロジェクト情報表示
     * ==========================================
     */

    function displayProjectMetadata(metadata) {

        currentProjectMetadata =
            metadata;


        projectTitle.textContent =
            metadata.title ?? "不明";


        /*
         * 作者名
         *
         * APIでは
         *
         * metadata.author.username
         *
         * に入っている
         */

        projectCreator.textContent =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectVisibility.textContent =
            metadata.visibility ??
            (
                metadata.public
                    ? "public"
                    : "unknown"
            );


        projectIdDisplay.textContent =
            metadata.id ?? currentProjectId;


        projectInfo.style.display =
            "block";

    }


    /*
     * ==========================================
     * プロジェクト読み込み
     * ==========================================
     */

    async function loadProject() {

        const projectId =
            getProjectId();


        /*
         * IDチェック
         */

        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;

        }


        /*
         * 読み込み開始
         */

        loadButton.disabled =
            true;

        downloadSb3Button.disabled =
            true;


        projectInfo.style.display =
            "none";


        playerContainer.style.display =
            "none";


        currentProjectId =
            null;

        currentProjectMetadata =
            null;

        currentSb3Buffer =
            null;


        try {

            /*
             * ----------------------------------
             * Step 1
             * プロジェクト情報取得
             * ----------------------------------
             */

            setStatus(
                "プロジェクト情報を取得しています..."
            );


            const metadata =
                await getProjectMetadata(
                    projectId
                );


            /*
             * デバッグ用
             */

            console.log(
                "Project metadata:",
                metadata
            );


            console.log(
                "Creator:",
                metadata.creator
            );


            console.log(
                "Metadata keys:",
                Object.keys(metadata)
            );


            console.log(
                "Metadata JSON:",
                JSON.stringify(
                    metadata,
                    null,
                    2
                )
            );


            /*
             * project_token確認
             */

            if (!metadata.project_token) {

                throw new Error(
                    "project_tokenが取得できませんでした。"
                );

            }


            /*
             * ----------------------------------
             * プロジェクト情報表示
             * ----------------------------------
             */

            currentProjectId =
                projectId;


            displayProjectMetadata(
                metadata
            );


            /*
             * ----------------------------------
             * Step 2
             * SB3取得
             * ----------------------------------
             */

            setStatus(
                "SB3ファイルを取得しています..."
            );


            const sb3Buffer =
                await getProjectSB3(
                    projectId,
                    metadata.project_token
                );


            /*
             * SB3保存
             */

            currentSb3Buffer =
                sb3Buffer;


            /*
             * SB3取得成功
             */

            console.log(
                "SB3取得成功:",
                sb3Buffer.byteLength,
                "bytes"
            );


            downloadSb3Button.disabled =
                false;


            /*
             * ----------------------------------
             * 完了
             * ----------------------------------
             */

            setStatus(
                "プロジェクトの読み込みに成功しました。"
            );


        } catch (error) {

            console.error(
                "loadProject error:",
                error
            );


            setStatus(
                "エラーが発生しました。\n\n" +
                error.message
            );


        } finally {

            loadButton.disabled =
                false;

        }

    }


    /*
     * ==========================================
     * ボタン
     * ==========================================
     */

    loadButton.addEventListener(
        "click",
        loadProject
    );


    downloadSb3Button.addEventListener(
        "click",
        downloadSB3
    );


    /*
     * ==========================================
     * Enterキー
     * ==========================================
     */

    projectIdInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                loadProject();

            }

        }
    );


</script>

</body>
</html>
