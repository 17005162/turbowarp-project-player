<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurboWarp Project Player</title>

<script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    body {
        min-height: 100vh;
    }

    /* =========================
       上部UI
       ========================= */

    #topbar {
        width: 100%;
        padding: 12px 16px;
        background: #ffffff;
        border-bottom: 1px solid #ddd;

        display: flex;
        align-items: center;
        gap: 8px;

        position: relative;
        z-index: 100;
    }

    #projectIdInput {
        width: 260px;
        height: 38px;

        padding: 0 12px;

        border: 1px solid #bbb;
        border-radius: 6px;

        font-size: 16px;
        outline: none;
    }

    #projectIdInput:focus {
        border-color: #4caf50;
    }

    button {
        height: 38px;
        min-width: 42px;

        padding: 0 12px;

        border: 1px solid #bbb;
        border-radius: 6px;

        background: #ffffff;

        cursor: pointer;

        font-size: 15px;

        position: relative;
    }

    button:hover:not(:disabled) {
        background: #f0f0f0;
    }

    button:active:not(:disabled) {
        background: #e5e5e5;
    }

    button:disabled {
        opacity: 0.45;
        cursor: default;
    }

    #loadButton {
        background: #4caf50;
        color: white;
        border-color: #4caf50;
    }

    #loadButton:hover:not(:disabled) {
        background: #43a047;
    }

    #downloadButton {
        display: none;
    }

    /* =========================
       プロジェクト情報
       ========================= */

    #info {
        padding: 12px 16px;

        background: #ffffff;
        border-bottom: 1px solid #ddd;

        min-height: 52px;
    }

    #projectTitle {
        font-size: 18px;
        font-weight: bold;
    }

    #projectAuthor {
        margin-top: 3px;
        font-size: 13px;
        color: #666;
    }

    #status {
        margin-top: 5px;
        font-size: 13px;
        color: #666;
    }

    /* =========================
       プレイヤー全体
       ========================= */

    #playerWrapper {
        width: 100%;

        display: flex;
        justify-content: center;
        align-items: flex-start;

        padding: 20px;

        position: relative;
    }

    /* =========================
       ステージ
       ========================= */

    #playerArea {
        width: 480px;
        height: 360px;

        position: relative;

        background: #ffffff;

        overflow: hidden;

        flex-shrink: 0;
    }

    /*
     * 最大化時
     * topbar + info の下に4:3で最大サイズを作る
     */
    #playerArea.maximized {
        position: fixed;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        width: min(96vw, calc((100vh - 40px) * 4 / 3));
        height: min(96vh, calc(96vw * 3 / 4));

        z-index: 1000;

        background: #ffffff;
    }

    /*
     * Scaffolding自身のrootには
     * width/heightを上書きしない。
     *
     * Scaffolding.relayout()に任せる。
     */

    /* =========================
       下部コントロール
       ========================= */

    #controls {
        width: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 8px;

        padding: 12px 0 20px;

        position: relative;
        z-index: 50;
    }

    #startButton,
    #pauseButton,
    #stopButton,
    #fullscreenButton {
        width: 46px;
        height: 42px;

        padding: 0;
    }

    /* =========================
       緑の旗
       ========================= */

    .flag-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 20px;
        height: 21px;

        transform: translate(-50%, -50%);
    }

    .flag-pole {
        position: absolute;

        left: 2px;
        top: 1px;

        width: 3px;
        height: 19px;

        background: #4caf50;

        border-radius: 1px;
    }

    .flag-cloth {
        position: absolute;

        left: 5px;
        top: 1px;

        width: 13px;
        height: 10px;

        background: #4caf50;

        clip-path: polygon(
            0 0,
            100% 0,
            78% 50%,
            100% 100%,
            0 100%
        );
    }

    /* =========================
       一時停止
       ========================= */

    .pause-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 14px;
        height: 18px;

        transform: translate(-50%, -50%);
    }

    .pause-icon::before,
    .pause-icon::after {
        content: "";

        position: absolute;

        top: 0;

        width: 5px;
        height: 18px;

        background: #555;

        border-radius: 1px;
    }

    .pause-icon::before {
        left: 0;
    }

    .pause-icon::after {
        right: 0;
    }

    /* =========================
       再生
       ========================= */

    .play-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 0;
        height: 0;

        transform: translate(-35%, -50%);

        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 14px solid #555;
    }

    /* =========================
       停止
       ========================= */

    .stop-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 15px;
        height: 15px;

        transform: translate(-50%, -50%);

        background: #555;

        border-radius: 2px;
    }

    /* =========================
       最大化アイコン
       ========================= */

    .maximize-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 17px;
        height: 17px;

        transform: translate(-50%, -50%);
    }

    .maximize-icon::before,
    .maximize-icon::after {
        content: "";

        position: absolute;

        width: 8px;
        height: 8px;

        border: 2px solid #555;
    }

    .maximize-icon::before {
        left: 0;
        top: 0;

        border-right: none;
        border-bottom: none;
    }

    .maximize-icon::after {
        right: 0;
        bottom: 0;

        border-left: none;
        border-top: none;
    }

    /* =========================
       最大化解除アイコン
       ========================= */

    .restore-icon {
        position: absolute;

        left: 50%;
        top: 50%;

        width: 17px;
        height: 17px;

        transform: translate(-50%, -50%);
    }

    .restore-icon::before,
    .restore-icon::after {
        content: "";

        position: absolute;

        width: 8px;
        height: 8px;

        border: 2px solid #555;
    }

    .restore-icon::before {
        left: 0;
        top: 0;
    }

    .restore-icon::after {
        right: 0;
        bottom: 0;
    }

    /* =========================
       スマホ等
       ========================= */

    @media (max-width: 520px) {

        #topbar {
            flex-wrap: wrap;
        }

        #projectIdInput {
            width: 100%;
        }

        #playerWrapper {
            padding: 10px;
        }

        #playerArea {
            width: min(480px, 100%);
            height: auto;
            aspect-ratio: 4 / 3;
        }
    }
</style>
</head>

<body>

<!-- =========================
     上部
     ========================= -->

<div id="topbar">

    <input
        id="projectIdInput"
        type="text"
        placeholder="TurboWarp / Scratch プロジェクトID"
    >

    <button id="loadButton">
        読み込み
    </button>

    <button id="downloadButton">
        SB3ダウンロード
    </button>

</div>


<!-- =========================
     プロジェクト情報
     ========================= -->

<div id="info">

    <div id="projectTitle">
        プロジェクト未読み込み
    </div>

    <div id="projectAuthor">
        作者: -
    </div>

    <div id="status">
        プロジェクトIDを入力してください
    </div>

</div>


<!-- =========================
     プレイヤー
     ========================= -->

<div id="playerWrapper">

    <div id="playerArea">
    </div>

</div>


<!-- =========================
     コントロール
     ========================= -->

<div id="controls">

    <!-- 旗 -->

    <button
        id="startButton"
        title="最初から実行"
        disabled
    >
        <span
            class="flag-icon"
            aria-hidden="true"
        >
            <span class="flag-pole"></span>
            <span class="flag-cloth"></span>
        </span>
    </button>


    <!-- 一時停止 / 再開 -->

    <button
        id="pauseButton"
        title="一時停止"
        disabled
    >
    </button>


    <!-- 停止 -->

    <button
        id="stopButton"
        title="停止"
        disabled
    >
        <span
            class="stop-icon"
            aria-hidden="true"
        ></span>
    </button>


    <!-- 最大化 -->

    <button
        id="fullscreenButton"
        title="最大化"
    >
        <span
            class="maximize-icon"
            aria-hidden="true"
        ></span>
    </button>

</div>


<script>
"use strict";

/* =========================================================
   グローバル
   ========================================================= */

let scaffolding = null;

let projectLoaded = false;

let projectState = "stopped";
// "stopped"
// "running"
// "paused"

let currentProjectId = null;

let currentProjectData = null;


/* =========================================================
   DOM
   ========================================================= */

const projectIdInput =
    document.getElementById("projectIdInput");

const loadButton =
    document.getElementById("loadButton");

const downloadButton =
    document.getElementById("downloadButton");

const projectTitle =
    document.getElementById("projectTitle");

const projectAuthor =
    document.getElementById("projectAuthor");

const statusElement =
    document.getElementById("status");

const playerArea =
    document.getElementById("playerArea");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");

const stopButton =
    document.getElementById("stopButton");

const fullscreenButton =
    document.getElementById("fullscreenButton");


/* =========================================================
   ステータス
   ========================================================= */

function setStatus(text) {
    statusElement.textContent = text;
}


/* =========================================================
   コントロールボタン表示
   ========================================================= */

function updateControlButtons() {

    /*
     * 旗は常に「最初から実行」。
     *
     * 実行中でも一時停止中でも押せる。
     */

    startButton.disabled = !projectLoaded;

    /*
     * 一時停止ボタン
     */

    pauseButton.innerHTML = "";

    const pauseIcon =
        document.createElement("span");

    if (projectState === "paused") {

        pauseIcon.className = "play-icon";

        pauseButton.title = "再開";

        pauseButton.disabled = false;

    } else {

        pauseIcon.className = "pause-icon";

        pauseButton.title = "一時停止";

        pauseButton.disabled =
            projectState !== "running";
    }

    pauseButton.appendChild(pauseIcon);


    /*
     * 停止
     */

    stopButton.disabled = !projectLoaded;
}


/* =========================================================
   Scaffolding初期化
   ========================================================= */

function initializeScaffolding() {

    if (scaffolding) {
        return;
    }

    scaffolding =
        new Scaffolding.Scaffolding();


    /*
     * 通常サイズ
     */

    scaffolding.width = 480;

    scaffolding.height = 360;


    /*
     * 4:3を維持
     */

    scaffolding.resizeMode =
        "preserve-ratio";


    /*
     * Scratchのリスト編集UIなどは不要
     */

    scaffolding.editableLists = false;


    /*
     * キーボード・マウス等を使用
     */

    scaffolding.shouldConnectPeripherals = true;


    /*
     * Packaged Runtimeは使用しない
     */

    scaffolding.usePackagedRuntime = false;


    /*
     * 初期化
     */

    scaffolding.setup();


    /*
     * プレイヤーを配置
     */

    scaffolding.appendTo(playerArea);


    /*
     * Scratchのアセット取得用WebStore
     *
     * Scaffoldingのバージョンによっては
     * storageがsetup後に存在します。
     */

    if (
        scaffolding.storage &&
        typeof scaffolding.storage.addWebStore === "function"
    ) {

        const storage =
            scaffolding.storage;

        storage.addWebStore(
            [
                storage.AssetType.ImageVector,
                storage.AssetType.ImageBitmap,
                storage.AssetType.Sound
            ],
            asset => {
                return (
                    "https://assets.scratch.mit.edu/internalapi/asset/" +
                    asset.assetId +
                    "." +
                    asset.dataFormat +
                    "/get/"
                );
            }
        );
    }


    /*
     * 初回レイアウト
     */

    scaffolding.relayout();


    /*
     * playerAreaのサイズが変化した場合
     */

    if (
        typeof ResizeObserver !== "undefined"
    ) {

        const resizeObserver =
            new ResizeObserver(() => {

                if (scaffolding) {
                    scaffolding.relayout();
                }

            });

        resizeObserver.observe(playerArea);
    }


    /*
     * ページスクロールによって
     * getBoundingClientRect()が変化した場合にも
     * Scaffoldingの座標を更新する。
     */

    window.addEventListener(
        "scroll",
        () => {

            if (scaffolding) {
                scaffolding.relayout();
            }

        },
        {
            passive: true
        }
    );


    /*
     * ブラウザのサイズ変更
     */

    window.addEventListener(
        "resize",
        () => {

            if (scaffolding) {
                scaffolding.relayout();
            }

        }
    );


    /*
     * VisualViewportが存在する場合
     */

    if (window.visualViewport) {

        window.visualViewport.addEventListener(
            "resize",
            () => {

                if (scaffolding) {
                    scaffolding.relayout();
                }

            }
        );

        window.visualViewport.addEventListener(
            "scroll",
            () => {

                if (scaffolding) {
                    scaffolding.relayout();
                }

            }
        );
    }


    /*
     * マウスを押す直前にも座標を更新。
     *
     * Scaffolding内部のlayersRectが古くなっている
     * 場合のズレを防ぐため。
     */

    playerArea.addEventListener(
        "pointerdown",
        () => {

            if (scaffolding) {
                scaffolding.relayout();
            }

        },
        {
            capture: true
        }
    );
}


/* =========================================================
   モニター削除
   ========================================================= */

function clearProjectMonitors() {

    if (!scaffolding) {
        return;
    }


    /*
     * Scaffolding 0.2.0内部のモニターMap
     */

    if (scaffolding._monitors) {

        for (
            const monitor
            of scaffolding._monitors.values()
        ) {

            if (
                monitor &&
                monitor.root
            ) {

                monitor.root.remove();
            }
        }

        scaffolding._monitors.clear();
    }


    /*
     * 念のためoverlay自体も空にする
     */

    if (scaffolding._monitorOverlay) {

        scaffolding._monitorOverlay.replaceChildren();
    }
}


/* =========================================================
   プロジェクトメタデータ取得
   ========================================================= */

async function getProjectMetadata(projectId) {

    const url =
        "https://trampoline.turbowarp.org/api/projects/" +
        encodeURIComponent(projectId);


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "プロジェクト情報の取得に失敗しました。HTTP " +
            response.status
        );
    }


    return await response.json();
}


/* =========================================================
   SB3取得
   ========================================================= */

async function getProjectData(
    projectId,
    metadata
) {

    const token =
        metadata.project_token;


    if (!token) {

        throw new Error(
            "project_tokenを取得できませんでした。"
        );
    }


    const url =
        "https://projects.scratch.mit.edu/" +
        encodeURIComponent(projectId) +
        "?token=" +
        encodeURIComponent(token);


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "SB3の取得に失敗しました。HTTP " +
            response.status
        );
    }


    return await response.arrayBuffer();
}


/* =========================================================
   プロジェクト読み込み
   ========================================================= */

async function loadProject(projectId) {

    initializeScaffolding();


    loadButton.disabled = true;

    downloadButton.disabled = true;


    /*
     * 読み込み中は現在のプロジェクトを
     * 実行できないようにする。
     */

    projectLoaded = false;

    projectState = "stopped";

    updateControlButtons();


    /*
     * 現在のプロジェクトを停止
     */

    if (scaffolding) {

        try {
            scaffolding.stopAll();
        } catch (e) {
            console.warn(e);
        }
    }


    /*
     * 古いモニターを削除
     */

    clearProjectMonitors();


    setStatus("プロジェクト情報を取得中...");


    try {

        /*
         * メタデータ
         */

        const metadata =
            await getProjectMetadata(projectId);


        /*
         * タイトル
         */

        projectTitle.textContent =
            metadata.title ||
            "タイトル不明";


        /*
         * 作者
         */

        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";

        projectAuthor.textContent =
            "作者: " + author;


        /*
         * 非公開等のチェック
         */

        if (
            metadata.public === false ||
            metadata.visibility === "private"
        ) {

            throw new Error(
                "このプロジェクトは公開されていません。"
            );
        }


        setStatus("SB3を取得中...");


        /*
         * SB3取得
         */

        const sb3Buffer =
            await getProjectData(
                projectId,
                metadata
            );


        /*
         * 新しいプロジェクトをロードする直前に
         * もう一度古いモニターを削除。
         *
         * stopAll後に非同期で古いモニターが
         * 作られるケースへの対策。
         */

        clearProjectMonitors();


        currentProjectData =
            sb3Buffer;

        currentProjectId =
            projectId;


        setStatus("TurboWarp Playerに読み込み中...");


        /*
         * SB3ロード
         */

        await scaffolding.loadProject(
            sb3Buffer
        );


        /*
         * ステージ位置・サイズを更新
         */

        scaffolding.relayout();


        requestAnimationFrame(() => {

            if (scaffolding) {
                scaffolding.relayout();
            }

        });


        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                if (scaffolding) {
                    scaffolding.relayout();
                }

            });

        });


        /*
         * 読み込み完了
         */

        projectLoaded = true;

        projectState = "stopped";


        downloadButton.style.display =
            "inline-block";

        downloadButton.disabled = false;


        updateControlButtons();


        setStatus("読み込み完了");


    } catch (error) {

        console.error(error);


        projectLoaded = false;

        projectState = "stopped";


        updateControlButtons();


        projectTitle.textContent =
            "プロジェクト未読み込み";

        projectAuthor.textContent =
            "作者: -";


        setStatus(
            "エラー: " +
            (error.message || error)
        );

    } finally {

        loadButton.disabled = false;

    }
}


/* =========================================================
   旗
   ========================================================= */

/*
 * ここが今回の重要部分。
 *
 * 停止中
 * 実行中
 * 一時停止中
 *
 * どの状態でも
 *
 *      現在の実行を停止
 *          ↓
 *      最初から実行
 *
 * とする。
 */

startButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /*
         * 現在の実行を完全停止
         */

        try {

            // TurboWarpの緑の旗と同じ処理を実行。
            // 実行中・一時停止中でも、最初から再スタートする。
            scaffolding.greenFlag();

        } catch (error) {

            console.error(
                "start error:",
                error
            );

            setStatus(
                "実行開始に失敗しました。"
            );

            projectState = "stopped";

            updateControlButtons();

            return;
        }


        projectState = "running";

        updateControlButtons();


        /*
         * 最大化・位置変更などの直後でも
         * 座標を最新状態にする。
         */

        requestAnimationFrame(() => {

            if (scaffolding) {
                scaffolding.relayout();
            }

        });
    }
);


/* =========================================================
   一時停止 / 再開
   ========================================================= */

pauseButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        /*
         * 実行中
         */

        if (
            projectState === "running"
        ) {

            /*
             * VMを一時停止
             */

            try {

                if (
                    scaffolding.vm &&
                    typeof scaffolding.vm.pause === "function"
                ) {

                    scaffolding.vm.pause();

                } else {

                    /*
                     * Scaffoldingに公開pause APIがない場合の
                     * フォールバック。
                     */

                    scaffolding.vm.runtime.togglePause();
                }

                projectState = "paused";

            } catch (error) {

                console.error(
                    "pause error:",
                    error
                );
            }

        }

        /*
         * 一時停止中
         */

        else if (
            projectState === "paused"
        ) {

            try {

                if (
                    scaffolding.vm &&
                    typeof scaffolding.vm.resume === "function"
                ) {

                    scaffolding.vm.resume();

                } else {

                    scaffolding.vm.runtime.togglePause();
                }

                projectState = "running";

            } catch (error) {

                console.error(
                    "resume error:",
                    error
                );
            }
        }


        updateControlButtons();
    }
);


/* =========================================================
   停止
   ========================================================= */

stopButton.addEventListener(
    "click",
    () => {

        if (
            !scaffolding ||
            !projectLoaded
        ) {
            return;
        }


        try {

            scaffolding.stopAll();

            projectState = "stopped";

            updateControlButtons();

        } catch (error) {

            console.error(
                "stop error:",
                error
            );
        }
    }
);


/* =========================================================
   最大化
   ========================================================= */

fullscreenButton.addEventListener(
    "click",
    () => {

        const maximized =
            playerArea.classList.toggle(
                "maximized"
            );


        /*
         * アイコン変更
         */

        fullscreenButton.innerHTML = "";


        const icon =
            document.createElement("span");


        if (maximized) {

            icon.className =
                "restore-icon";

            fullscreenButton.title =
                "最大化を解除";

        } else {

            icon.className =
                "maximize-icon";

            fullscreenButton.title =
                "最大化";
        }


        fullscreenButton.appendChild(icon);


        /*
         * CSSレイアウト確定後に
         * Scaffoldingの座標系を更新。
         */

        requestAnimationFrame(() => {

            if (scaffolding) {
                scaffolding.relayout();
            }

            requestAnimationFrame(() => {

                if (scaffolding) {
                    scaffolding.relayout();
                }

            });

        });
    }
);


/* =========================================================
   SB3ダウンロード
   ========================================================= */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            !currentProjectData ||
            !currentProjectId
        ) {
            return;
        }


        const blob =
            new Blob(
                [currentProjectData],
                {
                    type:
                        "application/octet-stream"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href = url;

        a.download =
            currentProjectId + ".sb3";


        document.body.appendChild(a);

        a.click();

        a.remove();


        URL.revokeObjectURL(url);
    }
);


/* =========================================================
   読み込みボタン
   ========================================================= */

loadButton.addEventListener(
    "click",
    () => {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;
        }


        loadProject(projectId);
    }
);


/* =========================================================
   Enterで読み込み
   ========================================================= */

projectIdInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            loadButton.click();
        }
    }
);


/* =========================================================
   初期状態
   ========================================================= */

updateControlButtons();

</script>

</body>
</html>
