<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurboWarp Project Player</title>

    <!--
        TurboWarp Scaffolding
        v0.2.0

        音楽拡張を含む版を使用します。
    -->
    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;
            color: #222;
        }

        .container {
            width: min(1000px, 94%);
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #projectId {
            flex: 1;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 18px;

            font-size: 15px;

            border: none;
            border-radius: 6px;

            background: #4c97ff;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #4285e5;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .status {
            padding: 12px;

            margin-bottom: 20px;

            border-radius: 6px;

            background: white;

            border: 1px solid #ddd;

            white-space: pre-wrap;
        }

        .project-info {
            display: none;

            padding: 20px;

            margin-bottom: 20px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;
        }

        .project-info h2 {
            margin-top: 0;
        }

        .info-row {
            margin: 8px 0;
        }

        .label {
            font-weight: bold;
        }

        .buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 20px;
        }

        /*
         * =========================================
         * TurboWarp Player
         * =========================================
         */

        #playerSection {
            display: none;

            margin-top: 20px;
        }

        #playerSection h2 {
            margin-bottom: 12px;
        }

        #playerContainer {
            width: 100%;

            aspect-ratio: 4 / 3;

            background: #000;

            border-radius: 8px;

            overflow: hidden;

            position: relative;
        }

        /*
         * Scaffolding は
         * width: 100%;
         * height: 100%;
         * を使用するので、
         * 親要素のサイズを指定します。
         */

        #project {
            width: 100%;
            height: 100%;
        }

        .player-controls {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 12px;
        }

        .player-controls button {
            background: #333;
        }

        .player-controls button:hover {
            background: #444;
        }

        .note {
            margin-top: 20px;

            color: #777;

            font-size: 13px;
        }

        @media (max-width: 600px) {

            .input-area {
                flex-direction: column;
            }

            #playerContainer {
                aspect-ratio: 4 / 3;
            }

        }
    </style>
</head>


<body>

<div class="container">

    <h1>TurboWarp Project Player</h1>

    <div class="description">
        Scratch / TurboWarp プロジェクトIDを入力してプロジェクトを読み込みます。
    </div>


    <!--
        =========================================
        プロジェクトID入力
        =========================================
    -->

    <div class="input-area">

        <input
            type="text"
            id="projectId"
            placeholder="例: 1299419976"
            autocomplete="off"
        >

        <button id="loadButton">
            読み込む
        </button>

    </div>


    <!--
        =========================================
        ステータス
        =========================================
    -->

    <div
        id="status"
        class="status"
    >
        プロジェクトIDを入力してください。
    </div>


    <!--
        =========================================
        プロジェクト情報
        =========================================
    -->

    <div
        id="projectInfo"
        class="project-info"
    >

        <h2 id="projectTitle">
            プロジェクト情報
        </h2>


        <div class="info-row">

            <span class="label">
                作者:
            </span>

            <span id="projectCreator">
                不明
            </span>

        </div>


        <div class="info-row">

            <span class="label">
                公開状態:
            </span>

            <span id="projectVisibility">
                不明
            </span>

        </div>


        <div class="info-row">

            <span class="label">
                プロジェクトID:
            </span>

            <span id="projectIdDisplay">
                -
            </span>

        </div>


        <div class="buttons">

            <button
                id="downloadSb3Button"
                disabled
            >
                SB3をダウンロード
            </button>

        </div>

    </div>


    <!--
        =========================================
        TurboWarp Player
        =========================================
    -->

    <div
        id="playerSection"
    >

        <h2>
            プロジェクト
        </h2>


        <div
            id="playerContainer"
        >

            <div
                id="project"
            ></div>

        </div>


        <!--
            現段階では基本的な実行ボタンだけ。
            停止・一時停止・高度な設定は
            次の段階で追加します。
        -->

        <div
            class="player-controls"
        >

            <button
                id="greenFlagButton"
                disabled
            >
                ▶ 実行
            </button>

        </div>

    </div>


    <div class="note">

        ※ TurboWarp Scaffoldingを使用してブラウザ上でプロジェクトを実行しています。

    </div>

</div>


<script>

    /*
     * ==========================================
     * DOM
     * ==========================================
     */

    const projectIdInput =
        document.getElementById("projectId");

    const loadButton =
        document.getElementById("loadButton");

    const status =
        document.getElementById("status");

    const projectInfo =
        document.getElementById("projectInfo");

    const projectTitle =
        document.getElementById("projectTitle");

    const projectCreator =
        document.getElementById("projectCreator");

    const projectVisibility =
        document.getElementById("projectVisibility");

    const projectIdDisplay =
        document.getElementById("projectIdDisplay");

    const downloadSb3Button =
        document.getElementById("downloadSb3Button");

    const playerSection =
        document.getElementById("playerSection");

    const projectElement =
        document.getElementById("project");

    const greenFlagButton =
        document.getElementById("greenFlagButton");


    /*
     * ==========================================
     * 現在のプロジェクト
     * ==========================================
     */

    let currentProjectId = null;

    let currentProjectMetadata = null;

    let currentSb3Buffer = null;


    /*
     * ==========================================
     * TurboWarp Scaffolding
     * ==========================================
     *
     * ここで実行環境を作ります。
     */

    let scaffolding = null;

    let scaffoldingReady = false;


    /*
     * ==========================================
     * ステータス
     * ==========================================
     */

    function setStatus(message) {

        status.textContent =
            message;

    }


    /*
     * ==========================================
     * Scaffolding初期化
     * ==========================================
     */

    function initializeScaffolding() {

        /*
         * Scaffoldingの読み込み確認
         */

        if (
            typeof Scaffolding ===
            "undefined"
        ) {

            throw new Error(
                "TurboWarp Scaffoldingの読み込みに失敗しました。"
            );

        }


        /*
         * Scaffoldingインスタンス作成
         */

        scaffolding =
            new Scaffolding.Scaffolding();


        /*
         * プロジェクトの基本サイズ
         */

        scaffolding.width =
            480;

        scaffolding.height =
            360;


        /*
         * ステージのリサイズ方法
         */

        scaffolding.resizeMode =
            "preserve-ratio";


        /*
         * その他の基本設定
         *
         * 高度な設定は今後ここに追加します。
         */

        scaffolding.editableLists =
            false;

        scaffolding.shouldConnectPeripherals =
            true;

        scaffolding.usePackagedRuntime =
            false;


        /*
         * Runtime初期化
         */

        scaffolding.setup();


        /*
         * HTMLへ追加
         */

        scaffolding.appendTo(
            projectElement
        );


        scaffoldingReady =
            true;


        console.log(
            "TurboWarp Scaffolding initialized."
        );

    }


    /*
     * ==========================================
     * プロジェクトID取得
     * ==========================================
     */

    function getProjectId() {

        return projectIdInput.value.trim();

    }


    /*
     * ==========================================
     * プロジェクト情報取得
     * ==========================================
     */

    async function getProjectMetadata(
        projectId
    ) {

        const url =
            `https://trampoline.turbowarp.org/api/projects/${projectId}`;


        const response =
            await fetch(url);


        if (
            response.status ===
            404
        ) {

            throw new Error(
                "プロジェクトが存在しないか、共有されていません。"
            );

        }


        if (!response.ok) {

            throw new Error(
                `プロジェクト情報の取得に失敗しました。HTTP ${response.status}`
            );

        }


        return await response.json();

    }


    /*
     * ==========================================
     * SB3取得
     * ==========================================
     */

    async function getProjectSB3(
        projectId,
        token
    ) {

        const url =
            `https://projects.scratch.mit.edu/${projectId}?token=${encodeURIComponent(token)}`;


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                `SB3の取得に失敗しました。HTTP ${response.status}`
            );

        }


        return await response.arrayBuffer();

    }


    /*
     * ==========================================
     * SB3ダウンロード
     * ==========================================
     */

    function downloadSB3() {

        if (!currentSb3Buffer) {

            setStatus(
                "SB3データがありません。"
            );

            return;

        }


        const blob =
            new Blob(
                [currentSb3Buffer],
                {
                    type: "application/zip"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href =
            url;


        link.download =
            `${currentProjectId}.sb3`;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );

    }


    /*
     * ==========================================
     * プロジェクト情報表示
     * ==========================================
     */

    function displayProjectMetadata(
        metadata
    ) {

        currentProjectMetadata =
            metadata;


        projectTitle.textContent =
            metadata.title ??
            "不明";


        /*
         * APIの実際の構造：
         *
         * metadata.author.username
         */

        projectCreator.textContent =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectVisibility.textContent =
            metadata.visibility ??
            (
                metadata.public
                    ? "public"
                    : "unknown"
            );


        projectIdDisplay.textContent =
            metadata.id ??
            currentProjectId;


        projectInfo.style.display =
            "block";

    }


    /*
     * ==========================================
     * TurboWarpプロジェクト読み込み
     * ==========================================
     */

    async function loadIntoScaffolding(
        sb3Buffer
    ) {

        if (!scaffoldingReady) {

            throw new Error(
                "TurboWarp Scaffoldingが初期化されていません。"
            );

        }


        setStatus(
            "TurboWarpにプロジェクトを読み込んでいます..."
        );


        /*
         * SB3 ArrayBufferを
         * Scaffoldingへ渡す
         */

        await scaffolding.loadProject(
            sb3Buffer
        );


        /*
         * Player表示
         */

        playerSection.style.display =
            "block";


        /*
         * ステージサイズを再計算
         */

        scaffolding.relayout();


        /*
         * 実行ボタン有効化
         */

        greenFlagButton.disabled =
            false;


        setStatus(
            "プロジェクトの読み込みに成功しました。"
        );


        console.log(
            "TurboWarp project loaded successfully."
        );

    }


    /*
     * ==========================================
     * プロジェクト読み込み
     * ==========================================
     */

    async function loadProject() {

        const projectId =
            getProjectId();


        /*
         * IDチェック
         */

        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;

        }


        /*
         * 読み込み中はボタンを無効化
         */

        loadButton.disabled =
            true;

        downloadSb3Button.disabled =
            true;

        greenFlagButton.disabled =
            true;


        /*
         * 古い状態をクリア
         */

        currentProjectId =
            null;

        currentProjectMetadata =
            null;

        currentSb3Buffer =
            null;


        playerSection.style.display =
            "none";


        try {

            /*
             * ----------------------------------
             * Step 1
             * Metadata
             * ----------------------------------
             */

            setStatus(
                "プロジェクト情報を取得しています..."
            );


            const metadata =
                await getProjectMetadata(
                    projectId
                );


            console.log(
                "Project metadata:",
                metadata
            );


            /*
             * project_token確認
             */

            if (
                !metadata.project_token
            ) {

                throw new Error(
                    "project_tokenが取得できませんでした。"
                );

            }


            /*
             * ----------------------------------
             * プロジェクト情報表示
             * ----------------------------------
             */

            currentProjectId =
                projectId;


            displayProjectMetadata(
                metadata
            );


            /*
             * ----------------------------------
             * Step 2
             * SB3
             * ----------------------------------
             */

            setStatus(
                "SB3ファイルを取得しています..."
            );


            const sb3Buffer =
                await getProjectSB3(
                    projectId,
                    metadata.project_token
                );


            currentSb3Buffer =
                sb3Buffer;


            console.log(
                "SB3取得成功:",
                sb3Buffer.byteLength,
                "bytes"
            );


            /*
             * ----------------------------------
             * SB3ダウンロード
             * ----------------------------------
             */

            downloadSb3Button.disabled =
                false;


            /*
             * ----------------------------------
             * Step 3
             * TurboWarp Scaffoldingへ読み込み
             * ----------------------------------
             */

            await loadIntoScaffolding(
                sb3Buffer
            );


        } catch (error) {

            console.error(
                "loadProject error:",
                error
            );


            setStatus(
                "エラーが発生しました。\n\n" +
                error.message
            );


        } finally {

            loadButton.disabled =
                false;

        }

    }


    /*
     * ==========================================
     * 緑旗
     * ==========================================
     */

    function startProject() {

        if (
            !scaffoldingReady
        ) {

            return;

        }


        console.log(
            "Starting project..."
        );


        scaffolding.greenFlag();


        setStatus(
            "プロジェクトを実行しています。"
        );

    }


    /*
     * ==========================================
     * イベント
     * ==========================================
     */

    loadButton.addEventListener(
        "click",
        loadProject
    );


    downloadSb3Button.addEventListener(
        "click",
        downloadSB3
    );


    greenFlagButton.addEventListener(
        "click",
        startProject
    );


    /*
     * Enterキー
     */

    projectIdInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                loadProject();

            }

        }
    );


    /*
     * ==========================================
     * ページ読み込み時
     * Scaffolding初期化
     * ==========================================
     */

    try {

        initializeScaffolding();

        console.log(
            "Player initialization complete."
        );

    } catch (error) {

        console.error(
            "Scaffolding initialization error:",
            error
        );


        setStatus(
            "TurboWarp Playerの初期化に失敗しました。\n\n" +
            error.message
        );

    }

</script>

</body>
</html>
