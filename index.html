<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurboWarp Project Player</title>

<script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background: white;
    color: #222;
}

body {
    overflow-x: hidden;
}

#page,
#inputArea,
#projectInfo,
#stageToolbar,
#stageControls,
#downloadArea,
button,
input {
    box-sizing: border-box;
}


/* ============================================================
   ページ
   ============================================================ */

#page {
    width: 100%;
    min-height: 100vh;
    padding: 20px;
}


/* ============================================================
   入力
   ============================================================ */

#inputArea {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}

#projectIdInput {
    width: 300px;
    height: 36px;
    padding: 0 10px;
    font-size: 16px;
    border: 1px solid #aaa;
    border-radius: 4px;
    outline: none;
}

#projectIdInput:focus {
    border-color: #4a90e2;
}

#loadButton {
    height: 36px;
    padding: 0 18px;
    font-size: 15px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: #f5f5f5;
    cursor: pointer;
}

#loadButton:hover {
    background: #e8e8e8;
}

#loadButton:disabled {
    opacity: 0.6;
    cursor: default;
}


/* ============================================================
   ステータス
   ============================================================ */

#status {
    text-align: center;
    min-height: 22px;
    margin-bottom: 4px;
    font-size: 14px;
}


/* ============================================================
   プロジェクト情報
   ============================================================ */

#projectInfo {
    text-align: center;
    margin-bottom: 10px;
}

#projectTitle {
    font-size: 20px;
    font-weight: bold;
}

#projectAuthor {
    margin-top: 3px;
    font-size: 14px;
    color: #666;
}


/* ============================================================
   プレイヤー
   ============================================================ */

#playerArea {
    width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: white;
}


/* ============================================================
   ツールバー
   ============================================================ */

#stageToolbar {
    width: 480px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    flex-shrink: 0;
}

#stageControls {
    width: auto;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 2px;
}


/* ============================================================
   高度な設定の状態表示
   ============================================================ */

#stageStatusIndicators {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-left: 4px;
    white-space: nowrap;
}

.stage-status-indicator {
    display: none;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    color: #f39c12;
}

.stage-status-indicator.visible {
    display: inline-flex;
}


/* ============================================================
   コントロール
   ============================================================ */

.stage-control {
    width: 32px;
    height: 32px;
    position: relative;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
}

.stage-control:hover {
    background: rgba(220, 220, 220, 0.55);
}

.stage-control:disabled {
    opacity: 0.45;
    cursor: default;
}

.stage-control:disabled:hover {
    background: transparent;
}

#startButton.running {
    background: rgba(205, 205, 205, 0.70);
}


/* ============================================================
   緑旗
   ============================================================ */

.flag-icon {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 19px;
    transform: translate(-50%, -50%);
}

.flag-icon::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 0;
    width: 2px;
    height: 19px;
    background: #4caf50;
    border-radius: 1px;
}

.flag-icon::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 13px;
    height: 9px;
    background: #4caf50;
    clip-path: polygon(
        0 0,
        100% 0,
        78% 50%,
        100% 100%,
        0 100%
    );
}


/* ============================================================
   一時停止
   ============================================================ */

.pause-icon {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 18px;
    transform: translate(-50%, -50%);
}

.pause-icon::before,
.pause-icon::after {
    content: "";
    position: absolute;
    top: 0;
    width: 5px;
    height: 18px;
    background: #f39c12;
    border-radius: 1px;
}

.pause-icon::before {
    left: 0;
}

.pause-icon::after {
    right: 0;
}


/* ============================================================
   再開
   ============================================================ */

.play-icon {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform: translate(-35%, -50%);
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 13px solid #f39c12;
}


/* ============================================================
   停止
   ============================================================ */

.stop-icon {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 17px;
    height: 17px;
    transform: translate(-50%, -50%);
    background: #e53935;
    border-radius: 2px;
}


/* ============================================================
   最大化
   ============================================================ */

#maximizeButton {
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #333;
    font-size: 22px;
    line-height: 32px;
    cursor: pointer;
}

#maximizeButton:hover {
    background: rgba(220, 220, 220, 0.55);
}


/* ============================================================
   ステージ
   ============================================================ */

#project {
    width: 480px;
    height: 360px;
    position: relative;
    background: black;
    overflow: hidden;
}


/* ============================================================
   プロジェクト読み込み中
   ============================================================ */

#projectLoadingOverlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    background: #ff4c4c;
    color: white;
    z-index: 10000;
    pointer-events: auto;
    user-select: none;
}

#projectLoadingOverlay.visible {
    display: flex;
}

.project-loading-blocks {
    position: relative;
    width: 190px;
    height: 105px;
    margin-bottom: 12px;
    overflow: hidden;
}

.project-loading-block {
    position: absolute;
    left: 50%;
    bottom: -42px;
    height: 42px;
    border-radius: 5px;
    border: 2px solid rgba(255, 255, 255, 0.30);
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.18);

    clip-path: polygon(
        0 0,
        28% 0,
        34% 18%,
        43% 18%,
        49% 0,
        100% 0,
        100% 100%,
        8% 100%,
        0 82%
    );

    transform:
        translateX(-50%)
        translateY(120px);

    opacity: 0;

    animation:
        projectLoadingBlockRise
        2.2s
        cubic-bezier(0.25, 0.7, 0.3, 1)
        infinite;
}

.project-loading-block:nth-child(1) {
    width: 142px;
    animation-delay: 0s;
}

.project-loading-block:nth-child(2) {
    width: 105px;
    margin-left: -20px;
    animation-delay: 0.34s;
}

.project-loading-block:nth-child(3) {
    width: 125px;
    margin-left: 18px;
    animation-delay: 0.68s;
}

@keyframes projectLoadingBlockRise {

    0% {
        transform:
            translateX(-50%)
            translateY(125px);
        opacity: 0;
    }

    18% {
        opacity: 0.55;
    }

    58% {
        transform:
            translateX(-50%)
            translateY(5px);
        opacity: 0.38;
    }

    100% {
        transform:
            translateX(-50%)
            translateY(-70px);
        opacity: 0;
    }

}

#projectLoadingText {
    margin: 0;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-align: center;
    white-space: nowrap;
}

#projectLoadingSubtext {
    margin: 12px 0 0;
    font-size: 18px;
    line-height: 1.4;
    font-weight: 500;
    text-align: center;
    opacity: 0.96;
    white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {

    .project-loading-block {
        animation-duration: 3.5s;
    }

}


/* ============================================================
   ダウンロード
   ============================================================ */

#downloadArea {
    width: 480px;
    margin: 12px auto 0;
    text-align: center;
}

#downloadButton {
    height: 34px;
    padding: 0 16px;
    font-size: 14px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: #f5f5f5;
    cursor: pointer;
}

#downloadButton:hover {
    background: #e8e8e8;
}

#downloadButton:disabled {
    opacity: 0.5;
    cursor: default;
}


/* ============================================================
   最大化
   ============================================================ */

#playerArea.maximized {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    margin: 0;
    z-index: 1000;
    background: white;
}

#playerArea.maximized::before {
    content: "";
    position: fixed;
    left: 50%;
    top: 50%;
    width: 100vw;
    height: 100vh;
    transform: translate(-50%, -50%);
    background: white;
    z-index: -1;
}


/* ============================================================
   小さい画面
   ============================================================ */

@media (max-width: 520px) {

    #page {
        padding-left: 10px;
        padding-right: 10px;
    }

    #inputArea {
        flex-direction: column;
    }

    #projectIdInput {
        width: min(300px, 100%);
    }

    #playerArea,
    #stageToolbar,
    #downloadArea {
        width: 100%;
        max-width: 480px;
    }

    #project {
        width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
    }

    #stageToolbar {
        height: 40px;
    }

    #projectLoadingText {
        font-size: 22px;
    }

    #projectLoadingSubtext {
        font-size: 14px;
    }

}


/* ============================================================
   高度な設定
   ============================================================ */

#advancedSettingsButton {
    width: auto;
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #333;
    font-size: 13px;
    cursor: pointer;
}

#advancedSettingsButton:hover {
    background: rgba(220, 220, 220, 0.55);
}

#advancedSettingsOverlay {
    position: fixed;
    left: 0;
    top: 0;
    width: 100vw;
    height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.28);
    z-index: 3000;
}

#advancedSettingsOverlay.visible {
    display: flex;
}

#advancedSettingsPanel {
    width: min(440px, calc(100vw - 32px));
    max-height: min(720px, calc(100vh - 32px));
    box-sizing: border-box;
    overflow-y: auto;
    padding: 18px;
    background: white;
    border: 1px solid #bbb;
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
    color: #222;
}

#advancedSettingsPanel h2 {
    margin: 0 0 16px;
    font-size: 20px;
}

.advanced-setting {
    padding: 11px 0;
    border-bottom: 1px solid #e3e3e3;
}

.advanced-setting:last-of-type {
    border-bottom: none;
}

.advanced-setting-main {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 28px;
}

.advanced-setting-main input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    flex: 0 0 auto;
}

.advanced-setting-main label {
    cursor: pointer;
    font-size: 15px;
}

.advanced-setting-description {
    margin: 5px 0 0 27px;
    color: #666;
    font-size: 12px;
    line-height: 1.45;
}

#fpsSliderArea {
    display: none;
    margin: 10px 0 0 27px;
}

#fpsSliderArea.visible {
    display: block;
}

#fpsSlider {
    width: 100%;
}

#fpsValue {
    display: inline-block;
    min-width: 58px;
    margin-left: 7px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
}

.advanced-settings-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 15px;
}

#advancedSettingsCloseButton {
    height: 34px;
    padding: 0 15px;
    border: 1px solid #aaa;
    border-radius: 4px;
    background: #f5f5f5;
    cursor: pointer;
}

#advancedSettingsCloseButton:hover {
    background: #e8e8e8;
}

</style>
</head>


<body>

<div id="page">

    <div id="inputArea">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch プロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

    </div>


    <div id="status"></div>


    <div id="projectInfo">

        <div id="projectTitle"></div>

        <div id="projectAuthor"></div>

    </div>


    <div id="playerArea">

        <div id="stageToolbar">

            <div id="stageControls">

                <button
                    id="startButton"
                    class="stage-control"
                    title="開始"
                >
                    <span class="flag-icon"></span>
                </button>


                <button
                    id="pauseButton"
                    class="stage-control"
                    title="一時停止"
                    disabled
                >
                    <span class="pause-icon"></span>
                </button>


                <button
                    id="stopButton"
                    class="stage-control"
                    title="停止"
                    disabled
                >
                    <span class="stop-icon"></span>
                </button>


                <div
                    id="stageStatusIndicators"
                    aria-live="polite"
                >

                    <span
                        id="stageStatusTurbo"
                        class="stage-status-indicator"
                    >ターボモード</span>

                    <span
                        id="stageStatusFps"
                        class="stage-status-indicator"
                    >60 FPS</span>

                    <span
                        id="stageStatusInterpolation"
                        class="stage-status-indicator"
                    >補完機能</span>

                </div>

            </div>


            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:2px;
                "
            >

                <button
                    id="advancedSettingsButton"
                    title="高度な設定"
                    aria-label="高度な設定"
                >⚙</button>

                <button
                    id="maximizeButton"
                    title="最大化"
                >⤡</button>

            </div>

        </div>


        <div id="project">

            <div
                id="projectLoadingOverlay"
                aria-live="polite"
                aria-busy="true"
            >

                <div
                    class="project-loading-blocks"
                    aria-hidden="true"
                >

                    <div class="project-loading-block"></div>
                    <div class="project-loading-block"></div>
                    <div class="project-loading-block"></div>

                </div>

                <p id="projectLoadingText">
                    プロジェクトを読み込み中...
                </p>

                <p id="projectLoadingSubtext">
                    プロジェクトをダウンロード中...
                </p>

            </div>

        </div>

    </div>


    <div id="downloadArea">

        <button
            id="downloadButton"
            disabled
        >
            SB3をダウンロード
        </button>

    </div>

</div>


<!-- ============================================================
     高度な設定
     ============================================================ -->

<div
    id="advancedSettingsOverlay"
    aria-hidden="true"
>

    <div
        id="advancedSettingsPanel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="advancedSettingsTitle"
    >

        <h2 id="advancedSettingsTitle">
            高度な設定
        </h2>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingCustomFps"
                    type="checkbox"
                >

                <label for="settingCustomFps">
                    60FPS
                </label>

            </div>

            <div class="advanced-setting-description">
                有効にすると1～250FPSで調整できます。
            </div>

            <div id="fpsSliderArea">

                <input
                    id="fpsSlider"
                    type="range"
                    min="1"
                    max="250"
                    step="1"
                    value="60"
                >

                <span id="fpsValue">
                    60 FPS
                </span>

            </div>

        </div>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingInterpolation"
                    type="checkbox"
                >

                <label for="settingInterpolation">
                    補間機能
                </label>

            </div>

            <div class="advanced-setting-description">
                スプライトの動きを補完し、動きを滑らかにします。
            </div>

        </div>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingHighQualityPen"
                    type="checkbox"
                >

                <label for="settingHighQualityPen">
                    ペンできれいに描画する
                </label>

            </div>

            <div class="advanced-setting-description">
                ペン描画の品質を上げます。
            </div>

        </div>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingWarpTimer"
                    type="checkbox"
                >

                <label for="settingWarpTimer">
                    Warpタイマー
                </label>

            </div>

            <div class="advanced-setting-description">
                長いループに陥っている部分を低フレームで実行しクラッシュを防ぎます。
            </div>

        </div>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingInfiniteClones"
                    type="checkbox"
                >

                <label for="settingInfiniteClones">
                    クローンの制限を解除
                </label>

            </div>

            <div class="advanced-setting-description">
                クローン数の上限を実質的に無制限にします。
            </div>

        </div>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingRemoveFencing"
                    type="checkbox"
                >

                <label for="settingRemoveFencing">
                    動く範囲と大きさの制限を解除
                </label>

            </div>

            <div class="advanced-setting-description">
                スプライトを画面外に移動し、その当たり判定を検出したり、大きさの制限を解除します。
            </div>

        </div>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingRemoveMiscLimits"
                    type="checkbox"
                >

                <label for="settingRemoveMiscLimits">
                    その他の制限を解除
                </label>

            </div>

            <div class="advanced-setting-description">
                効果音の制限とペンの大きさの制限を解除します。
            </div>

        </div>


        <div class="advanced-setting">

            <div class="advanced-setting-main">

                <input
                    id="settingTurboMode"
                    type="checkbox"
                >

                <label for="settingTurboMode">
                    ターボモード
                </label>

            </div>

            <div class="advanced-setting-description">
                スクリプト実行の待ち時間を減らし、より高速に実行します。
            </div>

        </div>


        <div class="advanced-settings-footer">

            <button
                id="advancedSettingsCloseButton"
                type="button"
            >
                閉じる
            </button>

        </div>

    </div>

</div>


<script>

"use strict";


/* ============================================================
   グローバル
   ============================================================ */

let scaffolding = null;

let projectLoaded = false;

let currentProjectId = null;

let currentProjectData = null;

let projectState = "stopped";


/* ============================================================
   高度な設定
   ============================================================ */

const advancedSettings = {

    customFps: false,

    fps: 60,

    interpolation: false,

    highQualityPen: false,

    warpTimer: false,

    infiniteClones: false,

    removeFencing: false,

    removeMiscLimits: false,

    turboMode: false

};


/* ============================================================
   DOM
   ============================================================ */

const projectIdInput =
    document.getElementById("projectIdInput");

const loadButton =
    document.getElementById("loadButton");

const statusElement =
    document.getElementById("status");

const projectTitleElement =
    document.getElementById("projectTitle");

const projectAuthorElement =
    document.getElementById("projectAuthor");

const playerArea =
    document.getElementById("playerArea");

const projectElement =
    document.getElementById("project");

const projectLoadingOverlay =
    document.getElementById("projectLoadingOverlay");

const projectLoadingText =
    document.getElementById("projectLoadingText");

const projectLoadingSubtext =
    document.getElementById("projectLoadingSubtext");

const stageToolbar =
    document.getElementById("stageToolbar");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");

const stopButton =
    document.getElementById("stopButton");

const stageStatusTurbo =
    document.getElementById("stageStatusTurbo");

const stageStatusFps =
    document.getElementById("stageStatusFps");

const stageStatusInterpolation =
    document.getElementById("stageStatusInterpolation");

const maximizeButton =
    document.getElementById("maximizeButton");

const downloadButton =
    document.getElementById("downloadButton");

const advancedSettingsButton =
    document.getElementById("advancedSettingsButton");

const advancedSettingsOverlay =
    document.getElementById("advancedSettingsOverlay");

const advancedSettingsCloseButton =
    document.getElementById("advancedSettingsCloseButton");

const settingCustomFps =
    document.getElementById("settingCustomFps");

const fpsSliderArea =
    document.getElementById("fpsSliderArea");

const fpsSlider =
    document.getElementById("fpsSlider");

const fpsValue =
    document.getElementById("fpsValue");

const settingInterpolation =
    document.getElementById("settingInterpolation");

const settingHighQualityPen =
    document.getElementById("settingHighQualityPen");

const settingWarpTimer =
    document.getElementById("settingWarpTimer");

const settingInfiniteClones =
    document.getElementById("settingInfiniteClones");

const settingRemoveFencing =
    document.getElementById("settingRemoveFencing");

const settingRemoveMiscLimits =
    document.getElementById("settingRemoveMiscLimits");

const settingTurboMode =
    document.getElementById("settingTurboMode");


/* ============================================================
   状態表示
   ============================================================ */

function updateStageStatusIndicators() {

    if (
        !stageStatusTurbo ||
        !stageStatusFps ||
        !stageStatusInterpolation
    ) {
        return;
    }


    stageStatusTurbo.classList.toggle(
        "visible",
        advancedSettings.turboMode
    );


    stageStatusFps.classList.toggle(
        "visible",
        advancedSettings.customFps
    );


    stageStatusFps.textContent =
        `${advancedSettings.fps} FPS`;


    stageStatusInterpolation.classList.toggle(
        "visible",
        advancedSettings.interpolation
    );

}


/* ============================================================
   高度な設定UI
   ============================================================ */

function updateAdvancedSettingsUI() {

    updateStageStatusIndicators();


    settingCustomFps.checked =
        advancedSettings.customFps;


    fpsSlider.value =
        String(advancedSettings.fps);


    fpsValue.textContent =
        `${advancedSettings.fps} FPS`;


    fpsSliderArea.classList.toggle(
        "visible",
        advancedSettings.customFps
    );


    settingInterpolation.checked =
        advancedSettings.interpolation;


    settingHighQualityPen.checked =
        advancedSettings.highQualityPen;


    settingWarpTimer.checked =
        advancedSettings.warpTimer;


    settingInfiniteClones.checked =
        advancedSettings.infiniteClones;


    settingRemoveFencing.checked =
        advancedSettings.removeFencing;


    settingRemoveMiscLimits.checked =
        advancedSettings.removeMiscLimits;


    settingTurboMode.checked =
        advancedSettings.turboMode;

}


/* ============================================================
   設定画面
   ============================================================ */

function openAdvancedSettings() {

    updateAdvancedSettingsUI();


    advancedSettingsOverlay.classList.add(
        "visible"
    );


    advancedSettingsOverlay.setAttribute(
        "aria-hidden",
        "false"
    );

}


function closeAdvancedSettings() {

    advancedSettingsOverlay.classList.remove(
        "visible"
    );


    advancedSettingsOverlay.setAttribute(
        "aria-hidden",
        "true"
    );

}


/* ============================================================
   高度な設定適用
   ============================================================ */

function applyAdvancedSettings() {

    if (
        !scaffolding ||
        !scaffolding.vm
    ) {
        return;
    }


    const vm =
        scaffolding.vm;

    const runtime =
        vm.runtime;


    /* FPS */

    try {

        if (
            runtime &&
            runtime.frameLoop &&
            typeof runtime.frameLoop.setFramerate ===
                "function"
        ) {

            runtime.frameLoop.setFramerate(

                advancedSettings.customFps
                    ? advancedSettings.fps
                    : 30

            );

        }

    }

    catch (error) {

        console.warn(
            "FPS設定を適用できませんでした:",
            error
        );

    }


    /* 補間 */

    try {

        if (
            typeof vm.setInterpolation ===
                "function"
        ) {

            vm.setInterpolation(
                advancedSettings.interpolation
            );

        }

    }

    catch (error) {

        console.warn(
            "補間設定を適用できませんでした:",
            error
        );

    }


    /* 高品質ペン */

    try {

        if (
            vm.renderer &&
            typeof vm.renderer.setUseHighQualityRender ===
                "function"
        ) {

            vm.renderer.setUseHighQualityRender(
                advancedSettings.highQualityPen
            );

        }

    }

    catch (error) {

        console.warn(
            "高品質ペン設定を適用できませんでした:",
            error
        );

    }


    /* Warp Timer */

    try {

        if (
            runtime &&
            typeof runtime.setCompilerOptions ===
                "function"
        ) {

            runtime.setCompilerOptions({

                warpTimer:
                    advancedSettings.warpTimer

            });

        }

    }

    catch (error) {

        console.warn(
            "Warp Timer設定を適用できませんでした:",
            error
        );

    }


    /* クローン・Fencing・その他制限 */

    try {

        if (
            runtime &&
            typeof runtime.setRuntimeOptions ===
                "function"
        ) {

            runtime.setRuntimeOptions({

                maxClones:
                    advancedSettings.infiniteClones
                        ? Infinity
                        : 300,

                fencing:
                    !advancedSettings.removeFencing,

                miscLimits:
                    !advancedSettings.removeMiscLimits

            });

        }

    }

    catch (error) {

        console.warn(
            "Runtime制限設定を適用できませんでした:",
            error
        );

    }


    /* ターボモード */

    try {

        if (
            typeof vm.setTurboMode ===
                "function"
        ) {

            vm.setTurboMode(
                advancedSettings.turboMode
            );

        }

    }

    catch (error) {

        console.warn(
            "ターボモード設定を適用できませんでした:",
            error
        );

    }

}

/* ============================================================
   ステータス
   ============================================================ */

function setStatus(text) {

    statusElement.textContent =
        text;

}


/* ============================================================
   Scaffolding初期化
   ============================================================ */

function initializeScaffolding() {

    if (scaffolding) {
        return;
    }


    if (
        typeof Scaffolding ===
            "undefined" ||
        !Scaffolding.Scaffolding
    ) {

        throw new Error(
            "TurboWarp Scaffoldingを読み込めませんでした。"
        );

    }


    scaffolding =
        new Scaffolding.Scaffolding();


    scaffolding.width =
        480;

    scaffolding.height =
        360;

    scaffolding.resizeMode =
        "preserve-ratio";

    scaffolding.editableLists =
        false;

    scaffolding.shouldConnectPeripherals =
        true;

    scaffolding.usePackagedRuntime =
        false;


    scaffolding.setup();


    scaffolding.appendTo(
        projectElement
    );


    if (
        scaffolding.storage &&
        typeof scaffolding.storage.addWebStore ===
            "function"
    ) {

        const storage =
            scaffolding.storage;


        storage.addWebStore(

            [
                storage.AssetType.ImageVector,
                storage.AssetType.ImageBitmap,
                storage.AssetType.Sound
            ],

            (asset) => {

                return (
                    "https://assets.scratch.mit.edu/internalapi/asset/" +
                    asset.assetId +
                    "." +
                    asset.dataFormat +
                    "/get/"
                );

            }

        );

    }


    scaffolding.relayout();


    applyAdvancedSettings();


    if (
        typeof ResizeObserver !==
            "undefined"
    ) {

        const observer =
            new ResizeObserver(
                () => {

                    if (scaffolding) {

                        scaffolding.relayout();

                    }

                }
            );


        observer.observe(
            projectElement
        );

    }

}


/* ============================================================
   古い変数・リストを削除
   ============================================================ */

function clearProjectMonitors() {

    if (!scaffolding) {
        return;
    }


    if (scaffolding._monitors) {

        for (
            const monitor
            of scaffolding._monitors.values()
        ) {

            if (
                monitor &&
                monitor.root
            ) {

                monitor.root.remove();

            }

        }


        scaffolding._monitors.clear();

    }


    if (scaffolding._monitorOverlay) {

        scaffolding._monitorOverlay.replaceChildren();

    }

}


/* ============================================================
   コントロール状態
   ============================================================ */

function updateControlButtons() {

    startButton.disabled =
        !projectLoaded;


    startButton.classList.toggle(
        "running",
        projectState === "running"
    );


    pauseButton.innerHTML =
        "";


    const icon =
        document.createElement(
            "span"
        );


    if (
        projectState === "paused"
    ) {

        icon.className =
            "play-icon";

        pauseButton.title =
            "再開";

        pauseButton.disabled =
            false;

    }

    else {

        icon.className =
            "pause-icon";

        pauseButton.title =
            "一時停止";

        pauseButton.disabled =
            projectState !== "running";

    }


    pauseButton.appendChild(
        icon
    );


    stopButton.disabled =
        !projectLoaded;

}


/* ============================================================
   開始
   ============================================================ */

function startProject() {

    if (
        !scaffolding ||
        !projectLoaded
    ) {
        return;
    }


    /*
     * 一時停止中に緑旗を押した場合は
     * 最初から開始する。
     */

    if (
        projectState === "paused"
    ) {

        scaffolding.stopAll();

    }


    scaffolding.greenFlag();


    projectState =
        "running";


    updateControlButtons();


    setStatus(
        "実行中"
    );

}


/* ============================================================
   一時停止
   ============================================================ */

function pauseProject() {

    if (
        !scaffolding ||
        projectState !== "running"
    ) {
        return;
    }


    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;


    if (
        runtime &&
        runtime.frameLoop
    ) {

        runtime.frameLoop.stop();

    }


    projectState =
        "paused";


    updateControlButtons();


    setStatus(
        "一時停止中"
    );

}


/* ============================================================
   再開
   ============================================================ */

function resumeProject() {

    if (
        !scaffolding ||
        projectState !== "paused"
    ) {
        return;
    }


    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;


    if (
        runtime &&
        runtime.frameLoop
    ) {

        runtime.frameLoop.start();

    }


    projectState =
        "running";


    updateControlButtons();


    setStatus(
        "実行中"
    );

}


/* ============================================================
   停止
   ============================================================ */

function stopProject() {

    if (
        !scaffolding ||
        !projectLoaded
    ) {
        return;
    }


    scaffolding.stopAll();


    projectState =
        "stopped";


    updateControlButtons();


    setStatus(
        "停止中"
    );

}


/* ============================================================
   メタデータ取得
   ============================================================ */

async function getProjectMetadata(
    projectId
) {

    const response =
        await fetch(
            `https://trampoline.turbowarp.org/api/projects/${projectId}`
        );


    if (
        response.status === 404
    ) {

        throw new Error(
            "プロジェクトが存在しないか、共有されていません。"
        );

    }


    if (
        !response.ok
    ) {

        throw new Error(
            `プロジェクト情報の取得に失敗しました。HTTP ${response.status}`
        );

    }


    return await response.json();

}


/* ============================================================
   SB3取得
   ============================================================ */

async function getProjectData(
    projectId,
    metadata
) {

    const token =
        metadata.project_token;


    if (!token) {

        throw new Error(
            "project_tokenを取得できませんでした。"
        );

    }


    const response =
        await fetch(
            `https://projects.scratch.mit.edu/${projectId}?token=${token}`
        );


    if (
        !response.ok
    ) {

        throw new Error(
            `SB3の取得に失敗しました。HTTP ${response.status}`
        );

    }


    /*
     * ========================================================
     * SB3ダウンロード進捗
     * ========================================================
     *
     * Content-Lengthと実際のresponse.bodyのサイズが
     * 圧縮などの影響で一致しない場合がある。
     *
     * そのため、必ず
     *
     *     a <= b
     *
     * になるように分母を補正する。
     */

    if (projectLoadingSubtext) {

        projectLoadingSubtext.textContent =
            "プロジェクトをダウンロード中...";

    }


    const contentLength =
        Number(
            response.headers.get(
                "content-length"
            )
        ) || 0;


    const declaredTotalKB =
        contentLength > 0

            ? Math.max(
                1,
                Math.ceil(
                    contentLength / 1024
                )
            )

            : 0;


    /*
     * response.bodyが利用できない場合
     */

    if (
        !response.body ||
        typeof response.body.getReader !==
            "function"
    ) {

        const buffer =
            await response.arrayBuffer();


        const finalKB =
            Math.max(
                1,
                Math.ceil(
                    buffer.byteLength / 1024
                )
            );


        if (projectLoadingSubtext) {

            projectLoadingSubtext.textContent =
                `プロジェクトをダウンロード中 (${finalKB}/${finalKB})...`;

        }


        return buffer;

    }


    const reader =
        response.body.getReader();


    const chunks = [];


    let receivedBytes =
        0;


    while (true) {

        const {
            done,
            value
        } = await reader.read();


        if (done) {
            break;
        }


        if (value) {

            chunks.push(
                value
            );


            receivedBytes +=
                value.byteLength;

        }


        /*
         * 現在受信したKB
         */

        const receivedKB =
            Math.max(
                0,
                Math.ceil(
                    receivedBytes / 1024
                )
            );


        /*
         * ここが今回の重要部分。
         *
         * Content-Lengthが318KBなのに、
         * 実際の受信量が1000KBになった場合、
         *
         * 1000/318
         *
         * とはせず、
         *
         * 1000/1000
         *
         * とする。
         */

        const totalKB =
            Math.max(
                1,
                declaredTotalKB,
                receivedKB
            );


        /*
         * 念のためaをb以下に制限
         */

        const displayCurrent =
            Math.min(
                receivedKB,
                totalKB
            );


        if (projectLoadingSubtext) {

            projectLoadingSubtext.textContent =
                `プロジェクトをダウンロード中 (${displayCurrent}/${totalKB})...`;

        }

    }


    /*
     * 受信したチャンクを1つのUint8Arrayに結合
     */

    const result =
        new Uint8Array(
            receivedBytes
        );


    let offset =
        0;


    for (
        const chunk
        of chunks
    ) {

        result.set(
            chunk,
            offset
        );


        offset +=
            chunk.byteLength;

    }


    /*
     * 完了時は必ず
     *
     *     a/a
     *
     * にする。
     */

    const finalKB =
        Math.max(
            1,
            Math.ceil(
                receivedBytes / 1024
            )
        );


    if (projectLoadingSubtext) {

        projectLoadingSubtext.textContent =
            `プロジェクトをダウンロード中 (${finalKB}/${finalKB})...`;

    }


    return result.buffer;

}


/* ============================================================
   読み込み画面
   ============================================================ */

function showProjectLoading() {

    if (!projectLoadingOverlay) {
        return;
    }


    projectLoadingOverlay.classList.add(
        "visible"
    );


    projectLoadingOverlay.setAttribute(
        "aria-busy",
        "true"
    );


    if (projectLoadingText) {

        projectLoadingText.textContent =
            "プロジェクトを読み込み中...";

    }


    if (projectLoadingSubtext) {

        projectLoadingSubtext.textContent =
            "プロジェクトをダウンロード中...";

    }

}


function hideProjectLoading() {

    if (!projectLoadingOverlay) {
        return;
    }


    projectLoadingOverlay.classList.remove(
        "visible"
    );


    projectLoadingOverlay.setAttribute(
        "aria-busy",
        "false"
    );

}


/* ============================================================
   プロジェクト読み込み
   ============================================================ */

async function loadProject(
    projectId
) {

    initializeScaffolding();


    /*
     * ステージ部分を読み込み画面にする
     */

    showProjectLoading();


    loadButton.disabled =
        true;


    downloadButton.disabled =
        true;


    /*
     * 古いプロジェクト停止
     */

    if (
        scaffolding &&
        projectLoaded
    ) {

        scaffolding.stopAll();

    }


    /*
     * 古い変数・リスト削除
     */

    clearProjectMonitors();


    projectState =
        "stopped";


    updateControlButtons();


    try {

        /*
         * ----------------------------------------------------
         * メタデータ
         * ----------------------------------------------------
         */

        setStatus(
            "プロジェクト情報を取得しています..."
        );


        const metadata =
            await getProjectMetadata(
                projectId
            );


        const title =
            metadata.title ??
            "タイトル不明";


        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectTitleElement.textContent =
            title;


        projectAuthorElement.textContent =
            `作者: ${author}`;


        /*
         * ----------------------------------------------------
         * SB3
         * ----------------------------------------------------
         */

        setStatus(
            "プロジェクトデータを取得しています..."
        );


        const sb3Buffer =
            await getProjectData(
                projectId,
                metadata
            );


        currentProjectData =
            sb3Buffer;


        currentProjectId =
            projectId;


        /*
         * ----------------------------------------------------
         * Scaffolding
         * ----------------------------------------------------
         */

        setStatus(
            "TurboWarp Playerに読み込んでいます..."
        );


        await scaffolding.loadProject(
            sb3Buffer
        );


        /*
         * プロジェクト読み込み後に
         * 高度な設定を再適用
         */

        applyAdvancedSettings();


        /*
         * レイアウト
         */

        scaffolding.relayout();


        requestAnimationFrame(
            () => {

                if (scaffolding) {

                    scaffolding.relayout();

                }

            }
        );


        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    () => {

                        if (scaffolding) {

                            scaffolding.relayout();

                        }

                    }
                );

            }
        );


        /*
         * 完了
         */

        projectLoaded =
            true;


        projectState =
            "stopped";


        downloadButton.disabled =
            false;


        updateControlButtons();


        setStatus(
            "読み込み完了"
        );

    }

    catch (error) {

        console.error(
            "loadProject error:",
            error
        );


        projectLoaded =
            false;


        currentProjectData =
            null;


        currentProjectId =
            null;


        projectState =
            "stopped";


        projectTitleElement.textContent =
            "";


        projectAuthorElement.textContent =
            "";


        updateControlButtons();


        setStatus(
            "エラー: " +
            (
                error.message ||
                String(error)
            )
        );

    }

    finally {

        /*
         * 成功・失敗どちらでも
         * 読み込み画面を終了
         */

        hideProjectLoading();


        loadButton.disabled =
            false;

    }

}


/* ============================================================
   最大化サイズ
   ============================================================ */

function calculateMaxStageSize() {

    const toolbarHeight =
        40;


    const availableWidth =
        window.innerWidth;


    const availableHeight =
        window.innerHeight -
        toolbarHeight;


    let width =
        availableWidth;


    let height =
        width * 3 / 4;


    if (
        height >
        availableHeight
    ) {

        height =
            availableHeight;


        width =
            height * 4 / 3;

    }


    return {

        width:
            Math.floor(
                width
            ),

        height:
            Math.floor(
                height
            )

    };

}


/* ============================================================
   レイアウト
   ============================================================ */

function applyStageLayout() {

    if (!scaffolding) {
        return;
    }


    /*
     * 通常サイズ
     */

    if (
        !playerArea.classList.contains(
            "maximized"
        )
    ) {

        playerArea.style.width =
            "480px";


        playerArea.style.height =
            "";


        stageToolbar.style.width =
            "480px";


        projectElement.style.width =
            "480px";


        projectElement.style.height =
            "360px";


        scaffolding.relayout();


        requestAnimationFrame(
            () => {

                if (
                    scaffolding &&
                    !playerArea.classList.contains(
                        "maximized"
                    )
                ) {

                    scaffolding.relayout();

                }

            }
        );


        return;

    }


    /*
     * 最大化
     */

    const size =
        calculateMaxStageSize();


    playerArea.style.width =
        `${size.width}px`;


    playerArea.style.height =
        `${size.height + 40}px`;


    stageToolbar.style.width =
        `${size.width}px`;


    projectElement.style.width =
        `${size.width}px`;


    projectElement.style.height =
        `${size.height}px`;


    scaffolding.relayout();


    requestAnimationFrame(
        () => {

            if (scaffolding) {

                scaffolding.relayout();

            }

        }
    );

}


/* ============================================================
   最大化切り替え
   ============================================================ */

function toggleMaximize() {

    const isMaximized =
        playerArea.classList.contains(
            "maximized"
        );


    if (isMaximized) {

        playerArea.classList.remove(
            "maximized"
        );


        playerArea.style.width =
            "480px";


        playerArea.style.height =
            "";


        stageToolbar.style.width =
            "480px";


        projectElement.style.width =
            "480px";


        projectElement.style.height =
            "360px";


        maximizeButton.textContent =
            "⤡";


        maximizeButton.title =
            "最大化";

    }

    else {

        playerArea.classList.add(
            "maximized"
        );


        maximizeButton.textContent =
            "⤢";


        maximizeButton.title =
            "元のサイズに戻す";

    }


    applyStageLayout();

}


/* ============================================================
   SB3ダウンロード
   ============================================================ */

function downloadProject() {

    if (
        !currentProjectData ||
        !currentProjectId
    ) {

        return;

    }


    const blob =
        new Blob(
            [
                currentProjectData
            ],
            {
                type:
                    "application/octet-stream"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        `${currentProjectId}.sb3`;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* ============================================================
   FPS切り替え
   ============================================================ */

function toggle60FpsModeFromFlag() {

    /*
     * OFF → 60FPS
     *
     * ON → 30FPS
     */

    advancedSettings.customFps =
        !advancedSettings.customFps;


    if (
        advancedSettings.customFps
    ) {

        advancedSettings.fps =
            60;

    }


    refreshAdvancedSettings();

}


/* ============================================================
   イベント
   ============================================================ */


/* 読み込み */

loadButton.addEventListener(
    "click",
    () => {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );


            return;

        }


        loadProject(
            projectId
        );

    }
);


/* Enter */

projectIdInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key ===
            "Enter"
        ) {

            loadButton.click();

        }

    }
);


/* ============================================================
   緑旗
   ============================================================ */

/*
 * 通常の左クリック
 *     → プロジェクトを実行
 *
 * Shift + 左クリック
 *     → ターボモードだけ切り替え
 *     → プロジェクトは実行しない
 *
 * 右クリック
 *     → FPSだけ切り替え
 *
 * Shift + 右クリック
 *     → ターボモード切り替え
 *     → FPSも同時に切り替え
 */

startButton.addEventListener(
    "contextmenu",
    (event) => {

        event.preventDefault();

        event.stopPropagation();


        /*
         * Shift + 右クリック
         */

        if (
            event.shiftKey
        ) {

            advancedSettings.turboMode =
                !advancedSettings.turboMode;


            toggle60FpsModeFromFlag();


            return;

        }


        /*
         * 右クリックのみ
         */

        toggle60FpsModeFromFlag();

    }
);


startButton.addEventListener(
    "click",
    (event) => {

        /*
         * Shift + 左クリック
         *
         * ターボモードだけ切り替える。
         *
         * startProject()を呼ばないので、
         * 緑旗によるプロジェクト開始は発生しない。
         */

        if (
            event.shiftKey
        ) {

            event.preventDefault();

            event.stopPropagation();


            advancedSettings.turboMode =
                !advancedSettings.turboMode;


            refreshAdvancedSettings();


            return;

        }


        /*
         * 通常の左クリック
         */

        startProject();

    }
);


/* ============================================================
   一時停止 / 再開
   ============================================================ */

pauseButton.addEventListener(
    "click",
    () => {

        if (
            projectState ===
            "running"
        ) {

            pauseProject();

        }

        else if (
            projectState ===
            "paused"
        ) {

            resumeProject();

        }

    }
);


/* ============================================================
   停止
   ============================================================ */

stopButton.addEventListener(
    "click",
    () => {

        stopProject();

    }
);


/* ============================================================
   最大化
   ============================================================ */

maximizeButton.addEventListener(
    "click",
    () => {

        toggleMaximize();

    }
);


/* ============================================================
   SB3ダウンロード
   ============================================================ */

downloadButton.addEventListener(
    "click",
    () => {

        downloadProject();

    }
);


/* ============================================================
   ウィンドウサイズ変更
   ============================================================ */

window.addEventListener(
    "resize",
    () => {

        if (scaffolding) {

            applyStageLayout();

        }

    }
);


/* ============================================================
   初期状態
   ============================================================ */

updateControlButtons();


setStatus(
    "プロジェクトIDを入力してください。"
);

</script>

</body>
</html>
