<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurboWarp Project Player</title>


    <!-- =====================================================
         TurboWarp Scaffolding
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>


    <style>

        /* =====================================================
           基本
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;

        }


        body {

            background: #f5f5f5;

            color: #222;

            font-family:
                Arial,
                "Noto Sans JP",
                sans-serif;

        }


        /* =====================================================
           上部UI
           ===================================================== */

        #controlPanel {

            width: min(900px, calc(100vw - 40px));

            margin: 20px auto 10px auto;

            display: flex;

            align-items: center;

            gap: 8px;

        }


        #projectIdInput {

            flex: 1;

            min-width: 0;

            height: 40px;

            padding: 0 12px;

            font-size: 18px;

            border: 1px solid #aaa;

            border-radius: 5px;

            outline: none;

        }


        #projectIdInput:focus {

            border-color: #555;

        }


        #controlPanel button {

            height: 40px;

            padding: 0 15px;

            border: none;

            border-radius: 5px;

            background: #333;

            color: white;

            font-size: 15px;

            cursor: pointer;

            white-space: nowrap;

        }


        #controlPanel button:hover {

            background: #555;

        }


        #controlPanel button:disabled {

            background: #999;

            cursor: default;

        }


        /* =====================================================
           ステータス
           ===================================================== */

        #status {

            width: min(900px, calc(100vw - 40px));

            min-height: 24px;

            margin: 0 auto;

            font-size: 16px;

        }


        /* =====================================================
           プロジェクト情報
           ===================================================== */

        #projectInfo {

            width: min(900px, calc(100vw - 40px));

            margin: 4px auto 0 auto;

            font-size: 14px;

        }


        /* =====================================================
           ステージ全体
           
           通常時：
           
               ┌─────────────────────────┐
               │ 操作             最大化 │
               ├─────────────────────────┤
               │                         │
               │        PROJECT          │
               │                         │
               └─────────────────────────┘
           
           stageContainer自体は
           ステージと同じ480px幅。
           ===================================================== */

        #stageContainer {

            --stage-width: 480px;
            --stage-height: 360px;

            width: 480px;

            margin: 15px auto 0 auto;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        /* =====================================================
           操作バー
           
           ステージより上に配置
           ===================================================== */

        #stageToolbar {

            width: 480px;

            height: 52px;

            flex: 0 0 52px;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        /* =====================================================
           左側操作ボタン
           
           将来ここに
           
           ▶ スタート
           ⏸ 一時停止
           ■ 停止
           
           を追加する
           ===================================================== */

        #stageControls {

            height: 52px;

            display: flex;

            align-items: center;

            gap: 6px;

        }


        /* =====================================================
           将来の操作ボタン共通
           ===================================================== */

        .stage-button {

            width: 42px;

            height: 42px;

            padding: 0;

            border: 1px solid #d0d0d0;

            border-radius: 5px;

            background: white;

            color: #555;

            font-size: 22px;

            line-height: 40px;

            text-align: center;

            cursor: pointer;

        }


        .stage-button:hover {

            background: #f0f0f0;

        }


        /* =====================================================
           最大化ボタン
           
           必ずステージ右端と同じ位置
           ===================================================== */

        #maximizeButton {

            width: 42px;

            height: 42px;

            flex: 0 0 42px;

            padding: 0;

            border: 1px solid #d0d0d0;

            border-radius: 5px;

            background: white;

            color: #555;

            font-size: 23px;

            line-height: 40px;

            text-align: center;

            cursor: pointer;

            user-select: none;

        }


        #maximizeButton:hover {

            background: #f0f0f0;

        }


        /* =====================================================
           TurboWarpステージ本体
           
           ★ここが重要
           
           必ず480×360
           
           Scaffoldingが生成する要素は
           この領域いっぱいにする。
           ===================================================== */

        #project {

            width: 480px !important;

            height: 360px !important;

            flex: 0 0 480px;

            position: relative;

            overflow: hidden;

            background: black;

        }


        /*
         * Scaffoldingが #project の中に生成する
         * root要素を親いっぱいにする。
         */

        #project > * {

            width: 100% !important;

            height: 100% !important;

        }


        /* =====================================================
           最大化モード
           ===================================================== */

        body.maximized-mode {

            width: 100vw;

            height: 100vh;

            overflow: hidden;

            background: black;

        }


        /*
         * 最大化時はstageContainerを
         * 「画面全体の配置領域」にする。
         *
         * ただしstageContainer自身を
         * ステージサイズにはしない。
         *
         * これが前回との大きな違い。
         */

        body.maximized-mode #stageContainer {

            position: fixed;

            left: 0;

            top: 0;

            width: 100vw;

            height: 100vh;

            margin: 0;

            padding: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background: black;

            z-index: 9999;

        }


        /*
         * 最大化時の操作バー
         *
         * JSで実際のステージ幅に合わせる。
         */

        body.maximized-mode #stageToolbar {

            width: var(--stage-width);

            height: 52px;

            flex: 0 0 52px;

        }


        /*
         * 最大化時のproject
         */

        body.maximized-mode #project {

            width: var(--stage-width) !important;

            height: var(--stage-height) !important;

            flex: 0 0 var(--stage-height);

        }


        /*
         * 最大化中はページ側UIを隠す
         */

        body.maximized-mode #controlPanel,
        body.maximized-mode #status,
        body.maximized-mode #projectInfo {

            display: none;

        }


        /* =====================================================
           最大化中のScaffolding内部
           ===================================================== */

        body.maximized-mode #project > * {

            width: 100% !important;

            height: 100% !important;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         ID入力
         ===================================================== -->

    <div id="controlPanel">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch のプロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

        <button id="stopButton">
            停止
        </button>

        <button
            id="downloadSb3Button"
            disabled
        >
            SB3ダウンロード
        </button>

    </div>


    <!-- =====================================================
         ステータス
         ===================================================== -->

    <div id="status">
        TurboWarp Playerを初期化しています...
    </div>


    <!-- =====================================================
         プロジェクト情報
         ===================================================== -->

    <div id="projectInfo"></div>


    <!-- =====================================================
         ステージ
         ===================================================== -->

    <div id="stageContainer">


        <!-- =================================================
             操作バー
             ================================================= -->

        <div id="stageToolbar">


            <!-- =============================================
                 左側操作ボタン

                 今後ここに追加する

                 スタート
                 一時停止
                 停止

                 ============================================= -->

            <div id="stageControls">

                <!--
                <button
                    class="stage-button"
                    id="startButton"
                >
                    ▶
                </button>

                <button
                    class="stage-button"
                    id="pauseButton"
                >
                    ⏸
                </button>

                <button
                    class="stage-button"
                    id="stageStopButton"
                >
                    ■
                </button>
                -->

            </div>


            <!-- =============================================
                 最大化
                 ============================================= -->

            <button
                id="maximizeButton"
                type="button"
                title="ステージを拡大"
                aria-label="ステージを拡大"
            >
                ⤡
            </button>


        </div>


        <!-- =================================================
             Scaffoldingの配置場所
             ================================================= -->

        <div id="project"></div>


    </div>



<script>

    /* =====================================================
       DOM
       ===================================================== */

    const projectIdInput =
        document.getElementById(
            "projectIdInput"
        );


    const loadButton =
        document.getElementById(
            "loadButton"
        );


    const stopButton =
        document.getElementById(
            "stopButton"
        );


    const downloadSb3Button =
        document.getElementById(
            "downloadSb3Button"
        );


    const maximizeButton =
        document.getElementById(
            "maximizeButton"
        );


    const statusElement =
        document.getElementById(
            "status"
        );


    const projectInfo =
        document.getElementById(
            "projectInfo"
        );


    const projectElement =
        document.getElementById(
            "project"
        );


    const stageContainer =
        document.getElementById(
            "stageContainer"
        );


    const stageToolbar =
        document.getElementById(
            "stageToolbar"
        );


    /* =====================================================
       変数
       ===================================================== */

    let scaffolding = null;

    let currentProjectId = null;

    let currentProjectToken = null;

    let currentSb3Url = null;


    /* =====================================================
       ステータス
       ===================================================== */

    function setStatus(text) {

        statusElement.textContent = text;

    }


    /* =====================================================
       Scaffolding初期化
       ===================================================== */

    function initializeScaffolding() {

        if (
            typeof window.Scaffolding ===
            "undefined"
        ) {

            throw new Error(
                "TurboWarp Scaffoldingが読み込まれていません。"
            );

        }


        if (
            typeof window.Scaffolding.Scaffolding !==
            "function"
        ) {

            throw new Error(
                "Scaffolding.Scaffolding が見つかりません。"
            );

        }


        /* -------------------------------------------------
           Scaffolding生成
           ------------------------------------------------- */

        scaffolding =
            new window.Scaffolding.Scaffolding();


        /* -------------------------------------------------
           Scratch標準サイズ
           ------------------------------------------------- */

        scaffolding.width = 480;

        scaffolding.height = 360;


        /* -------------------------------------------------
           比率維持
           ------------------------------------------------- */

        scaffolding.resizeMode =
            "preserve-ratio";


        scaffolding.editableLists =
            false;


        scaffolding.shouldConnectPeripherals =
            true;


        scaffolding.usePackagedRuntime =
            false;


        /* -------------------------------------------------
           初期化
           ------------------------------------------------- */

        scaffolding.setup();


        /* -------------------------------------------------
           #projectへ配置
           ------------------------------------------------- */

        scaffolding.appendTo(
            projectElement
        );


        /* -------------------------------------------------
           Scratch Asset
           ------------------------------------------------- */

        if (
            scaffolding.storage &&
            typeof scaffolding.storage.addWebStore ===
            "function"
        ) {

            const storage =
                scaffolding.storage;


            storage.addWebStore(

                [
                    storage.AssetType.ImageVector,
                    storage.AssetType.ImageBitmap,
                    storage.AssetType.Sound
                ],

                (asset) => {

                    return (
                        "https://assets.scratch.mit.edu/internalapi/asset/" +
                        asset.assetId +
                        "." +
                        asset.dataFormat +
                        "/get/"
                    );

                }

            );

        }


        /* -------------------------------------------------
           初期サイズ
           ------------------------------------------------- */

        setNormalStageSize();


        requestAnimationFrame(
            () => {

                scaffolding.relayout();

            }
        );

    }


    /* =====================================================
       通常時サイズ
       ===================================================== */

    function setNormalStageSize() {

        const width = 480;

        const height = 360;


        stageContainer.style.setProperty(
            "--stage-width",
            `${width}px`
        );


        stageContainer.style.setProperty(
            "--stage-height",
            `${height}px`
        );


        stageContainer.style.width =
            `${width}px`;


        stageToolbar.style.width =
            `${width}px`;


        projectElement.style.setProperty(
            "width",
            `${width}px`,
            "important"
        );


        projectElement.style.setProperty(
            "height",
            `${height}px`,
            "important"
        );


        projectElement.style.flex =
            `0 0 ${height}px`;

    }


    /* =====================================================
       最大化時サイズ計算
       ===================================================== */

    function calculateMaximizedSize() {

        /*
         * 操作バーの高さ
         */

        const toolbarHeight = 52;


        /*
         * 画面サイズ
         */

        const viewportWidth =
            window.innerWidth;


        const viewportHeight =
            window.innerHeight;


        /*
         * ステージに使用できる高さ
         *
         * 操作バーを必ず上に残す
         */

        const availableHeight =
            Math.max(
                1,
                viewportHeight -
                toolbarHeight
            );


        /*
         * Scratch標準4:3
         */

        const aspectRatio =
            4 / 3;


        /*
         * 横幅いっぱいにした場合
         */

        let width =
            viewportWidth;


        let height =
            width / aspectRatio;


        /*
         * 高さが足りない場合
         */

        if (
            height >
            availableHeight
        ) {

            height =
                availableHeight;


            width =
                height *
                aspectRatio;

        }


        /*
         * 整数化
         */

        width =
            Math.floor(width);


        height =
            Math.floor(height);


        return {
            width,
            height
        };

    }


    /* =====================================================
       最大化サイズを適用
       ===================================================== */

    function setMaximizedStageSize() {

        const {
            width,
            height
        } =
            calculateMaximizedSize();


        /*
         * CSS変数
         */

        stageContainer.style.setProperty(
            "--stage-width",
            `${width}px`
        );


        stageContainer.style.setProperty(
            "--stage-height",
            `${height}px`
        );


        /*
         * 操作バー
         *
         * ステージと完全に同じ幅
         */

        stageToolbar.style.width =
            `${width}px`;


        /*
         * ステージ
         */

        projectElement.style.setProperty(
            "width",
            `${width}px`,
            "important"
        );


        projectElement.style.setProperty(
            "height",
            `${height}px`,
            "important"
        );


        projectElement.style.flex =
            `0 0 ${height}px`;

    }


    /* =====================================================
       レイアウト更新
       ===================================================== */

    function updateStageSize() {

        if (!scaffolding) {
            return;
        }


        const maximized =
            document.body.classList.contains(
                "maximized-mode"
            );


        if (maximized) {

            setMaximizedStageSize();

        }
        else {

            setNormalStageSize();

        }


        /*
         * DOMのサイズ変更後に
         * Scaffoldingへ通知
         */

        requestAnimationFrame(
            () => {

                if (scaffolding) {

                    scaffolding.relayout();

                }

            }
        );

    }


    /* =====================================================
       最大化切り替え
       ===================================================== */

    function toggleMaximize() {

        const maximized =
            document.body.classList.contains(
                "maximized-mode"
            );


        if (maximized) {

            /*
             * 最大化解除
             */

            document.body.classList.remove(
                "maximized-mode"
            );


            maximizeButton.textContent =
                "⤡";


            maximizeButton.title =
                "ステージを拡大";


            maximizeButton.setAttribute(
                "aria-label",
                "ステージを拡大"
            );

        }
        else {

            /*
             * 最大化
             */

            document.body.classList.add(
                "maximized-mode"
            );


            maximizeButton.textContent =
                "⤢";


            maximizeButton.title =
                "ステージを縮小";


            maximizeButton.setAttribute(
                "aria-label",
                "ステージを縮小"
            );

        }


        /*
         * サイズ再計算
         */

        updateStageSize();

    }


    /* =====================================================
       メタデータ取得
       ===================================================== */

    async function getProjectMetadata(
        projectId
    ) {

        const url =
            "https://trampoline.turbowarp.org/api/projects/" +
            encodeURIComponent(
                projectId
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            if (
                response.status === 404
            ) {

                throw new Error(
                    "プロジェクトが存在しないか、取得できません。"
                );

            }


            throw new Error(
                `TurboWarp API HTTP ${response.status}`
            );

        }


        return await response.json();

    }


    /* =====================================================
       SB3取得
       ===================================================== */

    async function getProjectData(
        projectId,
        projectToken
    ) {

        const url =
            "https://projects.scratch.mit.edu/" +
            encodeURIComponent(
                projectId
            ) +
            "?token=" +
            encodeURIComponent(
                projectToken
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                `SB3 HTTP ${response.status}`
            );

        }


        return await response.arrayBuffer();

    }


    /* =====================================================
       プロジェクト情報
       ===================================================== */

    function displayProjectInfo(
        metadata
    ) {

        const title =
            metadata.title ||
            "タイトル不明";


        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectInfo.textContent =
            `タイトル: ${title}　作者: ${author}`;

    }


    /* =====================================================
       SB3ダウンロード
       ===================================================== */

    function setupSb3Download(
        arrayBuffer,
        projectId
    ) {

        if (currentSb3Url) {

            URL.revokeObjectURL(
                currentSb3Url
            );

        }


        const blob =
            new Blob(
                [arrayBuffer],
                {
                    type:
                        "application/octet-stream"
                }
            );


        currentSb3Url =
            URL.createObjectURL(
                blob
            );


        downloadSb3Button.disabled =
            false;


        downloadSb3Button.onclick =
            () => {

                if (!currentSb3Url) {
                    return;
                }


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    currentSb3Url;


                link.download =
                    `${projectId}.sb3`;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();

            };

    }


    /* =====================================================
       プロジェクト読み込み
       ===================================================== */

    async function loadProject() {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;

        }


        if (
            !/^\d+$/.test(projectId)
        ) {

            setStatus(
                "プロジェクトIDは数字で入力してください。"
            );

            return;

        }


        loadButton.disabled =
            true;


        downloadSb3Button.disabled =
            true;


        try {

            /* =============================================
               メタデータ
               ============================================= */

            setStatus(
                "プロジェクト情報を取得しています..."
            );


            const metadata =
                await getProjectMetadata(
                    projectId
                );


            const projectToken =
                metadata.project_token;


            if (!projectToken) {

                throw new Error(
                    "project_tokenを取得できませんでした。"
                );

            }


            currentProjectId =
                projectId;


            currentProjectToken =
                projectToken;


            /* =============================================
               情報表示
               ============================================= */

            displayProjectInfo(
                metadata
            );


            /* =============================================
               SB3
               ============================================= */

            setStatus(
                "SB3ファイルを取得しています..."
            );


            const sb3Buffer =
                await getProjectData(
                    projectId,
                    projectToken
                );


            /* =============================================
               ダウンロード
               ============================================= */

            setupSb3Download(
                sb3Buffer,
                projectId
            );


            /* =============================================
               ステージを読み込み前の
               正常なサイズに戻す
               ============================================= */

            if (
                document.body.classList.contains(
                    "maximized-mode"
                )
            ) {

                setMaximizedStageSize();

            }
            else {

                setNormalStageSize();

            }


            /* =============================================
               Scaffolding
               ============================================= */

            setStatus(
                "プロジェクトを読み込んでいます..."
            );


            await scaffolding.loadProject(
                sb3Buffer
            );


            /* =============================================
               Scaffoldingのサイズ更新
               ============================================= */

            updateStageSize();


            /* =============================================
               Green Flag
               ============================================= */

            scaffolding.greenFlag();


            setStatus(
                "読み込み完了"
            );

        }
        catch (error) {

            console.error(
                error
            );


            setStatus(
                "読み込みに失敗しました: " +
                error.message
            );

        }
        finally {

            loadButton.disabled =
                false;

        }

    }


    /* =====================================================
       停止
       ===================================================== */

    function stopProject() {

        if (!scaffolding) {
            return;
        }


        try {

            scaffolding.stopAll();


            setStatus(
                "プロジェクトを停止しました。"
            );

        }
        catch (error) {

            console.error(
                error
            );


            setStatus(
                "停止に失敗しました: " +
                error.message
            );

        }

    }


    /* =====================================================
       イベント
       ===================================================== */

    loadButton.addEventListener(
        "click",
        loadProject
    );


    stopButton.addEventListener(
        "click",
        stopProject
    );


    maximizeButton.addEventListener(
        "click",
        toggleMaximize
    );


    /* =====================================================
       Enterで読み込み
       ===================================================== */

    projectIdInput.addEventListener(
        "keydown",
        (event) => {

            if (
                event.key ===
                "Enter"
            ) {

                loadProject();

            }

        }
    );


    /* =====================================================
       ウィンドウサイズ変更
       ===================================================== */

    window.addEventListener(
        "resize",
        () => {

            if (
                document.body.classList.contains(
                    "maximized-mode"
                )
            ) {

                updateStageSize();

            }

        }
    );


    /* =====================================================
       初期化
       ===================================================== */

    try {

        initializeScaffolding();


        setStatus(
            "プロジェクトIDを入力してください。"
        );

    }
    catch (error) {

        console.error(
            "Scaffolding initialization error:",
            error
        );


        setStatus(
            "TurboWarp Playerの初期化に失敗しました: " +
            error.message
        );

    }

</script>

</body>

</html>
