<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TurboWarp Project Player</title>

<script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js"></script>

<style>

/* ============================================================
   基本
   ============================================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family: Arial, sans-serif;

    background: white;
    color: #222;
}

body {
    overflow-x: hidden;
}


/* UI側だけbox-sizingを使用 */

#page,
#inputArea,
#projectInfo,
#stageToolbar,
#stageControls,
#downloadArea,
button,
input {
    box-sizing: border-box;
}


/* ============================================================
   ページ
   ============================================================ */

#page {
    width: 100%;
    min-height: 100vh;

    padding: 20px;
}


/* ============================================================
   入力
   ============================================================ */

#inputArea {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;

    margin-bottom: 10px;
}

#projectIdInput {
    width: 300px;
    height: 36px;

    padding: 0 10px;

    font-size: 16px;

    border: 1px solid #aaa;
    border-radius: 4px;

    outline: none;
}

#projectIdInput:focus {
    border-color: #4a90e2;
}

#loadButton {
    height: 36px;

    padding: 0 18px;

    font-size: 15px;

    border: 1px solid #aaa;
    border-radius: 4px;

    background: #f5f5f5;

    cursor: pointer;
}

#loadButton:hover {
    background: #e8e8e8;
}

#loadButton:disabled {
    opacity: 0.6;
    cursor: default;
}


/* ============================================================
   ステータス
   ============================================================ */

#status {
    text-align: center;

    min-height: 22px;

    margin-bottom: 4px;

    font-size: 14px;
}


/* ============================================================
   プロジェクト情報
   ============================================================ */

#projectInfo {
    text-align: center;

    margin-bottom: 10px;
}

#projectTitle {
    font-size: 20px;
    font-weight: bold;
}

#projectAuthor {
    margin-top: 3px;

    font-size: 14px;

    color: #666;
}


/* ============================================================
   プレイヤー
   ============================================================ */

#playerArea {
    width: 480px;

    margin: 0 auto;

    display: flex;
    flex-direction: column;

    background: white;
}


/* ============================================================
   ツールバー
   ============================================================ */

#stageToolbar {
    width: 480px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: white;

    flex-shrink: 0;
}

#stageControls {
    width: auto;
    height: 40px;

    display: flex;
    align-items: center;

    gap: 2px;
}


/* ============================================================
   コントロールボタン
   ============================================================ */

.stage-control {
    width: 32px;
    height: 32px;

    position: relative;

    padding: 0;

    border: none;
    border-radius: 4px;

    background: transparent;

    cursor: pointer;
}

.stage-control:hover {
    background: rgba(220, 220, 220, 0.55);
}

.stage-control:disabled {
    opacity: 0.45;
    cursor: default;
}

.stage-control:disabled:hover {
    background: transparent;
}


/* ============================================================
   実行中の緑旗ボタン
   ============================================================ */

#startButton.running {
    background: rgba(205, 205, 205, 0.70);
}


/* ============================================================
   ★ 本物の緑旗アイコン
   ============================================================ */

.flag-icon {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 18px;
    height: 19px;

    transform: translate(-50%, -50%);
}


/*
 * 旗の棒
 */

.flag-icon::before {
    content: "";

    position: absolute;

    left: 2px;
    top: 0;

    width: 2px;
    height: 19px;

    background: #4caf50;

    border-radius: 1px;
}


/*
 * 旗本体
 */

.flag-icon::after {
    content: "";

    position: absolute;

    left: 4px;
    top: 1px;

    width: 13px;
    height: 9px;

    background: #4caf50;

    clip-path: polygon(
        0 0,
        100% 0,
        78% 50%,
        100% 100%,
        0 100%
    );
}


/* ============================================================
   一時停止
   ============================================================ */

.pause-icon {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 14px;
    height: 18px;

    transform: translate(-50%, -50%);
}

.pause-icon::before,
.pause-icon::after {
    content: "";

    position: absolute;

    top: 0;

    width: 5px;
    height: 18px;

    background: #f39c12;

    border-radius: 1px;
}

.pause-icon::before {
    left: 0;
}

.pause-icon::after {
    right: 0;
}


/* ============================================================
   再開
   ============================================================ */

.play-icon {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    transform: translate(-35%, -50%);

    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 13px solid #f39c12;
}


/* ============================================================
   停止
   ============================================================ */

.stop-icon {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 17px;
    height: 17px;

    transform: translate(-50%, -50%);

    background: #e53935;

    border-radius: 2px;
}


/* ============================================================
   最大化
   ============================================================ */

#maximizeButton {
    width: 32px;
    height: 32px;

    padding: 0;

    border: none;
    border-radius: 4px;

    background: transparent;

    color: #333;

    font-size: 22px;
    line-height: 32px;

    cursor: pointer;
}

#maximizeButton:hover {
    background: rgba(220, 220, 220, 0.55);
}


/* ============================================================
   ★ ステージ
   ============================================================ */

#project {
    width: 480px;
    height: 360px;

    position: relative;

    background: black;

    overflow: hidden;

    /*
     * Scaffoldingの内部要素には
     * CSSを介入させない。
     */
}


/* ============================================================
   ダウンロード
   ============================================================ */

#downloadArea {
    width: 480px;

    margin: 12px auto 0;

    text-align: center;
}

#downloadButton {
    height: 34px;

    padding: 0 16px;

    font-size: 14px;

    border: 1px solid #aaa;
    border-radius: 4px;

    background: #f5f5f5;

    cursor: pointer;
}

#downloadButton:hover {
    background: #e8e8e8;
}

#downloadButton:disabled {
    opacity: 0.5;
    cursor: default;
}


/* ============================================================
   最大化
   ============================================================ */

#playerArea.maximized {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    margin: 0;

    z-index: 1000;

    background: white;
}

#playerArea.maximized::before {
    content: "";

    position: fixed;

    left: 50%;
    top: 50%;

    width: 100vw;
    height: 100vh;

    transform: translate(-50%, -50%);

    background: white;

    z-index: -1;
}


/* ============================================================
   小さい画面
   ============================================================ */

@media (max-width: 520px) {

    #page {
        padding-left: 10px;
        padding-right: 10px;
    }

    #inputArea {
        flex-direction: column;
    }

    #projectIdInput {
        width: min(300px, 100%);
    }

    #playerArea,
    #stageToolbar,
    #downloadArea {
        width: 100%;
        max-width: 480px;
    }

    #project {
        width: 100%;
        height: auto;

        aspect-ratio: 4 / 3;
    }

    #stageToolbar {
        height: 40px;
    }

}

</style>
</head>


<body>

<div id="page">


    <!-- ======================================================
         入力
         ====================================================== -->

    <div id="inputArea">

        <input
            id="projectIdInput"
            type="text"
            placeholder="TurboWarp / Scratch プロジェクトID"
        >

        <button id="loadButton">
            読み込む
        </button>

    </div>


    <!-- ======================================================
         ステータス
         ====================================================== -->

    <div id="status"></div>


    <!-- ======================================================
         プロジェクト情報
         ====================================================== -->

    <div id="projectInfo">

        <div id="projectTitle"></div>

        <div id="projectAuthor"></div>

    </div>


    <!-- ======================================================
         プレイヤー
         ====================================================== -->

    <div id="playerArea">


        <!-- ==================================================
             ツールバー
             ================================================== -->

        <div id="stageToolbar">

            <div id="stageControls">


                <!-- 緑旗 -->
                <button
                    id="startButton"
                    class="stage-control"
                    title="開始"
                >
                    <span class="flag-icon"></span>
                </button>


                <!-- 一時停止 -->
                <button
                    id="pauseButton"
                    class="stage-control"
                    title="一時停止"
                    disabled
                >
                    <span class="pause-icon"></span>
                </button>


                <!-- 停止 -->
                <button
                    id="stopButton"
                    class="stage-control"
                    title="停止"
                    disabled
                >
                    <span class="stop-icon"></span>
                </button>

            </div>


            <!-- 最大化 -->
            <button
                id="maximizeButton"
                title="最大化"
            >⤡</button>

        </div>


        <!-- ==================================================
             TurboWarp
             ================================================== -->

        <div id="project"></div>

    </div>


    <!-- ======================================================
         ダウンロード
         ====================================================== -->

    <div id="downloadArea">

        <button
            id="downloadButton"
            disabled
        >
            SB3をダウンロード
        </button>

    </div>

</div>


<script>

"use strict";


/* ============================================================
   グローバル
   ============================================================ */

let scaffolding = null;

let projectLoaded = false;

let currentProjectId = null;

let currentProjectData = null;

let projectState = "stopped";


/* ============================================================
   DOM
   ============================================================ */

const projectIdInput =
    document.getElementById("projectIdInput");

const loadButton =
    document.getElementById("loadButton");

const statusElement =
    document.getElementById("status");

const projectTitleElement =
    document.getElementById("projectTitle");

const projectAuthorElement =
    document.getElementById("projectAuthor");

const playerArea =
    document.getElementById("playerArea");

const projectElement =
    document.getElementById("project");

const stageToolbar =
    document.getElementById("stageToolbar");

const startButton =
    document.getElementById("startButton");

const pauseButton =
    document.getElementById("pauseButton");

const stopButton =
    document.getElementById("stopButton");

const maximizeButton =
    document.getElementById("maximizeButton");

const downloadButton =
    document.getElementById("downloadButton");


/* ============================================================
   ステータス
   ============================================================ */

function setStatus(text) {

    statusElement.textContent = text;

}


/* ============================================================
   Scaffolding初期化
   ============================================================ */

function initializeScaffolding() {

    if (scaffolding) {
        return;
    }


    if (
        typeof Scaffolding === "undefined" ||
        !Scaffolding.Scaffolding
    ) {

        throw new Error(
            "TurboWarp Scaffoldingを読み込めませんでした。"
        );

    }


    scaffolding =
        new Scaffolding.Scaffolding();


    /*
     * Scratch標準サイズ
     */

    scaffolding.width = 480;
    scaffolding.height = 360;


    /*
     * 4:3を維持
     */

    scaffolding.resizeMode =
        "preserve-ratio";


    scaffolding.editableLists =
        false;

    scaffolding.shouldConnectPeripherals =
        true;

    scaffolding.usePackagedRuntime =
        false;


    /*
     * Runtime初期化
     */

    scaffolding.setup();


    /*
     * projectへ追加
     */

    scaffolding.appendTo(
        projectElement
    );


    /*
     * Scratchアセット
     */

    if (
        scaffolding.storage &&
        typeof scaffolding.storage.addWebStore === "function"
    ) {

        const storage =
            scaffolding.storage;


        storage.addWebStore(
            [
                storage.AssetType.ImageVector,
                storage.AssetType.ImageBitmap,
                storage.AssetType.Sound
            ],
            (asset) => {

                return (
                    "https://assets.scratch.mit.edu/internalapi/asset/" +
                    asset.assetId +
                    "." +
                    asset.dataFormat +
                    "/get/"
                );

            }
        );

    }


    /*
     * 初回レイアウト
     */

    scaffolding.relayout();


    /*
     * ★ projectサイズ変更を監視
     *
     * 最大化・通常化のタイミングで
     * relayoutが遅れることを防ぐ。
     */

    if (
        typeof ResizeObserver !== "undefined"
    ) {

        const observer =
            new ResizeObserver(() => {

                if (scaffolding) {

                    scaffolding.relayout();

                }

            });


        observer.observe(
            projectElement
        );

    }

}


/* ============================================================
   古い変数・リストを削除
   ============================================================ */

function clearProjectMonitors() {

    if (!scaffolding) {
        return;
    }


    if (scaffolding._monitors) {

        for (
            const monitor
            of scaffolding._monitors.values()
        ) {

            if (
                monitor &&
                monitor.root
            ) {

                monitor.root.remove();

            }

        }


        scaffolding._monitors.clear();

    }


    if (scaffolding._monitorOverlay) {

        scaffolding._monitorOverlay.replaceChildren();

    }

}


/* ============================================================
   ★ コントロール状態
   ============================================================ */

function updateControlButtons() {


    /*
     * ========================================================
     * 緑旗
     * ========================================================
     *
     * このボタンのinnerHTMLは絶対に変更しない。
     */

    startButton.disabled =
        !projectLoaded;


    startButton.classList.toggle(
        "running",
        projectState === "running"
    );


    /*
     * ========================================================
     * 一時停止
     * ========================================================
     */

    /*
     * 一時停止ボタンだけ中身を変更する。
     */

    pauseButton.innerHTML = "";


    const icon =
        document.createElement("span");


    if (
        projectState === "paused"
    ) {

        icon.className =
            "play-icon";

        pauseButton.title =
            "再開";

        pauseButton.disabled =
            false;

    }

    else {

        icon.className =
            "pause-icon";

        pauseButton.title =
            "一時停止";

        pauseButton.disabled =
            projectState !== "running";

    }


    pauseButton.appendChild(
        icon
    );


    /*
     * ========================================================
     * 停止
     * ========================================================
     */

    stopButton.disabled =
        !projectLoaded;

}


/* ============================================================
   開始
   ============================================================ */

function startProject() {

    if (
        !scaffolding ||
        !projectLoaded
    ) {
        return;
    }


    /*
     * 一時停止中
     * → 続きから再開
     */

    if (
        projectState === "paused"
    ) {

        resumeProject();

        return;

    }


    /*
     * 停止中
     * → 緑旗
     */

    if (
        projectState === "stopped"
    ) {

        scaffolding.greenFlag();


        projectState =
            "running";


        updateControlButtons();


        setStatus(
            "実行中"
        );

    }

}


/* ============================================================
   一時停止
   ============================================================ */

function pauseProject() {

    if (
        !scaffolding ||
        projectState !== "running"
    ) {
        return;
    }


    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;


    if (
        runtime &&
        runtime.frameLoop
    ) {

        runtime.frameLoop.stop();

    }


    projectState =
        "paused";


    updateControlButtons();


    setStatus(
        "一時停止中"
    );

}


/* ============================================================
   再開
   ============================================================ */

function resumeProject() {

    if (
        !scaffolding ||
        projectState !== "paused"
    ) {
        return;
    }


    const runtime =
        scaffolding.vm &&
        scaffolding.vm.runtime;


    if (
        runtime &&
        runtime.frameLoop
    ) {

        runtime.frameLoop.start();

    }


    projectState =
        "running";


    updateControlButtons();


    setStatus(
        "実行中"
    );

}


/* ============================================================
   停止
   ============================================================ */

function stopProject() {

    if (
        !scaffolding ||
        !projectLoaded
    ) {
        return;
    }


    scaffolding.stopAll();


    projectState =
        "stopped";


    updateControlButtons();


    setStatus(
        "停止中"
    );

}


/* ============================================================
   メタデータ取得
   ============================================================ */

async function getProjectMetadata(
    projectId
) {

    const response =
        await fetch(
            `https://trampoline.turbowarp.org/api/projects/${projectId}`
        );


    if (
        response.status === 404
    ) {

        throw new Error(
            "プロジェクトが存在しないか、共有されていません。"
        );

    }


    if (!response.ok) {

        throw new Error(
            `プロジェクト情報の取得に失敗しました。HTTP ${response.status}`
        );

    }


    return await response.json();

}


/* ============================================================
   SB3取得
   ============================================================ */

async function getProjectData(
    projectId,
    metadata
) {

    const token =
        metadata.project_token;


    if (!token) {

        throw new Error(
            "project_tokenを取得できませんでした。"
        );

    }


    const response =
        await fetch(
            `https://projects.scratch.mit.edu/${projectId}?token=${token}`
        );


    if (!response.ok) {

        throw new Error(
            `SB3の取得に失敗しました。HTTP ${response.status}`
        );

    }


    return await response.arrayBuffer();

}


/* ============================================================
   ★ プロジェクト読み込み
   ============================================================ */

async function loadProject(
    projectId
) {

    initializeScaffolding();


    loadButton.disabled =
        true;

    downloadButton.disabled =
        true;


    /*
     * ========================================================
     * 古いプロジェクト停止
     * ========================================================
     */

    if (
        scaffolding &&
        projectLoaded
    ) {

        scaffolding.stopAll();

    }


    /*
     * ========================================================
     * 古い変数・リスト削除
     * ========================================================
     */

    clearProjectMonitors();


    projectState =
        "stopped";


    updateControlButtons();


    try {


        /* ----------------------------------------------------
           メタデータ
           ---------------------------------------------------- */

        setStatus(
            "プロジェクト情報を取得しています..."
        );


        const metadata =
            await getProjectMetadata(
                projectId
            );


        const title =
            metadata.title ??
            "タイトル不明";


        const author =
            metadata.author?.username ??
            metadata.creator ??
            "不明";


        projectTitleElement.textContent =
            title;


        projectAuthorElement.textContent =
            `作者: ${author}`;


        /* ----------------------------------------------------
           SB3
           ---------------------------------------------------- */

        setStatus(
            "プロジェクトデータを取得しています..."
        );


        const sb3Buffer =
            await getProjectData(
                projectId,
                metadata
            );


        currentProjectData =
            sb3Buffer;

        currentProjectId =
            projectId;


        /* ----------------------------------------------------
           Scaffolding
           ---------------------------------------------------- */

        setStatus(
            "TurboWarp Playerに読み込んでいます..."
        );


        /*
         * ★ SB3読み込み
         */

        await scaffolding.loadProject(
            sb3Buffer
        );


        /*
         * ★ 読み込み直後にrelayout
         */

        scaffolding.relayout();


        /*
         * 次のフレームでも確認
         */

        requestAnimationFrame(() => {

            if (scaffolding) {

                scaffolding.relayout();

            }

        });


        /*
         * さらに次のフレームでも確認
         *
         * ブラウザによるレイアウト反映のタイミング差を吸収。
         */

        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                if (scaffolding) {

                    scaffolding.relayout();

                }

            });

        });


        /*
         * 完了
         */

        projectLoaded =
            true;

        projectState =
            "stopped";


        downloadButton.disabled =
            false;


        updateControlButtons();


        setStatus(
            "読み込み完了"
        );

    }

    catch (error) {

        console.error(
            "loadProject error:",
            error
        );


        projectLoaded =
            false;


        currentProjectData =
            null;


        currentProjectId =
            null;


        projectState =
            "stopped";


        projectTitleElement.textContent =
            "";

        projectAuthorElement.textContent =
            "";


        updateControlButtons();


        setStatus(
            "エラー: " +
            (
                error.message ||
                String(error)
            )
        );

    }

    finally {

        loadButton.disabled =
            false;

    }

}


/* ============================================================
   最大化サイズ
   ============================================================ */

function calculateMaxStageSize() {

    const toolbarHeight =
        40;


    const availableWidth =
        window.innerWidth;


    const availableHeight =
        window.innerHeight -
        toolbarHeight;


    let width =
        availableWidth;


    let height =
        width * 3 / 4;


    if (
        height > availableHeight
    ) {

        height =
            availableHeight;

        width =
            height * 4 / 3;

    }


    return {

        width: Math.floor(width),

        height: Math.floor(height)

    };

}


/* ============================================================
   レイアウト
   ============================================================ */

function applyStageLayout() {

    if (!scaffolding) {
        return;
    }


    /*
     * ========================================================
     * 通常
     * ========================================================
     */

    if (
        !playerArea.classList.contains(
            "maximized"
        )
    ) {

        playerArea.style.width =
            "480px";

        playerArea.style.height =
            "";


        stageToolbar.style.width =
            "480px";


        projectElement.style.width =
            "480px";

        projectElement.style.height =
            "360px";


        /*
         * 強制的に次のフレームで
         * Scaffoldingの実サイズを更新。
         */

        scaffolding.relayout();


        requestAnimationFrame(() => {

            if (
                scaffolding &&
                !playerArea.classList.contains(
                    "maximized"
                )
            ) {

                scaffolding.relayout();

            }

        });


        return;

    }


    /*
     * ========================================================
     * 最大化
     * ========================================================
     */

    const size =
        calculateMaxStageSize();


    playerArea.style.width =
        `${size.width}px`;

    playerArea.style.height =
        `${size.height + 40}px`;


    stageToolbar.style.width =
        `${size.width}px`;


    projectElement.style.width =
        `${size.width}px`;

    projectElement.style.height =
        `${size.height}px`;


    scaffolding.relayout();


    requestAnimationFrame(() => {

        if (scaffolding) {

            scaffolding.relayout();

        }

    });

}


/* ============================================================
   最大化切り替え
   ============================================================ */

function toggleMaximize() {

    const isMaximized =
        playerArea.classList.contains(
            "maximized"
        );


    if (isMaximized) {

        /*
         * 通常サイズ
         */

        playerArea.classList.remove(
            "maximized"
        );


        playerArea.style.width =
            "480px";

        playerArea.style.height =
            "";


        stageToolbar.style.width =
            "480px";


        projectElement.style.width =
            "480px";

        projectElement.style.height =
            "360px";


        maximizeButton.textContent =
            "⤡";

        maximizeButton.title =
            "最大化";

    }

    else {

        /*
         * 最大化
         */

        playerArea.classList.add(
            "maximized"
        );


        maximizeButton.textContent =
            "⤢";

        maximizeButton.title =
            "元のサイズに戻す";

    }


    applyStageLayout();

}


/* ============================================================
   ダウンロード
   ============================================================ */

function downloadProject() {

    if (
        !currentProjectData ||
        !currentProjectId
    ) {

        return;

    }


    const blob =
        new Blob(
            [currentProjectData],
            {
                type:
                    "application/octet-stream"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        `${currentProjectId}.sb3`;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* ============================================================
   イベント
   ============================================================ */


/*
 * 読み込み
 */

loadButton.addEventListener(
    "click",
    () => {

        const projectId =
            projectIdInput.value.trim();


        if (!projectId) {

            setStatus(
                "プロジェクトIDを入力してください。"
            );

            return;

        }


        loadProject(
            projectId
        );

    }
);


/*
 * Enter
 */

projectIdInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            loadButton.click();

        }

    }
);


/*
 * 緑旗
 */

startButton.addEventListener(
    "click",
    () => {

        startProject();

    }
);


/*
 * 一時停止 / 再開
 */

pauseButton.addEventListener(
    "click",
    () => {

        if (
            projectState === "running"
        ) {

            pauseProject();

        }

        else if (
            projectState === "paused"
        ) {

            resumeProject();

        }

    }
);


/*
 * 停止
 */

stopButton.addEventListener(
    "click",
    () => {

        stopProject();

    }
);


/*
 * 最大化
 */

maximizeButton.addEventListener(
    "click",
    () => {

        toggleMaximize();

    }
);


/*
 * ダウンロード
 */

downloadButton.addEventListener(
    "click",
    () => {

        downloadProject();

    }
);


/*
 * ウィンドウサイズ変更
 */

window.addEventListener(
    "resize",
    () => {

        if (scaffolding) {

            applyStageLayout();

        }

    }
);


/* ============================================================
   初期状態
   ============================================================ */

updateControlButtons();

setStatus(
    "プロジェクトIDを入力してください。"
);

</script>

</body>
</html>
