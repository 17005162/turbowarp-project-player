<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TurboWarp Project Player</title>


    <!-- =========================================================
         TurboWarp Scaffolding
    ========================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.2.0/dist/scaffolding-with-music.js">
    </script>


    <style>

        /* =========================================================
           基本
        ========================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;
        }


        body {

            font-family:
                Arial,
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                Meiryo,
                sans-serif;

            background: white;

            color: black;

            overflow-x: hidden;
        }


        /* =========================================================
           上部UI
        ========================================================== */

        #topArea {

            width: 100%;

            padding: 20px;
        }


        #inputArea {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 8px;

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;
        }


        #projectIdInput {

            flex: 1;

            min-width: 250px;

            height: 40px;

            padding: 0 12px;

            border:
                1px solid #aaa;

            border-radius: 6px;

            background: white;

            color: black;

            font-size: 16px;

            outline: none;
        }


        #projectIdInput:focus {

            border-color: #666;
        }


        /* =========================================================
           通常ボタン
        ========================================================== */

        #loadButton,
        #downloadButton {

            height: 40px;

            padding:
                0 16px;

            border:
                1px solid #aaa;

            border-radius: 6px;

            background: #f0f0f0;

            color: #222;

            font-size: 15px;

            cursor: pointer;
        }


        #loadButton:hover,
        #downloadButton:hover {

            background: #e2e2e2;
        }


        #loadButton:active,
        #downloadButton:active {

            background: #d5d5d5;
        }


        #loadButton:disabled,
        #downloadButton:disabled {

            opacity: 0.5;

            cursor: default;
        }


        /*
         * 上部の停止ボタンは使用しない。
         *
         * ステージ上部のTurboWarp風停止ボタンを使う。
         */
        #stopButton {

            display: none;
        }


        /* =========================================================
           ステータス
        ========================================================== */

        #status {

            width: 100%;

            max-width: 1000px;

            min-height: 24px;

            margin:
                10px auto 0;

            padding:
                0 20px;

            color: #333;

            font-size: 14px;
        }


        /* =========================================================
           プロジェクト情報
        ========================================================== */

        #projectInfo {

            display: none;

            width: 100%;

            max-width: 1000px;

            margin:
                10px auto;

            padding:
                10px 14px;

            border:
                1px solid #ddd;

            border-radius: 6px;

            background: #f5f5f5;

            color: #333;

            font-size: 14px;
        }


        #projectInfo strong {

            color: #111;
        }


        /* =========================================================
           ステージ全体
        ========================================================== */

        #stageContainer {

            width: 100%;

            margin-top: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;
        }


        /* =========================================================
           ステージツールバー
        ========================================================== */

        #stageToolbar {

            width: 480px;

            height: 46px;

            flex:
                0 0 46px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin: 0;

            padding: 0;

            background: transparent;
        }


        /* =========================================================
           TurboWarp風コントロール
        ========================================================== */

        #stageControls {

            display: flex;

            align-items: center;

            justify-content: flex-start;

            gap: 5px;

            height: 46px;

            margin: 0;

            padding: 0;
        }


        /*
         * 3つのコントロールボタン
         */

        .stageControlButton {

            width: 40px;

            height: 42px;

            margin: 0;

            padding: 0;

            border: none;

            background: transparent;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            border-radius: 5px;
        }


        .stageControlButton:hover {

            background:
                rgba(0, 0, 0, 0.06);
        }


        .stageControlButton:active {

            background:
                rgba(0, 0, 0, 0.12);
        }


        .stageControlButton:disabled {

            opacity: 0.45;

            cursor: default;
        }


        .stageControlButton:disabled:hover {

            background: transparent;
        }


        /* =========================================================
           スタートアイコン
        ========================================================== */

        .greenFlagIcon {

            position: relative;

            width: 28px;

            height: 32px;
        }


        .greenFlagIcon::before {

            content: "";

            position: absolute;

            left: 4px;

            top: 1px;

            width: 3px;

            height: 29px;

            border-radius: 2px;

            background: #555;
        }


        .greenFlagIcon::after {

            content: "";

            position: absolute;

            left: 6px;

            top: 2px;

            width: 23px;

            height: 17px;

            background: #3cb44a;

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    100% 78%,
                    72% 100%,
                    43% 82%,
                    0 100%
                );
        }


        /* =========================================================
           一時停止アイコン
        ========================================================== */

        .pauseIcon {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            width: 24px;

            height: 28px;
        }


        .pauseIcon::before,
        .pauseIcon::after {

            content: "";

            display: block;

            width: 7px;

            height: 28px;

            border-radius: 1px;

            background: #ffb000;
        }


        /* =========================================================
           停止アイコン
        ========================================================== */

        .stopIcon {

            width: 27px;

            height: 27px;

            background: #ef8f99;

            border:
                2px solid #d97882;

            clip-path:
                polygon(
                    28% 0%,
                    72% 0%,
                    100% 28%,
                    100% 72%,
                    72% 100%,
                    28% 100%,
                    0% 72%,
                    0% 28%
                );
        }


        /* =========================================================
           最大化ボタン
        ========================================================== */

        #maximizeButton {

            width: 42px;

            height: 42px;

            padding: 0;

            border:
                1px solid #d5d5d5;

            border-radius: 6px;

            background: white;

            color: #555;

            font-size: 20px;

            line-height: 1;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 1px 2px
                rgba(0, 0, 0, 0.15);
        }


        #maximizeButton:hover {

            background: #f1f1f1;
        }


        #maximizeButton:active {

            background: #e5e5e5;
        }


        /* =========================================================
           TurboWarpステージ
        ========================================================== */

        #project {

            width: 480px !important;

            height: 360px !important;

            flex:
                0 0 auto;

            position: relative;

            margin: 0;

            padding: 0;

            overflow: hidden;

            background: black;
        }


        /*
         * 重要
         *
         * Scaffolding内部には
         *
         * width: 100%;
         * height: 100%;
         *
         * をこちらから指定しない。
         *
         * Scaffolding自身が内部の
         * layersRectを計算するため。
         */


        /* =========================================================
           ダウンロード
        ========================================================== */

        #downloadArea {

            width: 480px;

            margin:
                12px auto 30px;

            display: flex;

            justify-content: flex-end;
        }


        /* =========================================================
           最大化
        ========================================================== */

        body.maximized {

            overflow: hidden;
        }


        /*
         * 通常UIを隠す
         */

        body.maximized #topArea,
        body.maximized #status,
        body.maximized #projectInfo,
        body.maximized #downloadArea {

            display: none;
        }


        /*
         * 最大化時のステージ全体
         */

        body.maximized #stageContainer {

            position: fixed;

            left: 0;

            top: 0;

            width: 100vw;

            height: 100vh;

            margin: 0;

            padding: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            background: black;

            z-index: 99999;
        }


        /*
         * 最大化時ツールバー
         */

        body.maximized #stageToolbar {

            flex:
                0 0 46px;

            height: 46px;

            margin: 0;

            padding: 0;

            background: transparent;
        }


        /*
         * 最大化時ステージ
         */

        body.maximized #project {

            flex:
                0 0 auto;

            margin: 0;

            padding: 0;

            position: relative;

            overflow: hidden;

            background: black;
        }

    </style>

</head>


<body>


    <!-- =========================================================
         上部UI
    ========================================================== -->

    <div id="topArea">

        <div id="inputArea">

            <input
                id="projectIdInput"
                type="text"
                placeholder="TurboWarp / Scratch プロジェクトID"
                autocomplete="off"
            >


            <button
                id="loadButton"
                type="button"
            >
                読み込み
            </button>


            <!--
                旧停止ボタン。
                JS互換のためDOMだけ残して非表示。
            -->

            <button
                id="stopButton"
                type="button"
                disabled
            >
                停止
            </button>

        </div>

    </div>


    <!-- =========================================================
         ステータス
    ========================================================== -->

    <div id="status">

        プロジェクトIDを入力してください。

    </div>


    <!-- =========================================================
         プロジェクト情報
    ========================================================== -->

    <div id="projectInfo"></div>


    <!-- =========================================================
         ステージ
    ========================================================== -->

    <div id="stageContainer">


        <!-- =====================================================
             ステージ上部ツールバー
        ====================================================== -->

        <div id="stageToolbar">


            <!-- 左側コントロール -->

            <div id="stageControls">


                <!-- =================================================
                     スタート
                ================================================== -->

                <button
                    id="startButton"
                    class="stageControlButton"
                    type="button"
                    title="スタート"
                >

                    <span
                        class="greenFlagIcon"
                    ></span>

                </button>


                <!-- =================================================
                     一時停止
                ================================================== -->

                <button
                    id="pauseButton"
                    class="stageControlButton"
                    type="button"
                    title="一時停止"
                    disabled
                >

                    <span
                        class="pauseIcon"
                    ></span>

                </button>


                <!-- =================================================
                     停止
                ================================================== -->

                <button
                    id="stageStopButton"
                    class="stageControlButton"
                    type="button"
                    title="停止"
                    disabled
                >

                    <span
                        class="stopIcon"
                    ></span>

                </button>


            </div>


            <!-- =================================================
                 最大化
            ================================================== -->

            <button
                id="maximizeButton"
                type="button"
                title="最大化"
            >
                ⤢
            </button>


        </div>


        <!-- =====================================================
             Scaffolding
        ====================================================== -->

        <div id="project"></div>


    </div>


    <!-- =========================================================
         ダウンロード
    ========================================================== -->

    <div id="downloadArea">

        <button
            id="downloadButton"
            type="button"
            disabled
        >
            SB3をダウンロード
        </button>

    </div>


    <script>


        /* =========================================================
           DOM
        ========================================================== */

        const projectIdInput =
            document.getElementById(
                "projectIdInput"
            );


        const loadButton =
            document.getElementById(
                "loadButton"
            );


        const stopButton =
            document.getElementById(
                "stopButton"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );


        const pauseButton =
            document.getElementById(
                "pauseButton"
            );


        const stageStopButton =
            document.getElementById(
                "stageStopButton"
            );


        const downloadButton =
            document.getElementById(
                "downloadButton"
            );


        const maximizeButton =
            document.getElementById(
                "maximizeButton"
            );


        const statusElement =
            document.getElementById(
                "status"
            );


        const projectInfoElement =
            document.getElementById(
                "projectInfo"
            );


        const projectElement =
            document.getElementById(
                "project"
            );


        const stageToolbar =
            document.getElementById(
                "stageToolbar"
            );


        /* =========================================================
           状態
        ========================================================== */

        let scaffolding = null;


        let currentProjectId = null;


        let currentSb3Buffer = null;


        let currentMetadata = null;


        let isProjectLoaded = false;


        /*
         * プロジェクト状態
         *
         * stopped
         * running
         * paused
         */

        let projectState = "stopped";


        /* =========================================================
           ステータス
        ========================================================== */

        function setStatus(text) {

            statusElement.textContent =
                text;
        }


        /* =========================================================
           Scaffolding初期化
        ========================================================== */

        function initializeScaffolding() {

            /*
             * 既に初期化済み
             */

            if (scaffolding !== null) {

                return;
            }


            try {

                scaffolding =
                    new Scaffolding.Scaffolding();


                /*
                 * Scratch標準サイズ
                 */

                scaffolding.width =
                    480;

                scaffolding.height =
                    360;


                /*
                 * 4:3維持
                 */

                scaffolding.resizeMode =
                    "preserve-ratio";


                /*
                 * リスト編集無効
                 */

                scaffolding.editableLists =
                    false;


                /*
                 * マウス・キーボード
                 */

                scaffolding.shouldConnectPeripherals =
                    true;


                /*
                 * Packaged Runtimeなし
                 */

                scaffolding.usePackagedRuntime =
                    false;


                /*
                 * 初期化
                 */

                scaffolding.setup();


                /*
                 * projectへ追加
                 */

                scaffolding.appendTo(
                    projectElement
                );


                /*
                 * Scratchアセット
                 */

                if (
                    scaffolding.storage &&
                    typeof
                        scaffolding.storage.addWebStore
                        === "function"
                ) {

                    const storage =
                        scaffolding.storage;


                    storage.addWebStore(

                        [
                            storage.AssetType.ImageVector,
                            storage.AssetType.ImageBitmap,
                            storage.AssetType.Sound
                        ],

                        asset => {

                            return (
                                "https://assets.scratch.mit.edu/internalapi/asset/" +
                                asset.assetId +
                                "." +
                                asset.dataFormat +
                                "/get/"
                            );

                        }
                    );
                }


                /*
                 * 通常サイズ
                 */

                setNormalStageSize();


                console.log(
                    "TurboWarp Scaffolding initialized."
                );


            } catch (error) {

                console.error(
                    "Scaffolding initialization error:",
                    error
                );

                throw error;
            }
        }


        /* =========================================================
           通常サイズ
        ========================================================== */

        function setNormalStageSize() {

            /*
             * ステージ
             */

            projectElement.style.setProperty(
                "width",
                "480px",
                "important"
            );


            projectElement.style.setProperty(
                "height",
                "360px",
                "important"
            );


            /*
             * ツールバー
             */

            stageToolbar.style.setProperty(
                "width",
                "480px",
                "important"
            );


            stageToolbar.style.setProperty(
                "height",
                "46px",
                "important"
            );


            /*
             * Scaffoldingに通知
             */

            if (
                scaffolding &&
                typeof
                    scaffolding.relayout ===
                    "function"
            ) {

                requestAnimationFrame(() => {

                    scaffolding.relayout();

                });
            }
        }


        /* =========================================================
           最大化サイズ
        ========================================================== */

        function setMaximizedStageSize() {

            const viewportWidth =
                window.innerWidth;


            const viewportHeight =
                window.innerHeight;


            /*
             * ツールバー高さ
             */

            let toolbarHeight =
                46;


            if (stageToolbar) {

                const rect =
                    stageToolbar.getBoundingClientRect();


                if (rect.height > 0) {

                    toolbarHeight =
                        rect.height;
                }
            }


            /*
             * ステージに使える高さ
             */

            const availableHeight =
                Math.max(
                    1,
                    viewportHeight -
                    toolbarHeight
                );


            /*
             * 4:3
             */

            let width =
                availableHeight *
                4 / 3;


            let height =
                availableHeight;


            /*
             * 横幅が画面より大きい場合
             */

            if (
                width >
                viewportWidth
            ) {

                width =
                    viewportWidth;


                height =
                    width *
                    3 / 4;
            }


            /*
             * 整数px
             */

            width =
                Math.floor(width);


            height =
                Math.floor(height);


            /*
             * project
             */

            projectElement.style.setProperty(
                "width",
                `${width}px`,
                "important"
            );


            projectElement.style.setProperty(
                "height",
                `${height}px`,
                "important"
            );


            /*
             * ツールバーも同じ幅
             */

            stageToolbar.style.setProperty(
                "width",
                `${width}px`,
                "important"
            );


            /*
             * Scaffolding再レイアウト
             */

            if (
                scaffolding &&
                typeof
                    scaffolding.relayout ===
                    "function"
            ) {

                requestAnimationFrame(() => {

                    scaffolding.relayout();

                });
            }


            console.log(
                "最大化ステージ:",
                width,
                "x",
                height
            );
        }


        /* =========================================================
           ステージサイズ更新
        ========================================================== */

        function updateStageSize() {

            if (
                document.body.classList.contains(
                    "maximized"
                )
            ) {

                setMaximizedStageSize();

            } else {

                setNormalStageSize();
            }
        }


        /* =========================================================
           最大化
        ========================================================== */

        function toggleMaximize() {

            const isMaximized =
                document.body.classList.toggle(
                    "maximized"
                );


            if (isMaximized) {

                maximizeButton.textContent =
                    "⤡";


                maximizeButton.title =
                    "最大化を解除";


                /*
                 * レイアウト確定後
                 */

                requestAnimationFrame(() => {

                    requestAnimationFrame(() => {

                        setMaximizedStageSize();

                    });

                });


            } else {

                maximizeButton.textContent =
                    "⤢";


                maximizeButton.title =
                    "最大化";


                setNormalStageSize();
            }
        }


        /* =========================================================
           メタデータ取得
        ========================================================== */

        async function getProjectMetadata(
            projectId
        ) {

            const url =
                "https://trampoline.turbowarp.org/api/projects/" +
                encodeURIComponent(
                    projectId
                );


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "プロジェクト情報の取得に失敗しました。" +
                    " HTTP " +
                    response.status
                );
            }


            return await response.json();
        }


        /* =========================================================
           SB3取得
        ========================================================== */

        async function getProjectData(
            projectId,
            projectToken
        ) {

            const url =
                "https://projects.scratch.mit.edu/" +
                encodeURIComponent(
                    projectId
                ) +
                "?token=" +
                encodeURIComponent(
                    projectToken
                );


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "SB3の取得に失敗しました。" +
                    " HTTP " +
                    response.status
                );
            }


            return await response.arrayBuffer();
        }


        /* =========================================================
           HTMLエスケープ
        ========================================================== */

        function escapeHtml(value) {

            return String(value)
                .replaceAll(
                    "&",
                    "&amp;"
                )
                .replaceAll(
                    "<",
                    "&lt;"
                )
                .replaceAll(
                    ">",
                    "&gt;"
                )
                .replaceAll(
                    '"',
                    "&quot;"
                )
                .replaceAll(
                    "'",
                    "&#039;"
                );
        }


        /* =========================================================
           プロジェクト情報
        ========================================================== */

        function displayProjectInfo(
            metadata
        ) {

            const title =
                metadata.title ||
                "無題";


            const author =
                metadata.author?.username ??
                metadata.creator ??
                "不明";


            projectInfoElement.innerHTML =
                "<strong>" +
                escapeHtml(title) +
                "</strong>" +
                "　作者: " +
                escapeHtml(author);


            projectInfoElement.style.display =
                "block";
        }


        /* =========================================================
           SB3ダウンロード
        ========================================================== */

        function downloadSb3() {

            if (!currentSb3Buffer) {

                return;
            }


            const blob =
                new Blob(
                    [currentSb3Buffer],
                    {
                        type:
                            "application/zip"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                `${currentProjectId}.sb3`;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(() => {

                URL.revokeObjectURL(
                    url
                );

            }, 1000);
        }


        /* =========================================================
           UI状態更新
        ========================================================== */

        function updateControlButtons() {

            /*
             * プロジェクト未読み込み
             */

            if (!isProjectLoaded) {

                startButton.disabled =
                    true;

                pauseButton.disabled =
                    true;

                stageStopButton.disabled =
                    true;

                return;
            }


            /*
             * 実行中
             */

            if (
                projectState ===
                "running"
            ) {

                startButton.disabled =
                    false;

                pauseButton.disabled =
                    false;

                stageStopButton.disabled =
                    false;


                pauseButton.title =
                    "一時停止";


                return;
            }


            /*
             * 一時停止中
             */

            if (
                projectState ===
                "paused"
            ) {

                startButton.disabled =
                    false;

                pauseButton.disabled =
                    false;

                stageStopButton.disabled =
                    false;


                pauseButton.title =
                    "一時停止中";


                return;
            }


            /*
             * 停止中
             */

            startButton.disabled =
                false;

            pauseButton.disabled =
                true;

            stageStopButton.disabled =
                true;
        }


        /* =========================================================
           プロジェクト読み込み
        ========================================================== */

        async function loadProject() {

            const projectId =
                projectIdInput.value.trim();


            if (!projectId) {

                setStatus(
                    "プロジェクトIDを入力してください。"
                );

                return;
            }


            /*
             * 読み込み中
             */

            loadButton.disabled =
                true;


            startButton.disabled =
                true;


            pauseButton.disabled =
                true;


            stageStopButton.disabled =
                true;


            downloadButton.disabled =
                true;


            projectInfoElement.style.display =
                "none";


            setStatus(
                "プロジェクト情報を取得しています..."
            );


            try {

                /*
                 * Scaffolding初期化
                 */

                initializeScaffolding();


                /*
                 * メタデータ
                 */

                const metadata =
                    await getProjectMetadata(
                        projectId
                    );


                currentMetadata =
                    metadata;


                /*
                 * token確認
                 */

                if (
                    !metadata.project_token
                ) {

                    throw new Error(
                        "project_tokenが取得できませんでした。"
                    );
                }


                /*
                 * 情報表示
                 */

                displayProjectInfo(
                    metadata
                );


                setStatus(
                    "SB3を取得しています..."
                );


                /*
                 * SB3
                 */

                const sb3Buffer =
                    await getProjectData(
                        projectId,
                        metadata.project_token
                    );


                currentSb3Buffer =
                    sb3Buffer;


                currentProjectId =
                    projectId;


                setStatus(
                    "TurboWarpでプロジェクトを読み込んでいます..."
                );


                /*
                 * SB3をロード
                 */

                await scaffolding.loadProject(
                    sb3Buffer
                );


                /*
                 * サイズ調整
                 */

                updateStageSize();


                /*
                 * レイアウト再計算
                 */

                requestAnimationFrame(() => {

                    if (
                        scaffolding &&
                        typeof
                            scaffolding.relayout ===
                            "function"
                    ) {

                        scaffolding.relayout();

                    }

                });


                /*
                 * ここでは自動的に
                 * greenFlagしない。
                 *
                 * 読み込み後は停止状態として、
                 * スタートボタンで開始する。
                 */

                isProjectLoaded =
                    true;


                projectState =
                    "stopped";


                downloadButton.disabled =
                    false;


                updateControlButtons();


                setStatus(
                    "プロジェクトを読み込みました。"
                    + " スタートを押すと実行します。"
                );


            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "エラー: " +
                    error.message
                );


                isProjectLoaded =
                    false;


                projectState =
                    "stopped";


                downloadButton.disabled =
                    true;


                updateControlButtons();


            } finally {

                loadButton.disabled =
                    false;
            }
        }


        /* =========================================================
           スタート
        ========================================================== */

        function startProject() {

            if (!isProjectLoaded) {

                return;
            }


            /*
             * 一時停止中
             *
             * → そのまま途中から再開
             */

            if (
                projectState ===
                "paused"
            ) {

                resumeProject();

                return;
            }


            /*
             * 停止中
             *
             * → 読み込み済みデータから
             *   greenFlag
             */

            if (
                projectState ===
                "stopped"
            ) {

                try {

                    scaffolding.greenFlag();


                    projectState =
                        "running";


                    updateControlButtons();


                    setStatus(
                        "プロジェクトを実行しています。"
                    );

                } catch (error) {

                    console.error(
                        error
                    );


                    setStatus(
                        "実行エラー: " +
                        error.message
                    );
                }
            }
        }


        /* =========================================================
           一時停止
        ========================================================== */

        function pauseProject() {

            if (
                !isProjectLoaded
            ) {

                return;
            }


            /*
             * 実行中だけ一時停止
             */

            if (
                projectState !==
                "running"
            ) {

                return;
            }


            try {

                /*
                 * Scaffolding v0.2.0の
                 * VM内部の実行ループを停止する。
                 *
                 * VMの状態・スレッド・変数等は
                 * stopAll()と違って破棄しない。
                 */

                if (
                    scaffolding.vm &&
                    scaffolding.vm.runtime &&
                    scaffolding.vm.runtime.frameLoop
                ) {

                    scaffolding.vm.runtime.frameLoop.stop();

                } else {

                    throw new Error(
                        "VMの実行ループにアクセスできません。"
                    );
                }


                projectState =
                    "paused";


                updateControlButtons();


                setStatus(
                    "一時停止中です。スタートで再開できます。"
                );


            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "一時停止エラー: " +
                    error.message
                );
            }
        }


        /* =========================================================
           再開
        ========================================================== */

        function resumeProject() {

            if (
                !isProjectLoaded
            ) {

                return;
            }


            if (
                projectState !==
                "paused"
            ) {

                return;
            }


            try {

                if (
                    scaffolding.vm &&
                    scaffolding.vm.runtime &&
                    scaffolding.vm.runtime.frameLoop
                ) {

                    /*
                     * 一時停止時に止めた
                     * 実行ループだけを再開する。
                     *
                     * greenFlag()は呼ばない。
                     *
                     * そのため現在位置から続行される。
                     */

                    scaffolding.vm.runtime.frameLoop.start();

                } else {

                    throw new Error(
                        "VMの実行ループにアクセスできません。"
                    );
                }


                projectState =
                    "running";


                updateControlButtons();


                setStatus(
                    "プロジェクトを再開しました。"
                );


            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "再開エラー: " +
                    error.message
                );
            }
        }


        /* =========================================================
           停止
        ========================================================== */

        function stopProject() {

            if (
                !isProjectLoaded
            ) {

                return;
            }


            try {

                /*
                 * 通常のScratch/TurboWarpと同じく
                 * stopAllを使用。
                 *
                 * 一時停止中でもここを通る。
                 */

                scaffolding.stopAll();


                projectState =
                    "stopped";


                updateControlButtons();


                setStatus(
                    "プロジェクトを停止しました。"
                    + " スタートで再実行できます。"
                );


            } catch (error) {

                console.error(
                    error
                );


                setStatus(
                    "停止エラー: " +
                    error.message
                );
            }
        }


        /* =========================================================
           イベント
        ========================================================== */

        /*
         * 読み込み
         */

        loadButton.addEventListener(
            "click",
            loadProject
        );


        /*
         * スタート
         */

        startButton.addEventListener(
            "click",
            startProject
        );


        /*
         * 一時停止
         */

        pauseButton.addEventListener(
            "click",
            pauseProject
        );


        /*
         * 停止
         */

        stageStopButton.addEventListener(
            "click",
            stopProject
        );


        /*
         * 旧停止ボタンとの互換
         */

        stopButton.addEventListener(
            "click",
            stopProject
        );


        /*
         * ダウンロード
         */

        downloadButton.addEventListener(
            "click",
            downloadSb3
        );


        /*
         * 最大化
         */

        maximizeButton.addEventListener(
            "click",
            toggleMaximize
        );


        /*
         * Enterで読み込み
         */

        projectIdInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    loadProject();
                }
            }
        );


        /*
         * ブラウザサイズ変更
         */

        window.addEventListener(
            "resize",
            () => {

                if (
                    document.body.classList.contains(
                        "maximized"
                    )
                ) {

                    setMaximizedStageSize();
                }
            }
        );


        /*
         * Escで最大化解除
         */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                        "Escape" &&
                    document.body.classList.contains(
                        "maximized"
                    )
                ) {

                    toggleMaximize();
                }
            }
        );


        /* =========================================================
           初期状態
        ========================================================== */

        setNormalStageSize();

        updateControlButtons();

    </script>

</body>

</html>
